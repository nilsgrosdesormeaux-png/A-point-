<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>À Point</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 40px auto;
      padding: 0 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    #message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      display: none;
    }
    .succes { background-color: #d4edda; color: #155724; }
    .erreur { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>À Point</h1>
  <p>Crée ton compte commerçant</p>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="ton@email.com">

  <label for="motdepasse">Mot de passe</label>
  <input type="password" id="motdepasse" placeholder="Au moins 6 caractères">

  <button id="btnInscription">Créer mon compte</button>

  <div id="message"></div>

  <script>
    (function () {
      var SUPABASE_URL = "https://eqvbksxfwlgbcxgqljqn.supabase.co";
      var SUPABASE_KEY = "sb_publishable_Dlh12BadZ13vHrUR0o7O7Q_i3aN2VMc";
      var sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      document.getElementById('btnInscription').addEventListener('click', function () {
        var email = document.getElementById('email').value;
        var motdepasse = document.getElementById('motdepasse').value;
        var messageDiv = document.getElementById('message');

        sbClient.auth.signUp({
          email: email,
          password: motdepasse
        }).then(function (result) {
          messageDiv.style.display = 'block';
          if (result.error) {
            messageDiv.className = 'erreur';
            messageDiv.textContent = "Erreur : " + result.error.message;
          } else {
            messageDiv.className = 'succes';
            messageDiv.textContent = "Compte créé ! Vérifie ta boîte email pour confirmer.";
          }
        });
      });
    })();
  </script>
</body>
</html>
