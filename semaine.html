<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>À Point - Semaine</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css?v=20261101r">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="moteur-prevision.js?v=20261101r"></script>
  <script src="boulangerie.js?v=20261101l"></script>
  <script src="commandes-clients.js?v=20261101a"></script>
  <script src="contexte.js?v=20261101s"></script>
  <script src="nav.js?v=20261101q"></script>
</head>
<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>
  <header class="entete-site">
    <a href="previsions.html" class="logo" aria-label="À Point, accueil">
      <svg class="logo-marque" viewBox="0 0 100 100" width="24" height="24" aria-hidden="true">
        <path d="M50 12 L16 86" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none"/>
        <path d="M50 12 L84 86" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none"/>
        <circle cx="50" cy="56" r="8" fill="currentColor"/>
      </svg>
      <span class="logo-texte">À Point</span>
    </a>
    <nav id="navPrincipale"></nav>
  </header>

  <div id="contenu" role="main" class="conteneur conteneur--large">
    <div class="entete-page">
      <div>
        <h1>Les 7 jours qui viennent</h1>
        <p class="texte-aide" style="margin:0;">Affluence et production prévues <span class="etiquette-mesure etiquette-mesure--estime">estimé</span></p>
      </div>
    </div>
    <p id="statutConnexion" class="texte-aide">Chargement…</p>

    <section id="zoneSemaine" hidden aria-label="Semaine">
      <ol class="affluence" id="affluence"></ol>

      <h2>Production prévue</h2>
      <div class="tableau-semaine-defilement" tabindex="0" role="region" aria-label="Production par produit et par jour">
        <table class="tableau-semaine" id="tableauSemaine"></table>
      </div>

      <div class="bloc-pont-commandes">
        <a class="btn-cta-commandes" href="commandes.html?jours=7">Préparer la commande de la semaine</a>
      </div>
    </section>
  </div>

  <script>
    (function () {
      var MP = window.MoteurPrevision;
      var B = window.Boulangerie;
      var C = window.ContexteBoulangerie;
      var statutDiv = document.getElementById('statutConnexion');
      var ctx = null;

      function echapper(t) {
        return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
      }

      // Volume « normal » d'un jour de semaine : moyenne pondérée des totaux
      // des mêmes jours ordinaires passés, avec la même marge de production.
      function volumeNormal(numeroJour) {
        var totaux = {};
        // Mêmes produits que les totaux affichés : seulement ce qui passe au four
        // (sinon les cafés gonflaient le « normal » et chaque jour semblait calme).
        ctx.ventes.forEach(function (v) {
          if (!C.estCuitPour(ctx, MP.formatNomAffichage(v.nom_produit))) return;
          totaux[v.date_vente] = (totaux[v.date_vente] || 0) + v.quantite;
        });
        var base = Object.keys(totaux).sort().filter(function (iso) {
          var d = new Date(iso + 'T00:00:00');
          return d.getDay() === numeroJour && MP.estJourOrdinaire(d, ctx.zoneVacances);
        }).map(function (iso) { return { date_vente: iso, quantite: totaux[iso] }; });
        if (base.length === 0) return null;
        return MP.moyennePonderee(MP.exclureValeursAberrantes(base).ventesFiltrees) * MP.MARGE_PRODUCTION;
      }

      function afficher() {
        var jours = [];
        // Comme la Fournée : après midi, la journée en cours est faite, on part de demain.
        var depart = new Date().getHours() >= 12 ? 1 : 0;
        for (var i = depart; i < depart + 7; i++) jours.push(MP.ajouterJours(new Date(), i));
        var colonnes = jours.map(function (d) {
          var ferme = ctx.joursFermeture.indexOf(d.getDay()) !== -1;
          var prev = ferme ? [] : C.prevoirJour(ctx, d);
          // Totaux en pièces de fournée : sans les boissons (cafés, jus…).
          var total = prev.reduce(function (s, p) { return s + (p.r.insuffisant || p.rayon === 'Boissons' ? 0 : p.r.quantite); }, 0);
          var normal = ferme ? null : volumeNormal(d.getDay());
          var raisons = ferme ? [] : C.raisonsDuJour(prev);
          return { date: d, ferme: ferme, prev: prev, total: total, ratio: normal ? total / normal : null, raisons: raisons };
        });

        // Affluence : une barre par jour, hauteur relative au jour le plus fort.
        var max = Math.max.apply(null, colonnes.map(function (c) { return c.total; })) || 1;
        var ouvertsTotaux = colonnes.filter(function (c) { return !c.ferme; }).map(function (c) { return c.total; });
        var min = ouvertsTotaux.length ? Math.min.apply(null, ouvertsTotaux) : 0;
        // Lot 11 : la charge d'un jour se lit par rapport à un jour ordinaire de
        // la semaine (médiane des jours ouverts) : habituel = crème, chargé =
        // orangé de plus en plus soutenu, calme = plus pâle.
        var tries = ouvertsTotaux.slice().sort(function (a, b) { return a - b; });
        var mediane = tries.length ? tries[Math.floor((tries.length - 1) / 2)] : 0;
        document.getElementById('affluence').innerHTML = colonnes.map(function (c) {
          var nomJour = MP.versISO(c.date) === MP.versISO(new Date()) ? 'Auj.' : MP.capitaliser(MP.nomsJoursCourts[c.date.getDay()]);
          var raison;
          if (c.ferme) raison = 'Fermé';
          else if (c.raisons.length) {
            var r = c.raisons[0];
            var effet = MP.libelleEffet(r.ratio);
            raison = echapper(r.libelle) + (effet ? ' ' + effet : ' : effet pas encore connu, compté comme un jour normal');
          } else if (c.ratio !== null && Math.abs(c.ratio - 1) >= 0.08) {
            // L'écart est chiffré, pour qu'un changement d'un jour à l'autre s'explique.
            var ecartPct = Math.round((c.ratio - 1) * 100);
            raison = (ecartPct > 0 ? '+' : '−') + Math.abs(ecartPct) + ' % par rapport à d\'habitude';
          } else raison = '';
          // Lot 10 : intensité de couleur selon l'affluence prévue.
          var charge = mediane > 0 ? c.total / mediane : 1;
          var niveau = c.ferme ? 'ferme' : charge >= 1.35 ? 'tres-charge' : charge >= 1.12 ? 'charge' : charge <= 0.88 ? 'calme' : 'habituel';
          var libelleNiveau = { ferme: 'Fermé', 'tres-charge': 'Très chargé', charge: 'Chargé', calme: 'Calme', habituel: 'Habituel' }[niveau];
          if (c.ferme) raison = '';
          var classe = ' affluence-jour--' + niveau;
          // Intensité de couleur : volume du jour dans la semaine (le plus calme pâle, le plus fort croûte).
          var intensite = c.ferme ? 0 : Math.max(0.1, Math.min(1, (charge - 0.85) / 0.6));
          return '<li class="affluence-jour' + classe + '" style="--i:' + intensite.toFixed(2) + '">' +
            '<span class="affluence-barre" aria-hidden="true"><span style="--part:' + (c.ferme ? 0 : Math.max(6, c.total / max * 100)) + '%"></span></span>' +
            '<span class="affluence-nom">' + nomJour + ' ' + c.date.getDate() + '</span>' +
            '<span class="affluence-total">' + (c.ferme ? '–' : c.total.toLocaleString('fr-FR') + ' pièces') + '</span>' +
            '<span class="affluence-niveau">' + libelleNiveau + '</span>' +
            (raison ? '<span class="affluence-raison">' + raison + '</span>' : '') + '</li>';
        }).join('');

        // Tableau produits × jours, groupé par rayon, avec totaux.
        var noms = {};
        colonnes.forEach(function (c) { c.prev.forEach(function (p) { noms[p.nom] = p.rayon; }); });
        var ouverts = colonnes.filter(function (c) { return !c.ferme; });
        var entete = '<thead><tr><th scope="col">Produit</th>' + ouverts.map(function (c) {
          return '<th scope="col">' + MP.capitaliser(MP.nomsJoursCourts[c.date.getDay()]) + '<br><span class="texte-aide--discret">' + c.date.getDate() + '</span></th>';
        }).join('') + '<th scope="col">Semaine</th></tr></thead>';
        var corps = B.RAYONS.map(function (rayon) {
          var produits = Object.keys(noms).filter(function (n) { return noms[n] === rayon; }).sort();
          if (!produits.length) return '';
          return '<tr class="tableau-semaine-rayon"><th scope="rowgroup" colspan="' + (ouverts.length + 2) + '">' + rayon + (rayon === 'Boissons' ? ' <span class="texte-aide--discret">(hors totaux)</span>' : '') + '</th></tr>' + produits.map(function (nom) {
            var somme = 0;
            var cellules = ouverts.map(function (c) {
              var p = c.prev.filter(function (x) { return x.nom === nom; })[0];
              if (!p || p.r.insuffisant) return '<td title="Pas assez d\'historique">–</td>';
              var q = p.r.quantite;
              somme += q;
              return '<td>' + q.toLocaleString('fr-FR') + '</td>';
            }).join('');
            var aUnChiffre = ouverts.some(function (c) { var p = c.prev.filter(function (x) { return x.nom === nom; })[0]; return p && !p.r.insuffisant; });
            return '<tr><th scope="row">' + echapper(nom) + '</th>' + cellules + '<td class="tableau-semaine-total">' + (aUnChiffre ? somme.toLocaleString('fr-FR') : '–') + '</td></tr>';
          }).join('');
        }).join('');
        var totalSemaine = ouverts.reduce(function (s, c) { return s + c.total; }, 0);
        var pied = '<tfoot><tr><th scope="row">Total</th>' + ouverts.map(function (c) { return '<td>' + c.total.toLocaleString('fr-FR') + '</td>'; }).join('') + '<td class="tableau-semaine-total">' + totalSemaine.toLocaleString('fr-FR') + '</td></tr></tfoot>';
        document.getElementById('tableauSemaine').innerHTML = entete + '<tbody>' + corps + '</tbody>' + pied;
      }

      C.charger().then(function (c) {
        ctx = c;
        statutDiv.textContent = '';
        if (ctx.ventes.length === 0) {
          statutDiv.innerHTML = 'Pas encore de ventes : la semaine se remplira dès que ta caisse ou tes premières ventes seront là. <a href="caisse.html">Brancher ma caisse →</a>';
          return;
        }
        document.getElementById('zoneSemaine').hidden = false;
        afficher();
        C.enrichir(ctx).then(afficher);
      }).catch(function (err) {
        statutDiv.innerHTML = err && err.nonConnecte ? 'Non connecté. <a href="connexion.html">Se connecter</a>' : 'Impossible de charger tes données. Vérifie ta connexion et recharge la page.';
      });
    })();
  </script>
</body>
</html>
