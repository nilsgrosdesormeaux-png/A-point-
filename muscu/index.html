<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16150f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mon entraînement — On Air</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3; --panel:#ffffff; --panel-2:#f0efea; --line:#e2e0d8;
    --ink:#16150f; --ink-2:#6e6c60; --ink-3:#a09e92;
    --hot:#c0391e; --hot-soft:#f7e6e1;
    --go:#2d6a4a; --go-soft:#e4efe8;
    --art-bg:#edece6; --art-grid:#e2e0d8;
    --art-frame:#b2afa2; --art-pad:#cfcbbd; --art-metal:#8f8c80;
    --radius:16px; --shadow:0 8px 28px rgba(0,0,0,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121214; --panel:#1c1c1f; --panel-2:#26262b; --line:#34343c;
      --ink:#f0efe9; --ink-2:#a5a399; --ink-3:#6f6e68;
      --hot:#f0714c; --hot-soft:#3a211a;
      --go:#73d49b; --go-soft:#1c3328;
      --art-bg:#232329; --art-grid:#2d2d34;
      --art-frame:#55555f; --art-pad:#43434d; --art-metal:#6b6b77;
      --shadow:0 8px 28px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121214; --panel:#1c1c1f; --panel-2:#26262b; --line:#34343c;
    --ink:#f0efe9; --ink-2:#a5a399; --ink-3:#6f6e68;
    --hot:#f0714c; --hot-soft:#3a211a;
    --go:#73d49b; --go-soft:#1c3328;
    --art-bg:#232329; --art-grid:#2d2d34;
    --art-frame:#55555f; --art-pad:#43434d; --art-metal:#6b6b77;
    --shadow:0 8px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-padding-top:120px;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  button,input{font:inherit;color:inherit}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 130px}

  header{position:sticky;top:0;z-index:15;background:var(--panel);border-bottom:1px solid var(--line);
    margin:0 -16px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
  .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .hd h1{font-family:Archivo,Inter,sans-serif;font-weight:800;font-size:16px;margin:0;flex:1;
    letter-spacing:-.02em;text-transform:uppercase}
  .hd h1 span{color:var(--hot)}
  .chip{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;background:var(--panel-2);
    border-radius:99px;padding:4px 10px}
  .chip b{color:var(--ink)}
  .icon-btn{appearance:none;border:1px solid var(--line);background:var(--panel);width:34px;height:34px;
    border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
  .icon-btn svg{width:18px;height:18px}
  nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -8px}
  nav::-webkit-scrollbar{display:none}
  nav button{appearance:none;border:0;background:none;color:var(--ink-3);font-weight:500;
    font-size:14px;padding:8px 10px 11px;cursor:pointer;white-space:nowrap;
    border-bottom:2px solid transparent;transition:color .12s}
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hot);font-weight:700}
  nav button .td{display:inline-block;width:6px;height:6px;border-radius:9px;background:var(--hot);margin-left:5px;vertical-align:2px}

  h2{font-family:Archivo,Inter,sans-serif;font-weight:700;font-size:25px;letter-spacing:-.025em;margin:24px 0 6px;line-height:1.15}
  h3{font-size:12.5px;margin:28px 0 10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:700}
  .lead{color:var(--ink-2);font-size:14.5px;margin:0 0 16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .panel.flat{padding:0;overflow:hidden}
  .muted{color:var(--ink-3)}
  .small{font-size:13px}

  /* héro du jour */
  .hero{background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:18px;margin:18px 0 12px;position:relative;overflow:hidden}
  .hero small{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.6}
  .hero b{display:block;font-family:Archivo,sans-serif;font-size:24px;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.15}
  .hero p{margin:0 0 14px;opacity:.75;font-size:14px}
  .hero .btn{background:var(--hot);color:#fff}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
  .stat b{font-family:Archivo,sans-serif;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat b i{font-style:normal;font-size:13px;color:var(--ink-3);font-family:Inter,sans-serif;font-weight:500}

  .progress{height:6px;border-radius:9px;background:var(--panel-2);overflow:hidden;margin:10px 0 4px}
  .progress i{display:block;height:100%;background:var(--go);border-radius:9px;transition:width .3s}

  /* carte exercice */
  .exo{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;transition:border-color .15s}
  .exo.full{border-color:var(--go)}
  .art{position:relative;background:var(--art-bg);border-bottom:1px solid var(--line);aspect-ratio:180/124;overflow:hidden}
  .art svg{display:block;width:100%;height:100%}
  .art img{display:block;width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;top:10px;left:10px;min-width:26px;height:26px;border-radius:8px;padding:0 6px;
    background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-family:Archivo,sans-serif;font-weight:800;font-size:13px;color:var(--ink-3)}
  .exo.full .badge{background:var(--go);border-color:var(--go);color:#fff}
  .photo-btn{position:absolute;bottom:10px;right:10px;display:flex;gap:6px}
  .photo-btn label,.photo-btn button{appearance:none;border:0;cursor:pointer;background:rgba(20,20,22,.72);color:#fff;
    font-size:12px;font-weight:600;padding:7px 11px;border-radius:99px;display:flex;align-items:center;gap:6px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .photo-btn svg{width:15px;height:15px}
  .photo-btn input{display:none}

  .exo-main{padding:14px 16px 12px}
  .exo-main h4{margin:0 0 8px;font-size:18px;line-height:1.22;letter-spacing:-.018em;font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--hot-soft);color:var(--hot)}
  .tag.n{background:var(--panel-2);color:var(--ink-2)}
  .proto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .proto div{background:var(--panel-2);border-radius:10px;padding:8px 10px}
  .proto small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
  .proto b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

  .tip{margin:12px 16px 0;padding:10px 12px;border-radius:10px;font-size:13.5px;background:var(--go-soft);color:var(--ink)}
  .tip b{color:var(--go)}
  .tip.info{background:var(--panel-2)}

  .acc{border-top:1px solid var(--line);margin-top:12px}
  .acc details{border-bottom:1px solid var(--line)}
  .acc summary{cursor:pointer;list-style:none;padding:12px 16px;font-size:14px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:10px}
  .acc summary::-webkit-details-marker{display:none}
  .acc summary::before{content:"";width:6px;height:6px;border-right:1.8px solid var(--ink-3);border-bottom:1.8px solid var(--ink-3);
    transform:rotate(-45deg);transition:transform .15s;flex:none}
  .acc details[open] summary::before{transform:rotate(45deg)}
  .acc details[open] summary{color:var(--ink)}
  .acc-body{padding:0 16px 14px 32px;font-size:14px;color:var(--ink-2)}
  .acc-body ol,.acc-body ul{margin:0;padding-left:16px}
  .acc-body li{margin-bottom:7px}
  .acc-body p{margin:0}

  /* saisie des séries */
  .sets{background:var(--panel-2);padding:12px 12px 14px}
  .sets-hd{display:grid;grid-template-columns:44px 1fr 1fr 52px;gap:8px;padding:0 2px 6px;font-size:10px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--ink-3);font-weight:700}
  .set{display:grid;grid-template-columns:44px 1fr 1fr 52px;gap:8px;align-items:center;margin-bottom:8px}
  .set .n{font-family:Archivo,sans-serif;font-weight:800;font-size:15px;color:var(--ink-3);text-align:center}
  .set input{width:100%;font-size:18px;font-weight:600;padding:10px 6px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);text-align:center;font-variant-numeric:tabular-nums;min-width:0}
  .set input:focus{outline:2px solid var(--hot);outline-offset:-1px;border-color:transparent}
  .set .ok{appearance:none;border:1.5px solid var(--line);background:var(--panel);height:46px;border-radius:10px;cursor:pointer;
    display:grid;place-items:center;color:var(--ink-3)}
  .set .ok svg{width:20px;height:20px}
  .set.done .ok{background:var(--go);border-color:var(--go);color:#fff}
  .set.done input{border-color:transparent;background:var(--go-soft)}
  .set.done .n{color:var(--go)}
  .prev{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:6px;padding:0 2px}
  .prev b{color:var(--ink)}
  .up{color:var(--go);font-weight:700}
  .spark{margin-top:10px}
  .spark svg{display:block;width:100%;height:56px}

  .btn{appearance:none;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:14.5px;padding:12px 18px;border-radius:12px;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn.hot{background:var(--hot);color:#fff}
  .btn.line{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-weight:600}
  .btn.wide{width:100%}
  .row-in{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row-in label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;display:flex;flex-direction:column;gap:4px}
  .row-in input{width:110px;font-size:18px;font-weight:600;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);text-align:center}

  .week .row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:default}
  .week .row:last-child{border-bottom:0}
  .week .row[data-go]{cursor:pointer}
  .week .row.today{background:var(--hot-soft)}
  .week .day{flex:0 0 40px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
  .week .what{flex:1;min-width:0}
  .week .what b{display:block;font-size:15px;font-weight:600}
  .week .what small{color:var(--ink-2);font-size:13px}
  .week .rest .what b{color:var(--ink-3);font-weight:500}
  .week .st{flex:none;font-size:12px;font-weight:700;color:var(--go)}
  .dot{flex:0 0 8px;height:8px;border-radius:99px;background:var(--hot)}
  .week .rest .dot{background:var(--line)}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  th{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--panel-2)}
  .grp td{background:var(--panel-2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:8px 14px}
  .note{font-size:13.5px;color:var(--ink-2);margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
  .note b{color:var(--ink)}
  ul.clean,ol.clean{margin:0;padding-left:18px;font-size:14.5px}
  ul.clean li,ol.clean li{margin-bottom:9px}
  ul.clean li:last-child,ol.clean li:last-child{margin-bottom:0}
  .macro{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .macro div{background:var(--panel-2);border-radius:12px;padding:12px}
  .macro small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
  .macro b{font-family:Archivo,sans-serif;font-size:19px;letter-spacing:-.01em}
  .macro span{display:block;font-size:12.5px;color:var(--ink-2)}

  /* chrono */
  .timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
    background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;align-items:center;gap:6px;
    z-index:30;box-shadow:var(--shadow);width:min(calc(100% - 24px),440px)}
  .ring{position:relative;width:54px;height:54px;flex:none}
  .ring svg{width:54px;height:54px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:5}
  .ring .bgc{stroke:var(--panel-2)}
  .ring .fg{stroke:var(--hot);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
  .timer .tx{flex:1;min-width:0;padding-left:4px}
  .timer .tx b{display:block;font-family:Archivo,sans-serif;font-variant-numeric:tabular-nums;font-size:24px;letter-spacing:-.02em;line-height:1.1}
  .timer .tx small{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .timer button{appearance:none;border:0;background:var(--panel-2);color:var(--ink);font-size:13px;font-weight:700;padding:10px 11px;border-radius:12px;cursor:pointer}
  .timer button.x{background:var(--ink);color:var(--bg)}
  .timer.end{border-color:var(--go)}
  .timer.end .tx b{color:var(--go)}
  .hidden{display:none!important}
  .toast{position:fixed;left:50%;top:calc(100px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:90%;text-align:center}
  .foot{font-size:12px;color:var(--ink-3);text-align:center;margin-top:22px}
  .finish{text-align:center}
  .finish .ok{color:var(--go);font-weight:700;font-size:16px}
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}

  /* illustrations */
  .a-grid{stroke:var(--art-grid);stroke-width:1}
  .a-floor{stroke:var(--art-metal);stroke-width:3;stroke-linecap:round;fill:none;opacity:.55}
  .a-frame{stroke:var(--art-frame);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .a-thin{stroke:var(--art-metal);stroke-width:2.6;stroke-linecap:round;fill:none}
  .a-pad{stroke:var(--art-pad);stroke-width:12;stroke-linecap:round;fill:none}
  .a-plate{fill:var(--art-metal)}
  .a-stack{fill:var(--art-pad);stroke:var(--art-frame);stroke-width:2.5}
  .a-stackline{stroke:var(--art-frame);stroke-width:2;stroke-linecap:round}
  .a-torso{stroke:var(--ink);stroke-width:15;stroke-linecap:round;fill:none}
  .a-limb{stroke:var(--ink);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .a-head{fill:var(--ink)}
  .a-arw{stroke:var(--hot);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd">
      <h1>On Air <span>·</span> Muscu</h1>
      <span class="chip" id="bwchip"></span>
      <button class="icon-btn" id="themeBtn" aria-label="Changer de thème"></button>
    </div>
    <nav role="tablist" id="nav">
      <button role="tab" data-tab="plan">Semaine</button>
      <button role="tab" data-tab="A">Séance A</button>
      <button role="tab" data-tab="B">Séance B</button>
      <button role="tab" data-tab="C">Séance C</button>
      <button role="tab" data-tab="D">Bonus</button>
      <button role="tab" data-tab="charges">Mes charges</button>
      <button role="tab" data-tab="guide">Guide</button>
    </nav>
  </header>
  <main id="view"></main>
  <div class="foot" id="foot"></div>
</div>

<div class="timer hidden" id="timer" role="timer" aria-live="polite">
  <div class="ring"><svg viewBox="0 0 54 54"><circle class="bgc" cx="27" cy="27" r="23"/><circle class="fg" id="tring" cx="27" cy="27" r="23" stroke-dasharray="144.5" stroke-dashoffset="0"/></svg></div>
  <div class="tx"><b id="tdisp">0:00</b><small id="tlabel">Repos</small></div>
  <button id="tminus">−15</button><button id="tplus">+15</button><button class="x" id="tstop" aria-label="Arrêter">✕</button>
</div>
<div class="toast hidden" id="toast"></div>

<script>
const FRAME = (body)=>`<svg viewBox="0 0 180 124" xmlns="http://www.w3.org/2000/svg" role="img">
<defs><pattern id="g" width="12" height="12" patternUnits="userSpaceOnUse">
<path class="a-grid" d="M12 0H0v12"/></pattern></defs>
<rect width="180" height="124" fill="url(#g)" opacity=".5"/>${body}</svg>`;

const STACK=(x,y,w,h)=>`<rect class="a-stack" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>
<path class="a-stackline" d="${[...Array(Math.floor(h/9))].map((_,i)=>`M${x+4} ${y+9+i*9}h${w-8}`).join("")}"/>`;
const PLATE=(x,y,r)=>`<circle class="a-plate" cx="${x}" cy="${y}" r="${r}"/>
<circle cx="${x}" cy="${y}" r="${r*.28}" fill="var(--art-bg)"/>`;
const HEAD=(x,y,r=9.5)=>`<circle class="a-head" cx="${x}" cy="${y}" r="${r}"/>`;
const FLOOR=`<path class="a-floor" d="M14 114h152"/>`;

const ART={

/* Développé incliné machine à disques */
chestIncline: FRAME(`${FLOOR}
  <path class="a-frame" d="M40 114V66M40 66h16"/>
  ${PLATE(34,62,15)}${PLATE(34,62,9)}
  <path class="a-frame" d="M58 114V40"/>
  <path class="a-pad" d="M74 98h26"/>
  <path class="a-pad" d="M78 94 94 54"/>
  <path class="a-frame" d="M140 48v34M140 66h-18"/>
  ${HEAD(104,48)}
  <path class="a-torso" d="M99 59 86 90"/>
  <path class="a-limb" d="M98 64l22-1 20 3"/>
  <path class="a-limb" d="M86 92l22 6 3 16"/>
  <path class="a-arw" d="M150 66h16m0 0l-6-6m6 6l-6 6"/>`),

/* Tirage vertical poulie haute, barre large */
latPulldown: FRAME(`${FLOOR}
  <path class="a-frame" d="M42 114V22h94"/>
  ${STACK(32,54,22,52)}
  <circle class="a-thin" cx="136" cy="26" r="5"/>
  <path class="a-thin" d="M136 31v20"/>
  <path class="a-frame" d="M110 52h52"/>
  <path class="a-pad" d="M118 96h32"/>
  <path class="a-frame" d="M112 82h24M114 82v22"/>
  ${HEAD(134,68)}
  <path class="a-torso" d="M134 78v14"/>
  <path class="a-limb" d="M130 76 124 54M139 76l9-22"/>
  <path class="a-limb" d="M132 96l-16 8-2 10"/>
  <path class="a-arw" d="M166 46v26m0 0l-6-6m6 6l6-6"/>`),

/* Tirage vertical prise neutre */
latPulldownV: FRAME(`${FLOOR}
  <path class="a-frame" d="M42 114V22h94"/>
  ${STACK(32,54,22,52)}
  <circle class="a-thin" cx="136" cy="26" r="5"/>
  <path class="a-thin" d="M136 31v16"/>
  <path class="a-frame" d="M136 47l-10 10M136 47l10 10"/>
  <path class="a-pad" d="M118 96h32"/>
  <path class="a-frame" d="M112 82h24M114 82v22"/>
  ${HEAD(134,70)}
  <path class="a-torso" d="M134 80v12"/>

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const fr=iso=>{const[,m,d]=iso.split("-");return `${d}/${m}`;};
const num=v=>{const x=parseFloat(String(v).replace(",","."));return isNaN(x)?null:x;};
const fmt=x=>(Math.round(x*10)/10).toString().replace(".",",");
function range(s){const m=String(s).match(/^(\d+)(?:\s*à\s*(\d+))?$/);return m?[+m[1],+(m[2]||m[1])]:null;}
function restSec(s){const m=String(s).match(/(\d+)\s*(min|s)/);return m?(m[2]==="min"?+m[1]*60:+m[1]):90;}
function startKg(e){const m=String(e.depart).match(/(\d+(?:[.,]\d+)?)\s*kg/);return m?num(m[1]):null;}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}
function weekStart(iso){const d=new Date(iso);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function toast(t){const el=$("toast");el.textContent=t;el.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add("hidden"),2200);}

const KEY="nils-training-v1";
let store={v:2,log:{},bw:[],hist:[],start:null,ts:0};
let db=null,uid=null,saveT=null;

function migrate(s){
  const old=!s||s.v!==2;
  s=Object.assign({log:{},bw:[],hist:[],start:null,ts:0},s||{});
  if(old){
    const nl={};
    Object.keys(s.log||{}).forEach(key=>{
      const[k,id]=key.split(":");const e=P[k]&&P[k].exos.find(x=>x.id===id);
      const u=e?e.uid:key;
      (s.log[key]||[]).forEach(x=>{
        const sets=x.sets||[{kg:x.kg,reps:x.reps}];
        nl[u]=nl[u]||[];
        const ex=nl[u].find(y=>y.d===x.d);
        if(ex)ex.sets=ex.sets.concat(sets);else nl[u].push({d:x.d,sets});
      });
    });
    Object.values(nl).forEach(a=>a.sort((a,b)=>a.d<b.d?-1:1));
    s.log=nl;
    s.hist=s.hist||[];
    Object.entries(s.done||{}).forEach(([k,d])=>{if(!s.hist.some(h=>h.d===d&&h.k===k))s.hist.push({d,k});});
    delete s.done;s.v=2;
  }
  if(!s.start){const ds=[].concat(...Object.values(s.log).map(a=>a.map(x=>x.d)),s.hist.map(h=>h.d)).sort();s.start=ds[0]||today();}
  return s;
}
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r)store=migrate(JSON.parse(r));else store=migrate({});}catch(e){store=migrate({});}}
function persist(){store.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}
  if(!db||!uid)return;clearTimeout(saveT);
  saveT=setTimeout(()=>{db.collection("data/users/"+uid).doc("training").set({payload:JSON.stringify(store)}).catch(()=>{});},800);}
async function initCloud(){
  const foot=$("foot");
  try{
    if(typeof claude==="undefined"||!claude.use)throw 0;
    const [u,d]=await Promise.all([claude.use("user"),claude.use("db")]);
    if(!u||!d)throw 0;
    uid=await u.id();db=d;
    const doc=await d.collection("data/users/"+uid).doc("training").get().catch(()=>null);
    if(doc&&doc.payload){try{
      const r=JSON.parse(doc.payload);
      const newer=(r.ts||0)>(store.ts||0)||(!store.ts&&Object.keys(r.log||{}).length>=Object.keys(store.log).length);
      if(newer){store=migrate(r);try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}render(true);}
      else persist();
    }catch(e){}} else persist();
    foot.textContent="Données synchronisées sur tous tes appareils. Photos gardées sur cet appareil.";
  }catch(e){foot.textContent="Données enregistrées sur cet appareil. Pense à exporter une sauvegarde de temps en temps (onglet Mes charges).";}
}

const PH={};let idb=null;
function openIDB(){return new Promise(res=>{try{const r=indexedDB.open("nils-gym-photos",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>{idb=r.result;res();};r.onerror=()=>res();}catch(e){res();}});}
function idbAll(){return new Promise(res=>{if(!idb)return res();try{const tx=idb.transaction("p");const st=tx.objectStore("p");
  const rq=st.openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){PH[c.key]=URL.createObjectURL(c.value);c.continue();}else res();};rq.onerror=()=>res();}catch(e){res();}});}
function idbPut(k,blob){return new Promise(res=>{if(!idb)return res(false);try{const tx=idb.transaction("p","readwrite");tx.objectStore("p").put(blob,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false);}});}
function idbDel(k){return new Promise(res=>{if(!idb)return res();try{const tx=idb.transaction("p","readwrite");tx.objectStore("p").delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});}
function compress(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const M=1000,r=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement("canvas");
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.82);};
  img.onerror=()=>{URL.revokeObjectURL(u);rej();};img.src=u;});}

/* ---------- historique d'un exercice ---------- */
const H=u=>store.log[u]||[];
const todayEntry=u=>H(u).find(x=>x.d===today());
const pastEntries=u=>H(u).filter(x=>x.d!==today());
const best=x=>Math.max(...x.sets.map(s=>s.kg||0));
function suggestion(e){
  const past=pastEntries(e.uid);const last=past[past.length-1];const r=range(e.reps);
  if(!last)return {kg:startKg(e),reps:r?r[0]:null,msg:null};
  const lk=best(last),lr=last.sets[last.sets.length-1].reps;
  if(r&&last.sets.length>=+e.series&&last.sets.every(s=>s.reps>=r[1]&&s.kg>=lk)){
    const inc=BIG.has(e.uid)?2.5:1;
    return {kg:lk+inc,reps:r[0],msg:`Tu as fait ${r[1]} reps partout la dernière fois : <b>monte à ${fmt(lk+inc)} kg</b> aujourd'hui.`};}
  return {kg:lk,reps:lr,msg:r?`Objectif : même charge, <b>une répétition de plus</b> que la dernière fois.`:null};
}

function sparkline(pts,h=56,unit="kg"){
  if(pts.length<2)return"";
  const W=300,pd=6,vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=mx-mn||1;
  const X=i=>pd+i*(W-2*pd)/(pts.length-1),Y=v=>h-pd-((v-mn)/sp)*(h-2*pd-12);
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join("");
  const l=pts.length-1;
  return `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-label="Évolution">
   <path d="${d}L${X(l)} ${h}L${X(0)} ${h}Z" fill="var(--go)" opacity=".1"/>
   <path d="${d}" fill="none" stroke="var(--go)" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
   <circle cx="${X(l)}" cy="${Y(pts[l].v)}" r="3.5" fill="var(--go)"/>
   <text x="${W-pd}" y="11" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="Inter">${fmt(mx)} ${unit}</text>
   <text x="${pd}" y="11" font-size="11" fill="var(--ink-3)" font-family="Inter">${fmt(pts[0].v)} ${unit}</text></svg>`;
}

}

function artHTML(e){return PH[e.uid]?`<img src="${PH[e.uid]}" alt="Ma photo de la machine : ${e.nom}">`:ART[e.pic];}
function card(k,e,i){

function refreshCard(k,e){const i=P[k].exos.indexOf(e);$("c-"+e.id).innerHTML=card(k,e,i);wire(k,e);
  const pr=sessionProgress(k);$("pdone").textContent=pr.done;$("pbar").style.width=(pr.tot?pr.done/pr.tot*100:0)+"%";

function wire(k,e){
  const box=$("c-"+e.id);
  box.querySelectorAll(".set").forEach(row=>{
    const j=+row.dataset.j;const [ik,ir]=row.querySelectorAll("input");
    row.querySelector(".ok").onclick=()=>{
      const kg=num(ik.value),rp=parseInt(ir.value,10);
      if(isNaN(rp)||rp<=0){ir.focus();return toast("Indique le nombre de répétitions");}
      const L=store.log[e.uid]=store.log[e.uid]||[];
      let te=L.find(x=>x.d===today());if(!te){te={d:today(),sets:[]};L.push(te);L.sort((a,b)=>a.d<b.d?-1:1);}
      const was=!!te.sets[j];
      if(was&&row.classList.contains("done")&&te.sets[j].kg===(kg||0)&&te.sets[j].reps===rp){
        te.sets[j]=null;while(te.sets.length&&!te.sets[te.sets.length-1])te.sets.pop();
        if(!te.sets.some(Boolean))store.log[e.uid]=L.filter(x=>x!==te);
        persist();refreshCard(k,e);return;}
      te.sets[j]={kg:kg||0,reps:rp};
      for(let q=0;q<te.sets.length;q++)if(te.sets[q]===undefined)te.sets[q]=null;
      persist();
      const exs=P[k].exos;const last=exs.indexOf(e)===exs.length-1&&te.sets.filter(Boolean).length>=+e.series;
      refreshCard(k,e);
      if(!was&&!last){const doneAll=te.sets.filter(Boolean).length>=+e.series;
        startRest(restSec(e.repos),doneAll?`Prochain : ${exs[exs.indexOf(e)+1].nom}`:`${e.nom} · série ${Math.min(j+2,+e.series)}/${e.series}`);}
    };
  });
  const fi=box.querySelector("[data-ph]");
  if(fi)fi.onchange=async()=>{const f=fi.files[0];if(!f)return;
    try{const b=await compress(f);await idbPut(e.uid,b);if(PH[e.uid])URL.revokeObjectURL(PH[e.uid]);PH[e.uid]=URL.createObjectURL(b);
      refreshCard(k,e);toast("Photo enregistrée pour cette machine");}catch(err){toast("Impossible de lire cette photo");}};
  const del=box.querySelector("[data-delph]");
  if(del)del.onclick=async()=>{if(!confirm("Retirer ta photo et revenir au dessin ?"))return;await idbDel(e.uid);
    URL.revokeObjectURL(PH[e.uid]);delete PH[e.uid];refreshCard(k,e);};

/* ===================== CHRONO ===================== */
let ti=null,tEnd=0,tTot=0,wake=null,actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [0,.22,.44].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=t>.4?1320:880;
    g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.18);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2);});}catch(e){}}
async function lockWake(){try{if("wakeLock" in navigator&&!wake)wake=await navigator.wakeLock.request("screen");}catch(e){}}
function startRest(s,label){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}
  clearInterval(ti);tTot=s;tEnd=Date.now()+s*1000;$("tlabel").textContent=label||"Repos";
  $("timer").classList.remove("hidden","end");tick();ti=setInterval(tick,250);lockWake();}
function stopRest(){clearInterval(ti);$("timer").classList.add("hidden");}
function tick(){const l=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  $("tdisp").textContent=l>0?`${Math.floor(l/60)}:${pad(l%60)}`:"C'est reparti";
  $("tring").style.strokeDashoffset=144.5*(1-(tTot?l/tTot:0));
  if(l<=0){clearInterval(ti);$("timer").classList.add("end");beep();try{navigator.vibrate&&navigator.vibrate([300,120,300]);}catch(e){}
    setTimeout(()=>{if($("timer").classList.contains("end"))$("timer").classList.add("hidden");},20000);}}
$("tminus").onclick=()=>{tEnd-=15000;tTot=Math.max(tTot-15,1);tick();};
$("tplus").onclick=()=>{if(Date.now()>tEnd){startRest(15,$("tlabel").textContent);return;}tEnd+=15000;tTot+=15;tick();};
$("tstop").onclick=stopRest;
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){wake=null;if(!$("timer").classList.contains("hidden"))lockWake();tick();}});

/* ===================== THÈME ===================== */
const TH=["auto","light","dark"],THI={auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'};
let theme="auto";
function applyTheme(){if(theme==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",theme);
  $("themeBtn").innerHTML=THI[theme];$("themeBtn").title={auto:"Thème : automatique",light:"Thème : clair",dark:"Thème : sombre"}[theme];}
$("themeBtn").onclick=()=>{theme=TH[(TH.indexOf(theme)+1)%3];try{localStorage.setItem(KEY+"-theme",theme);}catch(e){}applyTheme();toast({auto:"Thème automatique",light:"Thème clair",dark:"Thème sombre"}[theme]);};

/* ===================== DÉMARRAGE ===================== */
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
try{theme=localStorage.getItem(KEY+"-theme")||"auto";}catch(e){}
applyTheme();loadLocal();
(()=>{const tk=todayKey();let saved=null;try{saved=localStorage.getItem(KEY+"-tab");}catch(e){}
  cur=tk&&!store.hist.some(h=>h.k===tk&&h.d===today())?tk:(saved||"plan");})();
render();
openIDB().then(idbAll).then(()=>{if(Object.keys(PH).length&&["A","B","C","D"].includes(cur))render(true);});
initCloud();
</script>
