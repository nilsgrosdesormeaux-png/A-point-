<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>À Point - Fournée</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css?v=20261031f">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="moteur-prevision.js?v=20261031f"></script>
  <script src="boulangerie.js?v=20261031"></script>
  <script src="contexte.js?v=20261031f"></script>
  <script src="nav.js?v=20261031"></script>
</head>
<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>
  <header class="entete-site">
    <a href="previsions.html" class="logo" aria-label="À Point, accueil">
      <svg class="logo-marque" viewBox="0 0 100 100" width="24" height="24" aria-hidden="true">
        <path d="M50 12 L16 86" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none"/>
        <path d="M50 12 L84 86" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none"/>
        <circle cx="50" cy="56" r="8" fill="currentColor"/>
      </svg>
      <span class="logo-texte">À Point</span>
    </a>
    <nav id="navPrincipale"></nav>
  </header>

  <div id="contenu" role="main" class="conteneur conteneur--large">
    <p id="statutConnexion" class="texte-aide">Chargement…</p>
    <p class="texte-aide" id="bandeauReglages" hidden><a href="parametres.html">Complète tes réglages</a> (code postal, jours de fermeture) pour affiner la fournée.</p>

    <a class="carte-saisie-hier" id="carteSaisieHier" href="ventes.html" hidden>
      <span class="carte-saisie-hier-texte"><strong>Saisir les ventes d'hier</strong><span id="texteSaisieHier">Sans elles, la prochaine fournée ne peut pas apprendre.</span></span>
      <span class="carte-saisie-hier-fleche" aria-hidden="true">→</span>
    </a>

    <section class="claire-entete fournee-entete" aria-labelledby="titreFournee">
      <div class="fournee-entete-haut">
        <div>
          <p class="claire-date" id="dateAujourdhui"></p>
          <h1 class="claire-titre" id="titreFournee">Ta fournée</h1>
          <div class="selecteur-periode selecteur-jour" id="selecteurJour" role="group" aria-label="Jour de la fournée" hidden>
            <button type="button" class="periode-bouton" data-jour="aujourdhui" aria-pressed="false">Aujourd'hui</button>
            <button type="button" class="periode-bouton" data-jour="demain" aria-pressed="false">Demain</button>
          </div>
        </div>
        <button type="button" class="bouton-secondaire" id="btnEcranFournil" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <span>Écran fournil</span>
        </button>
      </div>
      <div class="meteo-moments-jour" id="meteoJour" hidden></div>
      <ul class="raisons" id="raisonsJour" aria-label="Ce qui change la fournée"></ul>
      <div class="actions-jour" id="actionsAffluence" hidden>
        <button type="button" class="btn-mini" data-modificateur="plus" aria-pressed="false">+ Plus de monde</button>
        <button type="button" class="btn-mini" data-modificateur="moins" aria-pressed="false">− Moins de monde</button>
      </div>
    </section>

    <p class="repere-peu-sur repere-peu-sur--global" id="repereGlobal" hidden></p>

    <div class="fournee-progression" id="progression" hidden>
      <span id="texteProgression"></span>
      <span class="fournee-barre" aria-hidden="true"><span id="barreProgression"></span></span>
    </div>

    <div id="listeRayons"></div>

    <section class="fiabilite" id="blocFiabilite" hidden aria-label="Fiabilité">
      <p id="texteFiabilite"></p>
    </section>

    <div class="bloc-pont-commandes" id="blocCommande"></div>

    <button type="button" class="bouton-quitter-fournil" id="btnQuitterFournil">Quitter l'écran fournil</button>
  </div>

  <script>
    (function () {
      var MP = window.MoteurPrevision;
      var B = window.Boulangerie;
      var C = window.ContexteBoulangerie;

      var statutDiv = document.getElementById('statutConnexion');
      var titreEl = document.getElementById('titreFournee');
      var meteoEl = document.getElementById('meteoJour');
      var raisonsEl = document.getElementById('raisonsJour');
      var listeEl = document.getElementById('listeRayons');
      var actionsEl = document.getElementById('actionsAffluence');
      var progressionEl = document.getElementById('progression');
      var fiabiliteEl = document.getElementById('blocFiabilite');

      var ctx = null;
      var jourCible = null;
      var modificateur = null; // 'plus' | 'moins' | null : ajustement local, jamais enregistré
      var cocheCle = null;
      // Quantités réellement cuites pour le jour affiché : { nom: quantite }.
      // En base (table fournees) pour mesurer les vrais invendus dans le
      // Bilan ; repli sur l'appareil si la base ne répond pas.
      var cuites = {};
      var enBase = true;

      document.getElementById('dateAujourdhui').textContent = "Aujourd'hui, " + MP.formatDateLongue(new Date()).toLowerCase();

      function echapper(t) {
        return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
      }

      // Cases « enfourné » gardées pour la journée, sur cet appareil.
      function sauverLocal() {
        try { localStorage.setItem(cocheCle, JSON.stringify(cuites)); } catch (e) {}
      }
      function chargerCuites() {
        return ctx.sb.from('fournees').select('nom_produit, quantite_cuite').eq('commercant_id', ctx.commercantId).eq('date_fournee', MP.versISO(jourCible)).then(function (r) {
          if (r.error) throw r.error;
          cuites = {};
          (r.data || []).forEach(function (l) { cuites[l.nom_produit] = l.quantite_cuite; });
        }).catch(function () {
          enBase = false;
          try { cuites = JSON.parse(localStorage.getItem(cocheCle) || '{}'); } catch (e) { cuites = {}; }
          Object.keys(cuites).forEach(function (n) { if (typeof cuites[n] !== 'number') delete cuites[n]; });
        });
      }
      function enregistrerCuite(nom, quantite) {
        if (quantite === null) delete cuites[nom]; else cuites[nom] = quantite;
        sauverLocal();
        if (!enBase) return;
        var requete = quantite === null
          ? ctx.sb.from('fournees').delete().eq('commercant_id', ctx.commercantId).eq('date_fournee', MP.versISO(jourCible)).eq('nom_produit', nom)
          : ctx.sb.from('fournees').upsert({ commercant_id: ctx.commercantId, date_fournee: MP.versISO(jourCible), nom_produit: nom, quantite_cuite: quantite, maj: new Date().toISOString() });
        requete.then(function (r) { if (r && r.error) enBase = false; }, function () { enBase = false; });
      }

      function texteDelta(p, quantite) {
        var ref = p.r.dernierMemeJour;
        if (!ref) return '';
        var ecart = quantite - ref.quantite;
        var jour = MP.nomsJours[new Date(ref.date_vente + 'T00:00:00').getDay()];
        if (ecart === 0) return '<span class="delta-texte">= ' + jour + ' dernier</span>';
        return '<span class="delta-texte delta-texte--' + (ecart > 0 ? 'hausse' : 'baisse') + '">' + (ecart > 0 ? '↑ +' : '↓ −') + Math.abs(ecart) + ' vs ' + jour + ' dernier</span>';
      }

      function lignesPourquoi(p) {
        var items = (p.r.signaux || []).map(function (s) {
          var effet = MP.libelleEffet(s.ratio);
          return '<li>' + s.icone + ' ' + echapper(s.libelle) + ' : ' + (effet
            ? '<strong>' + effet + '</strong> <span class="texte-aide--discret">(appris sur ' + s.nb + ' jour' + (s.nb > 1 ? 's' : '') + ')</span>'
            : '<span class="texte-aide--discret">' + (s.dejaPrisEnCompte ? 'déjà pris en compte : comparé à tes ' + p.r.nomJourCible + 's de vacances' : 'effet pas encore appris, quantité inchangée') + '</span>') + '</li>';
        });
        items.push('<li>📈 ' + echapper(p.r.texteBase.replace(/^[^B]*Basé/, 'Basé')) + '</li>');
        items.push('<li>🛟 Marge de sécurité de ' + Math.round((MP.MARGE_PRODUCTION - 1) * 100) + ' % pour ne pas manquer</li>');
        var fiab = fiabiliteProduit(p);
        if (fiab.ecart) items.push('<li>🎯 D\'habitude, la prévision tombe à ±' + fiab.ecart.ecart + ' pièce' + (fiab.ecart.ecart > 1 ? 's' : '') + ' près</li>');
        else items.push('<li>🎯 Pas encore assez d\'historique pour dire à combien de pièces près la prévision tombe</li>');
        return items.join('');
      }

      // Incertitude d'un produit, d'après son rétro-test réel (écart moyen
      // observé, sans la marge de production) : jamais d'intervalle affiché,
      // seulement un repère discret si la prévision est encore peu sûre.
      var cacheFiabilite = {};
      function fiabiliteProduit(p) {
        if (cacheFiabilite[p.nom]) return cacheFiabilite[p.nom];
        var ecart = MP.calculerEcartUnites(ctx.parProduit[p.nom]);
        var nbMemeJour = p.r.nbMemeJour;
        var demande = p.r.quantite / MP.MARGE_PRODUCTION;
        var peuSur = null;
        if (p.r.insuffisant) peuSur = null;
        else if (nbMemeJour < 4) peuSur = 'Prévision encore peu sûre : moins de 4 ' + p.r.nomJourCible + 's connus';
        else if (ecart && demande > 0 && ecart.ecart / demande > 0.25) peuSur = 'Prévision encore peu sûre : ventes très variables';
        cacheFiabilite[p.nom] = { ecart: ecart, peuSur: peuSur };
        return cacheFiabilite[p.nom];
      }

      function afficherRaisons(previsions) {
        var raisons = C.raisonsDuJour(previsions).slice(0, 3);
        raisonsEl.innerHTML = raisons.map(function (r) {
          var effet = MP.libelleEffet(r.ratio);
          return '<li class="raison">' + r.icone + ' ' + echapper(r.libelle) + (effet ? ' <strong>' + effet + '</strong>' : '') + '</li>';
        }).join('');
        raisonsEl.hidden = raisons.length === 0;
      }

      function afficherMeteo() {
        var m = ctx.meteoPrevue[MP.versISO(jourCible)];
        if (!m || !m.moments || m.moments.length === 0) { meteoEl.hidden = true; return; }
        meteoEl.innerHTML = m.moments.map(function (x) {
          return '<span class="meteo-moment"><span class="meteo-moment-libelle">' + x.libelle + '</span> ' + x.icone +
            ' <span class="meteo-moment-temperature">' + (x.temperature !== null ? x.temperature + '°' : '') + '</span></span>';
        }).join('');
        meteoEl.hidden = false;
      }

      function majProgression() {
        var cases = listeEl.querySelectorAll('.case-enfourne');
        var faites = listeEl.querySelectorAll('.case-enfourne:checked').length;
        progressionEl.hidden = cases.length === 0;
        document.getElementById('texteProgression').textContent = faites + ' sur ' + cases.length + ' enfourné' + (faites > 1 ? 's' : '');
        document.getElementById('barreProgression').style.width = (cases.length ? faites / cases.length * 100 : 0) + '%';
      }

      function afficher() {
        cacheFiabilite = {};
        var previsions = C.prevoirJour(ctx, jourCible);
        var facteur = modificateur === 'plus' ? 1.15 : (modificateur === 'moins' ? 0.85 : 1);
        afficherRaisons(previsions);
        afficherMeteo();

        var parRayon = {};
        previsions.forEach(function (p) {
          if (!parRayon[p.rayon]) parRayon[p.rayon] = [];
          parRayon[p.rayon].push(p);
        });

        // Si la plupart des produits sont encore peu sûrs (historique jeune),
        // un seul repère en haut plutôt que le même sous chaque ligne.
        var peuSurs = previsions.filter(function (p) { return !p.r.insuffisant && fiabiliteProduit(p).peuSur; });
        var repereUnique = peuSurs.length >= Math.max(3, previsions.length / 2);
        var repereGlobal = document.getElementById('repereGlobal');
        repereGlobal.hidden = !repereUnique;
        if (repereUnique) repereGlobal.textContent = 'Prévisions encore peu sûres : ton historique est jeune, elles s\'affinent à chaque journée saisie.';

        listeEl.innerHTML = B.RAYONS.filter(function (rayon) { return parRayon[rayon]; }).map(function (rayon) {
          var lignes = parRayon[rayon].sort(function (a, b) { return b.r.quantite - a.r.quantite; });
          var total = 0;
          var html = lignes.map(function (p) {
            var insuffisant = p.r.insuffisant;
            var q = insuffisant ? 0 : Math.ceil(p.r.quantite * facteur);
            total += q;
            var id = 'enf-' + B.normaliser(p.nom).replace(/ /g, '-');
            var fiab = fiabiliteProduit(p);
            var cuit = cuites[p.nom];
            var fait = typeof cuit === 'number';
            return '<li class="ligne-fournee' + (fait ? ' ligne-fournee--faite' : '') + '" data-nom="' + echapper(p.nom) + '" data-prevu="' + q + '">' +
              '<input type="checkbox" class="case-enfourne" id="' + id + '"' + (fait ? ' checked' : '') + ' aria-describedby="' + id + '-cuit">' +
              '<label for="' + id + '" class="ligne-fournee-nom"><span>' + echapper(p.nom) + '</span>' + (insuffisant ? '' : texteDelta(p, q)) +
                (fiab.peuSur && !repereUnique ? '<span class="repere-peu-sur">' + fiab.peuSur + '</span>' : '') + '</label>' +
              (insuffisant
                ? '<span class="ligne-fournee-chiffre"><span class="ligne-fournee-insuffisant">Pas assez d\'historique (' + p.r.nbMemeJour + ' ' + p.r.nomJourCible + (p.r.nbMemeJour > 1 ? 's' : '') + ')</span></span>'
                : '<span class="ligne-fournee-chiffre"><span class="ligne-fournee-quantite">' + q + '</span></span>') +
              '<div class="ligne-fournee-cuit" id="' + id + '-cuit"' + (fait ? '' : ' hidden') + '>' +
                '<span>Cuit</span>' +
                '<button type="button" class="stepper-bouton" data-pas="-1" aria-label="Une pièce cuite de moins : ' + echapper(p.nom) + '">−</button>' +
                '<input type="number" class="stepper-valeur valeur-cuite" min="0" inputmode="numeric" value="' + (fait ? cuit : (insuffisant ? '' : q)) + '" placeholder="0" aria-label="Quantité cuite : ' + echapper(p.nom) + '">' +
                '<button type="button" class="stepper-bouton" data-pas="1" aria-label="Une pièce cuite de plus : ' + echapper(p.nom) + '">+</button>' +
              '</div>' +
              '<details class="ligne-fournee-pourquoi"><summary>Pourquoi ?</summary><ul>' + lignesPourquoi(p) + '</ul></details>' +
              '</li>';
          }).join('');
          return '<section class="rayon" aria-labelledby="rayon-' + B.normaliser(rayon) + '">' +
            '<h2 class="rayon-titre" id="rayon-' + B.normaliser(rayon) + '">' + rayon + ' <span class="rayon-total">' + total + ' pièces</span></h2>' +
            '<ul class="liste-fournee">' + html + '</ul></section>';
        }).join('');
        majProgression();
        afficherFiabilite(previsions);

        document.getElementById('blocCommande').innerHTML = '<a class="btn-cta-commandes" href="commandes.html?jour=' + MP.versISO(jourCible) + '">Voir la commande de matières premières</a>';
      }

      // « D'habitude, on tombe à ±4 baguettes près », sur le produit le plus
      // vendu ; la comparaison avec la moyenne simple seulement si elle parle.
      function afficherFiabilite(previsions) {
        var principal = previsions.filter(function (p) { return !p.r.insuffisant; }).sort(function (a, b) { return b.r.quantite - a.r.quantite; })[0];
        var ecart = principal ? MP.calculerEcartUnites(ctx.parProduit[principal.nom]) : null;
        if (!ecart) { fiabiliteEl.hidden = true; return; }
        var texte = "D'habitude, la prévision tombe à <strong>±" + ecart.ecart + ' ' + echapper(principal.nom.toLowerCase()) + '</strong> près.';
        var fiab = MP.calculerFiabilite(ctx.ventes);
        var naive = MP.calculerFiabiliteNaive(ctx.ventes);
        if (MP.comparaisonUtile(fiab, naive)) {
          texte += ' C\'est ' + (fiab.valeur - naive.valeur) + ' points plus juste qu\'une simple moyenne.';
        }
        document.getElementById('texteFiabilite').innerHTML = texte;
        fiabiliteEl.hidden = false;
      }

      // Cocher « enfourné » enregistre la quantité cuite (la prévision par
      // défaut), ajustable avec − / + ; décocher l'efface.
      listeEl.addEventListener('change', function (e) {
        var ligne = e.target.closest('.ligne-fournee');
        if (!ligne) return;
        var nom = ligne.getAttribute('data-nom');
        var champ = ligne.querySelector('.valeur-cuite');
        if (e.target.classList.contains('case-enfourne')) {
          var coche = e.target.checked;
          ligne.classList.toggle('ligne-fournee--faite', coche);
          ligne.querySelector('.ligne-fournee-cuit').hidden = !coche;
          enregistrerCuite(nom, coche ? Math.max(0, parseInt(champ.value, 10) || 0) : null);
          majProgression();
        } else if (e.target === champ && ligne.querySelector('.case-enfourne').checked) {
          enregistrerCuite(nom, Math.max(0, parseInt(champ.value, 10) || 0));
        }
      });
      listeEl.addEventListener('click', function (e) {
        var pas = e.target.closest('[data-pas]');
        if (!pas) return;
        var champ = pas.parentNode.querySelector('.valeur-cuite');
        champ.value = Math.max(0, (parseInt(champ.value, 10) || 0) + parseInt(pas.getAttribute('data-pas'), 10));
        champ.dispatchEvent(new Event('change', { bubbles: true }));
      });

      actionsEl.addEventListener('click', function (e) {
        var bouton = e.target.closest('.btn-mini');
        if (!bouton) return;
        var m = bouton.getAttribute('data-modificateur');
        modificateur = modificateur === m ? null : m;
        actionsEl.querySelectorAll('.btn-mini').forEach(function (b) {
          var actif = b.getAttribute('data-modificateur') === modificateur;
          b.classList.toggle('actif', actif);
          b.setAttribute('aria-pressed', actif ? 'true' : 'false');
        });
        afficher();
      });

      // Écran fournil : plein écran, gros caractères, sans navigation.
      function basculerEcranFournil(actif) {
        document.body.classList.toggle('ecran-fournil', actif);
        document.getElementById('btnEcranFournil').setAttribute('aria-pressed', actif ? 'true' : 'false');
        try {
          if (actif && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
          if (!actif && document.fullscreenElement) document.exitFullscreen().catch(function () {});
        } catch (e) {}
      }
      document.getElementById('btnEcranFournil').addEventListener('click', function () { basculerEcranFournil(true); });
      document.getElementById('btnQuitterFournil').addEventListener('click', function () { basculerEcranFournil(false); });
      document.addEventListener('fullscreenchange', function () {
        if (!document.fullscreenElement) basculerEcranFournil(false);
      });

      var aujourdhuiOuvert = true;
      function choisirJour(quel) {
        var maintenant = new Date();
        var estAujourdhui = quel === 'aujourdhui' && aujourdhuiOuvert;
        jourCible = estAujourdhui ? maintenant : C.prochainJourOuvert(ctx);
        cocheCle = 'apoint-fournee-cuit:' + ctx.commercantId + ':' + MP.versISO(jourCible);
        var dateTitre = MP.formatDateLongue(jourCible).toLowerCase();
        titreEl.textContent = estAujourdhui ? 'À enfourner aujourd\'hui, ' + dateTitre : 'À enfourner pour ' + dateTitre;
        var selecteur = document.getElementById('selecteurJour');
        selecteur.hidden = false;
        selecteur.querySelectorAll('[data-jour]').forEach(function (b) {
          var actif = (b.getAttribute('data-jour') === 'aujourdhui') === estAujourdhui;
          b.classList.toggle('actif', actif);
          b.setAttribute('aria-pressed', actif ? 'true' : 'false');
          if (b.getAttribute('data-jour') === 'aujourdhui') {
            b.disabled = !aujourdhuiOuvert;
            b.title = aujourdhuiOuvert ? '' : 'Fermé aujourd\'hui';
          } else {
            var d = C.prochainJourOuvert(ctx);
            b.textContent = MP.versISO(d) === MP.versISO(MP.ajouterJours(maintenant, 1)) ? 'Demain' : MP.capitaliser(MP.nomsJours[d.getDay()]);
          }
        });
      }

      // Tant qu'aucune caisse ne remonte les ventes, la saisie d'hier est à un
      // tapotement. La carte disparaît dès qu'hier est saisi (ou jour fermé).
      function afficherCarteSaisieHier() {
        var carte = document.getElementById('carteSaisieHier');
        // Ventes périmées (plus de 3 jours sans vente) : toujours signalé, en
        // premier, avec le même bouton de saisie.
        var dernieres = C.dernieresVentes(ctx);
        if (dernieres && dernieres.perimees) {
          var d = new Date(dernieres.date + 'T00:00:00');
          carte.querySelector('strong').textContent = 'Dernières ventes le ' + d.getDate() + ' ' + MP.nomsMoisCourts[d.getMonth()] + ' : saisis-les ou branche ta caisse';
          document.getElementById('texteSaisieHier').textContent = 'Sans ventes récentes, la fournée se base sur un historique ancien.';
          carte.hidden = false;
          return;
        }
        var hier = MP.ajouterJours(new Date(), -1);
        var isoHier = MP.versISO(hier);
        if (ctx.joursFermeture.indexOf(hier.getDay()) !== -1) return;
        if (ctx.ventes.some(function (v) { return v.date_vente === isoHier; })) return;
        ctx.sb.from('connexions_caisse').select('fournisseur, statut, derniere_synchro').eq('commercant_id', ctx.commercantId).then(function (r) {
          var caisseActive = (r.data || []).some(function (cx) {
            return cx.statut === 'active' && (cx.fournisseur === 'sumup' || !!cx.derniere_synchro);
          });
          if (caisseActive) return;
          document.getElementById('texteSaisieHier').textContent = MP.formatDateLongue(hier) + ' : sans ces ventes, la prochaine fournée ne peut pas apprendre.';
          document.getElementById('carteSaisieHier').hidden = false;
        }, function () {});
      }

      C.charger().then(function (c) {
        ctx = c;
        statutDiv.textContent = (ctx.parametres && ctx.parametres.nom_restaurant) || '';
        document.getElementById('bandeauReglages').hidden = !!(ctx.parametres && ctx.parametres.code_postal);
        // Avant midi, un jour d'ouverture, la fournée est celle du jour (on
        // coche ce qu'on enfourne ce matin) ; ensuite, celle du lendemain.
        // Sélecteur Aujourd'hui / Demain ; les cases restent attachées à leur date.
        var maintenant = new Date();
        aujourdhuiOuvert = ctx.joursFermeture.indexOf(maintenant.getDay()) === -1;
        choisirJour(maintenant.getHours() < 12 && aujourdhuiOuvert ? 'aujourdhui' : 'demain');
        afficherCarteSaisieHier();

        if (ctx.ventes.length === 0) {
          listeEl.innerHTML = '<div class="carte-vide-claire">Pas encore de ventes : branche ta caisse ou ajoute la journée d\'hier depuis <a href="parametres.html#donnees">Paramètres &gt; Mes données</a>.</div>';
          return;
        }
        actionsEl.hidden = false;
        chargerCuites().then(function () {
          afficher();
          C.enrichir(ctx).then(afficher);
        });
        document.getElementById('selecteurJour').addEventListener('click', function (e) {
          var b = e.target.closest('[data-jour]');
          if (!b || b.disabled) return;
          choisirJour(b.getAttribute('data-jour'));
          chargerCuites().then(afficher);
        });
      }).catch(function (err) {
        if (err && err.nonConnecte) {
          statutDiv.innerHTML = 'Non connecté. <a href="connexion.html">Se connecter</a>';
        } else {
          statutDiv.textContent = "Impossible de charger tes données. Vérifie ta connexion et recharge la page.";
        }
      });
    })();
  </script>
</body>
</html>
