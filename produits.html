
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>À Point - Mes produits</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="conteneur conteneur--moyen">
    <header class="entete-site">
      <a href="tableau-de-bord.html" class="logo">
        <svg class="logo-marque" viewBox="0 0 100 100" width="26" height="26" aria-hidden="true">
          <path d="M50 12 L16 86" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none"/>
          <path d="M50 12 L84 86" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none"/>
          <circle cx="50" cy="56" r="8" fill="currentColor"/>
        </svg>
      </a>
      <nav class="nav-principale">
        <a href="tableau-de-bord.html" class="nav-lien">Tableau de bord</a>
        <a href="produits.html" class="nav-lien nav-actif">Mes produits</a>
        <a href="ventes.html" class="nav-lien">Mes ventes</a>
        <a href="import.html" class="nav-lien">Importer</a>
      </nav>
    </header>

    <div class="carte-page">
      <div class="entete-page">
        <div>
          <p class="eyebrow">Gestion</p>
          <h1>Mes produits</h1>
        </div>
        <div class="badge-page" id="badgeProduits" style="display:none;"></div>
      </div>
      <p id="statutConnexion" class="texte-aide">Vérification de la connexion...</p>

      <div id="zoneFormulaire" style="display:none;">
        <p class="section-titre" style="margin-top:22px;">Ajouter un produit</p>
        <div class="ligne-form">
          <input type="text" id="nomProduit" placeholder="Exemple : Baguette tradition" aria-label="Nom du produit">
          <button id="btnAjouter">Ajouter</button>
        </div>

        <div id="message"></div>

        <p class="section-titre">Mes produits actuels</p>
        <ul id="listeProduits" class="liste-produits"></ul>
      </div>
    </div>
  </div>

  <script>
        (function () {
      var SUPABASE_URL = "https://eqvbksxfwlgbcxgqljqn.supabase.co";
      var SUPABASE_KEY = "sb_publishable_Dlh12BadZ13vHrUR0o7O7Q_i3aN2VMc";
      var sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      var statutDiv = document.getElementById('statutConnexion');
      var zoneFormulaire = document.getElementById('zoneFormulaire');
      var messageDiv = document.getElementById('message');
      var listeProduits = document.getElementById('listeProduits');
      var badgeProduits = document.getElementById('badgeProduits');
      var commercantId = null;

      function chargerProduits() {
        sbClient.from('produits').select('*').eq('commercant_id', commercantId).then(function (result) {
          listeProduits.innerHTML = '';
          var nb = result.data ? result.data.length : 0;
          badgeProduits.textContent = nb + (nb > 1 ? ' produits' : ' produit');
          badgeProduits.style.display = 'inline-block';
          if (result.data) {
            result.data.forEach(function (produit) {
              var li = document.createElement('li');
              li.textContent = produit.nom;
              listeProduits.appendChild(li);
            });
          }
        });
      }

      sbClient.auth.getSession().then(function (result) {
        var session = result.data.session;
        if (session) {
          commercantId = session.user.id;
          statutDiv.textContent = "Connecté en tant que : " + session.user.email;
          zoneFormulaire.style.display = 'block';
          chargerProduits();
        } else {
          statutDiv.textContent = "Tu n'es pas connecté. Va d'abord sur la page de connexion.";
        }
      });

      document.getElementById('btnAjouter').addEventListener('click', function () {
        var nomProduit = document.getElementById('nomProduit').value;

        if (!nomProduit) {
          messageDiv.style.display = 'block';
          messageDiv.className = 'erreur';
          messageDiv.textContent = "Merci d'entrer un nom de produit.";
          return;
        }

        sbClient.from('produits').insert({
          commercant_id: commercantId,
          nom: nomProduit
        }).then(function (result) {
          messageDiv.style.display = 'block';
          if (result.error) {
            messageDiv.className = 'erreur';
            messageDiv.textContent = "Erreur : " + result.error.message;
          } else {
            messageDiv.className = 'succes';
            messageDiv.textContent = "Produit ajouté !";
            document.getElementById('nomProduit').value = '';
            chargerProduits();
          }
        });
      });
    })();
  </script>
</body>
</html>
