<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muscu — On Air</title>
<meta name="description" content="Mon carnet d'entraînement à la salle On Air Angers.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<style>
  :root{
    --bg:#f7f6f3; --panel:#ffffff; --panel-2:#efeee9; --line:#e2e0d8;
    --ink:#16150f; --ink-2:#5c5a50; --ink-3:#7b796e;
    --hot:#c0391e; --hot-ink:#ffffff; --hot-soft:#f7e6e1;
    --go:#2d6a4a; --go-ink:#ffffff; --go-soft:#e1efe6;
    --warn:#9a6a00; --warn-soft:#fbf1d9;
    --hero:#16150f; --hero-ink:#f7f6f3;
    --art-bg:#edece6; --art-frame:#b2afa2; --art-pad:#cfcbbd; --art-metal:#8f8c80; --art-ink:#16150f;
    --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.16);
    --tabh:56px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111113; --panel:#1b1b1e; --panel-2:#26262b; --line:#34343c;
      --ink:#f2f1ec; --ink-2:#c4c2b8; --ink-3:#9a988f;
      --hot:#f0714c; --hot-ink:#1a0d08; --hot-soft:#3a211a;
      --go:#73d49b; --go-ink:#0d2418; --go-soft:#183024;
      --warn:#f2c14e; --warn-soft:#332a14;
      --hero:#26262b; --hero-ink:#f2f1ec;
      --art-bg:#232329; --art-frame:#5e5e69; --art-pad:#4a4a55; --art-metal:#76768a; --art-ink:#e8e7e1;
      --shadow:0 10px 30px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111113; --panel:#1b1b1e; --panel-2:#26262b; --line:#34343c;
    --ink:#f2f1ec; --ink-2:#c4c2b8; --ink-3:#9a988f;
    --hot:#f0714c; --hot-ink:#1a0d08; --hot-soft:#3a211a;
    --go:#73d49b; --go-ink:#0d2418; --go-soft:#183024;
    --warn:#f2c14e; --warn-soft:#332a14;
    --hero:#26262b; --hero-ink:#f2f1ec;
    --art-bg:#232329; --art-frame:#5e5e69; --art-pad:#4a4a55; --art-metal:#76768a; --art-ink:#e8e7e1;
    --shadow:0 10px 30px rgba(0,0,0,.55);
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior-y:none}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  button{-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px calc(var(--tabh) + var(--sab) + 120px)}
  .num{font-variant-numeric:tabular-nums}

  /* en-tête */
  .top{position:sticky;top:0;z-index:15;margin:0 -16px;padding:calc(10px + var(--sat)) 16px 10px;
    background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
    border-bottom:.5px solid transparent;display:flex;align-items:center;gap:8px}
  .top.scrolled{border-bottom-color:var(--line)}
  .top h1{flex:1;margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{font-size:13px;color:var(--ink-2);background:var(--panel-2);border:0;border-radius:99px;padding:0 12px;height:36px;display:flex;align-items:center;gap:4px}
  .chip b{color:var(--ink)}
  .icon-btn{appearance:none;border:0;background:var(--panel-2);width:44px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
  .icon-btn svg{width:20px;height:20px}
  .big-title{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:8px 0 4px}
  h2{font-size:24px;font-weight:800;letter-spacing:-.025em;margin:22px 0 4px;line-height:1.15}
  h3{font-size:13px;margin:28px 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
  .lead{color:var(--ink-2);font-size:15px;margin:0 0 14px}
  .small{font-size:13.5px}
  .muted{color:var(--ink-3)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .panel.flat{padding:0;overflow:hidden}
  .panel p{margin:0}
  .panel p+p{margin-top:10px}

  /* barre d'onglets */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(var(--tabh) + var(--sab));padding-bottom:var(--sab);
    display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--panel) 86%,transparent);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid var(--line)}
  .tabbar button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:10.5px;font-weight:600;color:var(--ink-3)}
  .tabbar svg{width:26px;height:26px}
  .tabbar button[aria-selected="true"]{color:var(--hot)}

  /* sélecteur de séance */
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel-2);padding:4px;border-radius:14px;margin:6px 0 14px}
  .seg button{appearance:none;border:0;background:none;height:40px;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--ink-2);position:relative}
  .seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .seg button .ck{position:absolute;top:3px;right:6px;font-size:11px;color:var(--go)}
  .musc{font-size:15px;font-weight:600;color:var(--ink-2);margin:0 0 2px}
  details.about{margin:4px 0 12px}
  details.about summary{cursor:pointer;font-size:14px;color:var(--ink-3);font-weight:600;list-style:none;padding:6px 0}
  details.about summary::-webkit-details-marker{display:none}
  details.about p{margin:4px 0 0;font-size:14.5px;color:var(--ink-2)}

  .banner{border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px;background:var(--warn-soft);color:var(--ink)}
  .banner b{color:var(--warn)}
  .banner.info{background:var(--panel-2)}

  /* progression collante */
  .sprog{position:sticky;top:calc(56px + var(--sat));z-index:12;margin:0 -16px 12px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .sprog .row{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .sprog .row b{color:var(--ink)}
  .sprog .dots{display:flex;gap:6px;margin-left:auto}
  .sprog .dots button{appearance:none;border:0;width:22px;height:22px;border-radius:99px;background:var(--panel-2);font-size:11px;font-weight:800;color:var(--ink-3);padding:0}
  .sprog .dots button.on{background:var(--ink);color:var(--bg)}
  .sprog .dots button.ok{background:var(--go);color:var(--go-ink)}
  .bar{height:6px;border-radius:9px;background:var(--panel-2);overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--go);border-radius:9px;transition:width .3s}

  /* carte exercice */
  .exo{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;scroll-margin-top:calc(110px + var(--sat))}
  .exo.active{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
  .exo.full{border-color:var(--go)}
  .exo-hd{display:flex;gap:12px;padding:12px 12px 10px}
  .thumb{appearance:none;border:0;padding:0;width:88px;height:88px;border-radius:14px;overflow:hidden;flex:none;background:var(--art-bg);position:relative}
  .thumb img,.thumb svg{display:block;width:100%;height:100%;object-fit:cover}
  .thumb .n{position:absolute;top:5px;left:5px;min-width:22px;height:22px;border-radius:7px;background:var(--panel);color:var(--ink-2);
    font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
  .exo.full .thumb .n{background:var(--go);color:var(--go-ink)}
  .exo-ti{flex:1;min-width:0}
  .exo-ti h4{margin:0 0 3px;font-size:17px;line-height:1.22;letter-spacing:-.015em;font-weight:700}
  .exo-ti .meta{font-size:14px;color:var(--ink-2)}
  .exo-ti .meta b{color:var(--ink)}
  .exo-ti .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--hot-soft);color:var(--hot);margin-top:5px}
  .exo-ti .tag.opt{background:var(--panel-2);color:var(--ink-2)}
  .reg{display:flex;align-items:center;gap:8px;margin:0 12px 8px;font-size:13.5px;color:var(--ink-2)}
  .reg button{appearance:none;border:0;background:none;color:var(--ink-2);padding:6px 0;text-align:left;min-height:32px}
  .reg button b{color:var(--ink)}
  .reg input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 10px;font-size:15px}
  .tip{margin:0 12px 10px;padding:10px 12px;border-radius:12px;font-size:14px;background:var(--go-soft);color:var(--ink)}
  .tip b{color:var(--go)}
  .tip.down{background:var(--warn-soft)}
  .tip.down b{color:var(--warn)}
  .tip.info{background:var(--panel-2)}

  .sets{background:var(--panel-2);padding:10px 10px 12px}
  .sets-hd,.set{display:grid;grid-template-columns:34px 1fr 1fr 56px;gap:8px;align-items:center}
  .sets-hd{padding:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;text-align:center}
  .set{margin-bottom:8px}
  .set .n{font-weight:800;font-size:15px;color:var(--ink-3);text-align:center}
  .set.warm .n{font-size:12px;color:var(--warn)}
  .set input{width:100%;min-width:0;font-size:22px;font-weight:700;padding:9px 4px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
    text-align:center;font-variant-numeric:tabular-nums;height:50px}
  .set.warm input{font-size:18px;height:44px;color:var(--ink-2)}
  .set input:focus{outline:2px solid var(--hot);outline-offset:-1px;border-color:transparent}
  .set .ok{appearance:none;border:1.5px solid var(--line);background:var(--panel);height:50px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3)}
  .set.warm .ok{height:44px}
  .set .ok svg{width:22px;height:22px}
  .set.done .ok{background:var(--go);border-color:var(--go);color:var(--go-ink)}
  .set.done input{border-color:transparent;background:var(--go-soft)}
  .set.done .n{color:var(--go)}
  .set .pr{grid-column:2/4;font-size:12px;font-weight:700;color:var(--go);margin:-4px 0 2px;text-align:center}
  .side{font-size:12px;color:var(--ink-3);text-align:center;margin:-4px 0 6px}
  .feel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
  .feel button{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;min-height:44px;font-size:14px;font-weight:600;color:var(--ink-2)}
  .feel button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .feel-q{font-size:13px;font-weight:700;color:var(--ink-2);margin:6px 0 4px}
  .prev{font-size:13.5px;color:var(--ink-2);margin-top:4px}
  .prev b{color:var(--ink)}
  .exo-ft{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
  .exo-ft button{appearance:none;border:0;background:none;color:var(--ink-2);font-weight:600;font-size:14px;min-height:40px;padding:0 4px}
  .exo-ft button:last-child{margin-left:auto}
  .collapsed{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:56px;width:100%;appearance:none;border:0;background:none;text-align:left}
  .collapsed .c{width:26px;height:26px;border-radius:99px;background:var(--go);color:var(--go-ink);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
  .collapsed .t{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .collapsed .s{font-size:13.5px;color:var(--ink-2);white-space:nowrap}

  .btn{appearance:none;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:15.5px;padding:0 18px;min-height:50px;border-radius:14px}
  .btn:active{transform:scale(.98)}
  .btn.hot{background:var(--hot);color:var(--hot-ink)}
  .btn.line{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-weight:600}
  .btn.wide{width:100%}
  .row-in{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row-in label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;display:flex;flex-direction:column;gap:4px}
  .row-in input{width:96px;font-size:20px;font-weight:700;height:50px;padding:0 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);text-align:center;font-variant-numeric:tabular-nums}

  /* héro + stats */
  .hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px;margin:8px 0 12px;border-left:4px solid var(--hot)}
  .hero small{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.7}
  .hero b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.15}
  .hero p{margin:0 0 14px;opacity:.85;font-size:14.5px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
  .stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat b i{font-style:normal;font-size:13px;color:var(--ink-3);font-weight:500}

  /* listes iOS */
  .list .li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px;border-bottom:1px solid var(--line);width:100%;appearance:none;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
  .list .li:last-child{border-bottom:0}
  .list .li:active{background:var(--panel-2)}
  .list .li .day{flex:0 0 38px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
  .list .li .w{flex:1;min-width:0}
  .list .li .w b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list .li .w small{display:block;color:var(--ink-2);font-size:13.5px}
  .list .li.rest .w b{color:var(--ink-3);font-weight:500}
  .list .li.today{background:var(--hot-soft)}
  .list .li .r{flex:none;font-size:13.5px;font-weight:700;color:var(--go);text-align:right}
  .list .li .r.n{color:var(--ink-3);font-weight:500}
  .list .li .chev{flex:none;color:var(--ink-3);font-size:20px}
  .vol{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:14px;padding:6px 0}
  .vol .b{height:10px;border-radius:9px;background:var(--panel-2);position:relative;overflow:hidden}
  .vol .b i{position:absolute;inset:0 auto 0 0;background:var(--ink-3);border-radius:9px}
  .vol .b i.p{background:var(--hot)}
  .vol span:last-child{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}

  .note{font-size:14px;color:var(--ink-2);margin:12px 0 0!important;padding-top:12px;border-top:1px solid var(--line)}
  .note b{color:var(--ink)}
  ul.clean,ol.clean{margin:0;padding-left:20px;font-size:15px}
  ul.clean li,ol.clean li{margin-bottom:9px}
  ul.clean li:last-child,ol.clean li:last-child{margin-bottom:0}
  .macro{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .macro div{background:var(--panel-2);border-radius:12px;padding:12px}
  .macro small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
  .macro b{font-size:19px;font-weight:800}
  .macro span{display:block;font-size:13px;color:var(--ink-2)}
  .spark svg{display:block;width:100%;height:64px}
  .meas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .meas label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;display:flex;flex-direction:column;gap:4px}
  .meas input{width:100%;font-size:18px;font-weight:700;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);text-align:center}

  /* chrono */
  .timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--sab) + 10px);z-index:30;
    background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;align-items:center;gap:6px;
    box-shadow:var(--shadow);width:min(calc(100% - 20px),460px)}
  .ring{position:relative;width:52px;height:52px;flex:none}
  .ring svg{width:52px;height:52px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:5}
  .ring .bgc{stroke:var(--panel-2)}
  .ring .fg{stroke:var(--hot);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
  .timer .tx{flex:1;min-width:0;padding-left:2px;appearance:none;border:0;background:none;text-align:left}
  .timer .tx b{display:block;font-variant-numeric:tabular-nums;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .timer .tx small{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
  .timer .tb{appearance:none;border:0;background:var(--panel-2);color:var(--ink);font-size:14px;font-weight:700;min-width:44px;min-height:44px;padding:0 8px;border-radius:12px}
  .timer .tb.x{background:var(--ink);color:var(--bg)}
  .timer.end{background:var(--go);border-color:var(--go);animation:pulse 1s ease-in-out 3}
  .timer.end .tx b,.timer.end .tx small{color:var(--go-ink)}
  .timer.end .ring{display:none}
  .timer.end .tb{background:color-mix(in srgb,var(--go-ink) 15%,transparent);color:var(--go-ink)}
  @keyframes pulse{50%{transform:translateX(-50%) scale(1.04)}}
  .hidden{display:none!important}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--sab) + 84px);background:var(--ink);color:var(--bg);
    padding:10px 14px;border-radius:14px;font-size:14.5px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:92%;display:flex;gap:12px;align-items:center}
  .toast button{appearance:none;border:0;background:none;color:var(--hot);font-weight:800;min-height:32px}
  .foot{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:22px}

  /* feuille modale */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;opacity:0;transition:opacity .2s}
  .sheet-bg.on{opacity:1}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;
    padding:8px 16px calc(20px + var(--sab));transform:translateY(100%);transition:transform .25s ease;max-width:680px;margin:0 auto;-webkit-overflow-scrolling:touch}
  .sheet.on{transform:none}
  .sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
  .sheet .shd{display:flex;align-items:flex-start;gap:10px}
  .sheet .shd h3{flex:1;margin:4px 0 8px;font-size:19px;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
  .sheet .close{appearance:none;border:0;background:var(--panel-2);width:36px;height:36px;border-radius:99px;font-size:18px;color:var(--ink-2);flex:none}
  .sheet .pic{border-radius:16px;overflow:hidden;background:var(--art-bg);margin-bottom:12px}
  .sheet .pic img{display:block;width:100%;max-height:52vh;object-fit:cover}
  .sheet .pic svg{display:block;width:100%;height:auto}
  .sheet h5{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:18px 0 8px}
  .sheet ol,.sheet ul{margin:0;padding-left:20px;font-size:15px;color:var(--ink-2)}
  .sheet li{margin-bottom:8px}
  .sheet p{font-size:15px;color:var(--ink-2);margin:0}
  .alts{display:flex;flex-direction:column;gap:8px}
  .alt{display:flex;gap:10px;align-items:center;background:var(--panel-2);border-radius:12px;padding:8px;font-size:14.5px}
  .alt img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .presets button{appearance:none;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;min-height:52px;font-size:17px;font-weight:700}
  .presets button.on{background:var(--ink);color:var(--bg)}
  .photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .photo-actions label,.photo-actions button{appearance:none;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;min-height:44px;padding:0 14px;
    display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer}
  .photo-actions input{display:none}

  /* illustrations */
  .a-floor{stroke:var(--art-metal);stroke-width:3;stroke-linecap:round;fill:none;opacity:.55}
  .a-frame{stroke:var(--art-frame);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .a-thin{stroke:var(--art-metal);stroke-width:2.6;stroke-linecap:round;fill:none}
  .a-pad{stroke:var(--art-pad);stroke-width:12;stroke-linecap:round;fill:none}
  .a-plate{fill:var(--art-metal)}
  .a-stack{fill:var(--art-pad);stroke:var(--art-frame);stroke-width:2.5}
  .a-stackline{stroke:var(--art-frame);stroke-width:2;stroke-linecap:round;fill:none}
  .a-torso{stroke:var(--art-ink);stroke-width:12;stroke-linecap:round;fill:none}
  .a-limb{stroke:var(--art-ink);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .a-head{fill:var(--art-ink)}
  .a-arw{stroke:var(--hot);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
</style>
</head>

const KEY="nils-training-v1";
const BLANK=()=>({v:3,log:{},bw:[],hist:[],meas:[],notes:{},rest:{},start:null,ts:0});

function migrate(s){
  const v=s&&s.v;
  s=Object.assign(BLANK(),s||{});
  if(!v){ /* v1 : clés « A:a1 » et une seule série par jour */
    const nl={};
    Object.keys(s.log||{}).forEach(key=>{
      const[k,id]=key.split(":");const map={a1:"chestIncline",a2:"latPulldown",a3:"smithBench",a4:"shoulderPress",a5:"cableLatRaise",a6:"triPushdown",
        b1:"legPress",b2:"legCurl",b3:"legExt",b4:"adductor",b5:"calfPress",b6:"plank",c1:"seatedRow",c2:"latPulldownV",c3:"pecDeck",c4:"cableLatRaise",
        c5:"rearDelt",c6:"preacherCurl",d1:"preacherCurl",d2:"machineCurl",d3:"triPushdown",d4:"overheadTri",d5:"cableLatRaise",d6:"rearDelt",d7:"plank"};
      const u=map[id]||key;
      (s.log[key]||[]).forEach(x=>{const sets=x.sets||[{kg:x.kg,reps:x.reps}];nl[u]=nl[u]||[];
        const ex=nl[u].find(y=>y.d===x.d);if(ex)ex.sets=ex.sets.concat(sets);else nl[u].push({d:x.d,sets});});
    });
    s.log=nl;
    Object.entries(s.done||{}).forEach(([k,d])=>{if(!s.hist.some(h=>h.d===d&&h.k===k))s.hist.push({d,k});});
    delete s.done;
  }
  /* nettoyage : entrées sans série valide (corrige le bug des séries vides) */
  Object.keys(s.log).forEach(u=>{s.log[u]=(s.log[u]||[]).filter(x=>W(x).length||(x.warm||[]).some(Boolean)).sort((a,b)=>a.d<b.d?-1:1);if(!s.log[u].length)delete s.log[u];});
  s.v=3;
  if(!s.start){const ds=[].concat(...Object.values(s.log).map(a=>a.map(x=>x.d)),s.hist.map(h=>h.d)).sort();s.start=ds[0]||today();}
  return s;
}
function loadLocal(){try{const r=localStorage.getItem(KEY);store=migrate(r?JSON.parse(r):null);}catch(e){store=migrate(null);}}
function persist(){store.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}
  if(!db||!uid)return;clearTimeout(saveT);
  saveT=setTimeout(()=>{db.collection("data/users/"+uid).doc("training").set({payload:JSON.stringify(store)}).catch(()=>{});},800);}
async function initCloud(){

    const [u,d]=await Promise.all([claude.use("user"),claude.use("db")]);
    if(!u||!d)return;
    uid=await u.id();db=d;

    if(doc&&doc.payload){try{const r=JSON.parse(doc.payload);
      if((r.ts||0)>(store.ts||0)){store=migrate(r);try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}render(true);}else persist();}catch(e){}}

}

function openIDB(){return new Promise(res=>{try{const r=indexedDB.open("nils-gym-photos",1);

function idbAll(){return new Promise(res=>{if(!idb)return res();try{const rq=idb.transaction("p").objectStore("p").openCursor();
  rq.onsuccess=()=>{const c=rq.result;if(c){PH[c.key]=URL.createObjectURL(c.value);c.continue();}else res();};rq.onerror=()=>res();}catch(e){res();}});}
function idbPut(k,b){return new Promise(res=>{if(!idb)return res(false);try{const tx=idb.transaction("p","readwrite");tx.objectStore("p").put(b,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false);}});}

function compress(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const r=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.82);};
  img.onerror=()=>{URL.revokeObjectURL(u);rej();};img.src=u;});}

/* ===================== CYCLE ET PROGRESSION ===================== */
function cycleInfo(){const w=Math.max(0,Math.floor(daysBetween(store.start,today())/7));return {cycle:Math.floor(w/6)+1,wk:w%6+1,deload:w%6===5};}
const seriesFor=e=>cycleInfo().deload?Math.ceil(e.series/2):e.series;
const restFor=e=>store.rest[e.uid]||e.rest;
const H=u=>store.log[u]||[];
const todayEntry=u=>H(u).find(x=>x.d===today());
const pastEntries=u=>H(u).filter(x=>x.d!==today()&&W(x).length);

function plan(e){
  const n=seriesFor(e),past=pastEntries(e.uid),last=past[past.length-1],dl=cycleInfo().deload;
  const out={kg:e.kg0,reps:Array(n).fill(e.min),msg:null,cls:""};
  if(!last){out.msg=`Première fois : ${e.kg0!=null?`commence à <b>${fmt(e.kg0)} kg${sideTxt(e,e.kg0)}</b>`:"commence léger"} et cherche une charge où tu fais au moins ${e.min} répétitions propres.`;out.cls="info";return out;}
  const S=W(last).slice(0,n),wk=best(last);out.kg=wk;
  const under=x=>W(x).slice(0,n).some(s=>s.reps<e.min);
  if(dl){out.reps=S.map(s=>Math.max(e.min,s.reps-2));while(out.reps.length<n)out.reps.push(e.min);
    out.msg="<b>Semaine légère</b> : même charge, moitié des séries, garde 3 répétitions en réserve.";out.cls="info";return out;}
  if(S.length>=n&&S.every(s=>s.reps>=e.max&&s.kg>=wk)&&last.feel!=="echec"){
    out.kg=wk+e.inc;out.reps=Array(n).fill(e.min);
    out.msg=`Tu as fait ${e.max} répétitions partout : <b>monte à ${fmt(out.kg)} kg</b>${sideTxt(e,out.kg)} et vise ${e.min} répétitions.`;return out;}
  if(past.length>=2&&under(last)&&under(past[past.length-2])){
    out.kg=roundTo(Math.max(0,wk-e.inc),e.inc/2);out.reps=Array(n).fill(e.max);
    out.msg=`Deux séances sous ${e.min} répétitions : <b>redescends à ${fmt(out.kg)} kg</b> et refais le plein de répétitions.`;out.cls="down";return out;}
  out.reps=Array.from({length:n},(_,j)=>{const r=(S[j]||S[S.length-1]).reps;return Math.min(e.max,r+1);});
  const tot=x=>W(x).slice(0,n).reduce((a,s)=>a+s.reps,0);
  const l3=past.slice(-3);
  if(l3.length===3&&l3.every(x=>best(x)===wk)&&tot(l3[2])<=tot(l3[0])){
    out.msg="Tu stagnes depuis 3 séances : dors bien, mange assez, et si ça dure, fais cet exercice plus léger (-10 %) une semaine.";out.cls="down";return out;}
  out.msg=`Même charge, <b>une répétition de plus</b> par série : ${out.reps.join(" · ")}.`;
  return out;
}
const warmups=(e,kg)=>e.warm&&kg>0&&!cycleInfo().deload?[{kg:roundTo(kg*.5,e.inc),reps:10},{kg:roundTo(kg*.75,e.inc),reps:5}]:[];

function sessionStats(k){let done=0,tot=0;
  P[k].exos.forEach(e=>{if(e.opt)return;const n=seriesFor(e);tot+=n;done+=Math.min(W(todayEntry(e.uid)).length,n);});return {done,tot};}
const isFull=e=>W(todayEntry(e.uid)).length>=seriesFor(e);
function activeIdx(k){const ex=P[k].exos;const i=ex.findIndex(e=>!isFull(e)&&!e.opt);return i<0?ex.findIndex(e=>!isFull(e)):i;}

function card(k,e,i){
  const te=todayEntry(e.uid),n=seriesFor(e),sets=(te&&te.sets)||[],doneN=W(te).length;
  if(doneN>=n&&te.feel&&!expanded[e.uid]){
    const S=W(te);return `<button class="collapsed" data-open="1"><span class="c">✓</span><span class="t">${esc(e.nom)}</span><span class="s num">${S.length} × ${fmt(best(te))} kg</span></button>`;}
  const pl=plan(e),past=pastEntries(e.uid),last=past[past.length-1];
  const firstKg=num(sets[0]&&sets[0].kg)??pl.kg;
  const wu=warmups(e,pl.kg),wl=(te&&te.warm)||[];
  const pb=past.length?Math.max(...past.map(best)):null;
  const rows=[];
  wu.forEach((w,j)=>{const d=wl[j];rows.push(`<div class="set warm ${d?"done":""}" data-w="${j}"><span class="n">É${j+1}</span>
    <input type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Charge échauffement ${j+1}" value="${fmt(d?d.kg:w.kg)}">
    <input type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" aria-label="Répétitions échauffement ${j+1}" value="${d?d.reps:w.reps}">
    <button class="ok" aria-label="Valider l'échauffement ${j+1}">${I_OK}</button></div>`);});
  const lastDone=W(te).sort((x,y)=>(y.t||0)-(x.t||0))[0];
  for(let j=0;j<n;j++){const d=sets[j];
    const kgV=d?d.kg:(lastDone?lastDone.kg:pl.kg),rpV=d?d.reps:pl.reps[j];
    rows.push(`<div class="set ${d?"done":""}" data-j="${j}"><span class="n">${j+1}</span>
      <input type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Charge série ${j+1}" placeholder="kg" value="${kgV==null?"":fmt(kgV)}">
      <input type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" aria-label="Répétitions série ${j+1}" placeholder="reps" value="${rpV==null?"":rpV}">
      <button class="ok" aria-label="Valider la série ${j+1}">${I_OK}</button>
      ${d&&pb!=null&&d.kg>pb?`<span class="pr">🏆 Record : ${fmt(d.kg)} kg</span>`:""}</div>`);}
  const note=store.notes[e.uid];
  return `<div class="exo-hd">
      <button class="thumb" data-info="1" aria-label="Voir la machine et les consignes">${picHTML(e)}<span class="n">${doneN>=n?"✓":i+1}</span></button>
      <div class="exo-ti"><h4>${esc(e.nom)}</h4>
        <div class="meta"><b>${n} × ${repsTxt(e)}</b> · repos <b>${mmss(restFor(e))}</b></div>
        <span class="tag ${e.opt?"opt":""}">${e.opt?"Facultatif · ":""}${e.muscle}</span></div></div>
    <div class="reg" data-reg="1">${note?`<button data-edit="1">⚙︎ Réglages : <b>${esc(note)}</b></button>`:`<button data-edit="1">⚙︎ Noter mes réglages (siège, dossier, cran…)</button>`}</div>
    ${pl.msg&&doneN<n?`<div class="tip ${pl.cls}">${pl.msg}</div>`:""}
    <div class="sets">
      <div class="sets-hd"><span>Série</span><span>kg</span><span>Reps</span><span></span></div>
      <div class="side">Charge = ${UNIT[e.unit]}${e.unit==="disques"?" (sans le poids de la machine)":""}</div>
      ${rows.join("")}
      ${doneN>=n?`<div class="feel-q">C'était comment ?</div><div class="feel">${[["facile","Facile"],["dur","Dur, 1-2 en réserve"],["echec","À l'échec"]].map(([v,l])=>`<button data-feel="${v}" class="${te.feel===v?"on":""}">${l}</button>`).join("")}</div>`:""}
      <div class="prev">${last?`Dernière fois (${fr(last.d)}) : <b class="num">${W(last).map(s=>`${fmt(s.kg)}×${s.reps}`).join(" · ")}</b>`:`Départ conseillé : <b>${e.depart}</b>`}</div>
    </div>

}

function refreshCard(k,e){

  el.classList.toggle("full",isFull(e));wire(k,e);
  const st=sessionStats(k),ai=activeIdx(k);$("pdone").textContent=st.done;$("pbar").style.width=(st.tot?st.done/st.tot*100:0)+"%";
  P[k].exos.forEach((x,j)=>{const c=$("c-"+x.id);if(c)c.classList.toggle("active",j===ai);
    const d=view.querySelector(`[data-jump="${x.id}"]`);if(d)d.className=isFull(x)?"ok":j===ai?"on":"";});
  const r=view.querySelector(".sprog .row span b");if(r)r.textContent=`${Math.min(ai<0?P[k].exos.length:ai+1,P[k].exos.length)}/${P[k].exos.length}`;
}
function entryFor(u){const L=store.log[u]=store.log[u]||[];let te=L.find(x=>x.d===today());
  if(!te){te={d:today(),sets:[]};L.push(te);L.sort((a,b)=>a.d<b.d?-1:1);}return te;}
function cleanEntry(u,te){while(te.sets.length&&!te.sets[te.sets.length-1])te.sets.pop();
  for(let q=0;q<te.sets.length;q++)if(!te.sets[q])te.sets[q]=null;
  if(!W(te).length&&!(te.warm||[]).some(Boolean)){store.log[u]=(store.log[u]||[]).filter(x=>x!==te);if(!store.log[u].length)delete store.log[u];}}

function wire(k,e){
  const box=$("c-"+e.id);if(!box)return;
  const o=box.querySelector("[data-open]");if(o){o.onclick=()=>{expanded[e.uid]=true;refreshCard(k,e);};return;}
  box.querySelectorAll("[data-info]").forEach(b=>b.onclick=()=>infoSheet(e,k));
  const cl=box.querySelector("[data-close]");if(cl)cl.onclick=()=>{expanded[e.uid]=false;refreshCard(k,e);};
  box.querySelector("[data-edit]").onclick=()=>{const r=box.querySelector("[data-reg]");
    r.innerHTML=`<input type="text" maxlength="80" placeholder="ex. siège 4, dossier 2" value="${esc(store.notes[e.uid]||"")}" enterkeyhint="done"><button class="btn line" style="min-height:40px">OK</button>`;
    const inp=r.querySelector("input");inp.focus();
    const save=()=>{const v=inp.value.trim();if(v)store.notes[e.uid]=v;else delete store.notes[e.uid];persist();refreshCard(k,e);};
    r.querySelector("button").onclick=save;inp.onkeydown=ev=>{if(ev.key==="Enter")save();};};
  box.querySelectorAll("[data-feel]").forEach(b=>b.onclick=()=>{const te=todayEntry(e.uid);if(!te)return;te.feel=b.dataset.feel;persist();expanded[e.uid]=false;refreshCard(k,e);
    const ex=P[k].exos,nx=ex.slice(ex.indexOf(e)+1).find(x=>!isFull(x));if(nx)setTimeout(()=>$("c-"+nx.id).scrollIntoView({behavior:"smooth",block:"start"}),120);});
  box.querySelectorAll(".set").forEach(row=>{
    const [ik,ir]=row.querySelectorAll("input");
    [ik,ir].forEach(inp=>inp.addEventListener("focus",()=>setTimeout(()=>inp.select(),0)));
    if(row.dataset.j!=null)ik.addEventListener("input",()=>{let nx=row.nextElementSibling;
      while(nx&&nx.classList.contains("set")){if(!nx.classList.contains("done")&&nx.dataset.j!=null)nx.querySelector("input").value=ik.value;nx=nx.nextElementSibling;}});
    row.querySelector(".ok").onclick=()=>{
      const warm=row.dataset.w!=null,j=+(warm?row.dataset.w:row.dataset.j);
      const te=entryFor(e.uid);const arr=warm?(te.warm=te.warm||[]):te.sets;
      if(row.classList.contains("done")){const old=arr[j];arr[j]=null;cleanEntry(e.uid,te);persist();refreshCard(k,e);
        toast(`${warm?"Échauffement":"Série "+(j+1)} annulé${warm?"":"e"}`,"Rétablir",()=>{const t2=entryFor(e.uid);(warm?(t2.warm=t2.warm||[]):t2.sets)[j]=old;cleanEntry(e.uid,t2);persist();refreshCard(k,e);});return;}
      const kg=num(ik.value),rp=num(ir.value);
      if(kg===null||kg<0||kg>600){ik.focus();return toast("Indique une charge valide (ex. 27,5)");}
      if(rp===null||rp<1||rp>100||rp!==Math.round(rp)){ir.focus();return toast("Indique le nombre de répétitions");}
      const past=pastEntries(e.uid),pb=past.length?Math.max(...past.map(best)):null;
      arr[j]={kg,reps:rp,t:Date.now()};cleanEntry(e.uid,te);persist();lockWake();
      const n=seriesFor(e),doneAll=W(te).length>=n;
      refreshCard(k,e);
      if(!warm&&pb!=null&&kg>pb)toast(`🏆 Nouveau record : ${fmt(kg)} kg`);
      const ex=P[k].exos,nx=ex.slice(ex.indexOf(e)+1).find(x=>!isFull(x));
      if(warm)startRest(60,"Échauffement · "+e.nom,e);
      else if(!doneAll){const nj=te.sets.findIndex((s,q)=>q<n&&!s);const next=nj<0?W(te).length+1:nj+1;startRest(restFor(e),`Série ${Math.min(next,n)}/${n} · ${e.nom}`,e);}
      else if(nx)startRest(restFor(e),`Ensuite : ${nx.nom}`,e);
      else stopRest();
    };
  });
}

function finish(k){
  const st=sessionStats(k);
  const doIt=()=>{if(!store.hist.some(h=>h.k===k&&h.d===today()))store.hist.push({d:today(),k});persist();stopRest();summary(k);render(true);};
  if(st.done<st.tot){openSheet(`<div class="shd"><h3>Terminer la séance ?</h3></div>

    ()=>{$("sk").onclick=closeSheet;$("sf").onclick=()=>{closeSheet();doIt();};});}
  else doIt();
}
function summary(k){
  let sets=0,vol=0,ts=[];const lines=[];
  P[k].exos.forEach(e=>{const te=todayEntry(e.uid);if(!te)return;W(te).forEach(s=>{sets++;vol+=s.kg*s.reps;if(s.t)ts.push(s.t);});
    const past=pastEntries(e.uid),l=past[past.length-1];if(l&&W(te).length){const d=best(te)-best(l);
      const pb=Math.max(...past.map(best));lines.push(`<li>${esc(e.nom)} : <b>${fmt(best(te))} kg</b>${d>0?` <span style="color:var(--go);font-weight:700">+${fmt(d)} kg</span>`:""}${best(te)>pb?" 🏆":""}</li>`);}});
  const dur=ts.length>1?Math.round((Math.max(...ts)-Math.min(...ts))/60000)+5:null;
  openSheet(`<div class="shd"><h3>Séance terminée, bravo !</h3><button class="close" id="sx" aria-label="Fermer">✕</button></div>
    <div class="stats"><div class="stat"><small>Durée</small><b>${dur?dur:"—"}<i> min</i></b></div><div class="stat"><small>Séries</small><b>${sets}</b></div><div class="stat"><small>Volume</small><b>${Math.round(vol)}<i> kg</i></b></div></div>
    ${lines.length?`<h5>Par rapport à la dernière fois</h5><ul>${lines.join("")}</ul>`:""}
    <h5>Maintenant</h5><p>Un repas avec 30 à 40 g de protéines dans les 2 heures : 2 skyrs et une banane, ou 500 ml de lait avec 60 g de flocons d'avoine et un skyr, ou un vrai repas viande ou œufs avec des féculents.</p>
    <button class="btn wide" id="sok" style="margin-top:16px">Fermer</button>`,()=>{$("sx").onclick=closeSheet;$("sok").onclick=closeSheet;});
}

function sparkline(pts,unit="kg",h=64){
  if(pts.length<3)return"";
  const Wd=300,pd=6,vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=mx-mn||1;
  const X=i=>pd+i*(Wd-2*pd)/(pts.length-1),Y=v=>h-pd-((v-mn)/sp)*(h-2*pd-14);
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(""),l=pts.length-1;
  return `<div class="spark"><svg viewBox="0 0 ${Wd} ${h}" preserveAspectRatio="none" role="img" aria-label="Évolution de ${fmt(pts[0].v)} à ${fmt(pts[l].v)} ${unit}">
   <path d="${d}L${X(l)} ${h}L${X(0)} ${h}Z" fill="var(--go)" opacity=".12"/>
   <path d="${d}" fill="none" stroke="var(--go)" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
   <circle cx="${X(l)}" cy="${Y(pts[l].v)}" r="3.5" fill="var(--go)"/>
   <text x="${Wd-pd}" y="12" text-anchor="end" font-size="11" fill="var(--ink-3)">max ${fmt(mx)} ${unit}</text>
   <text x="${pd}" y="12" font-size="11" fill="var(--ink-3)">${fmt(pts[0].v)} ${unit}</text></svg></div>`;
}

    <p class="small" style="color:var(--ink-2)">Exporte un fichier avec tes charges, ton poids et tes réglages. Tu peux le réimporter sur un autre appareil (par exemple de Claude vers l'app installée sur ton iPhone). Les photos restent sur le téléphone.</p>

      <label class="btn line" style="display:inline-flex;align-items:center">Importer<input type="file" accept="application/json,.json" id="imp" style="display:none"></label></div>
  </div>`;
  view.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>histSheet(b.dataset.u));
  view.querySelectorAll("[data-delbw]").forEach(b=>b.onclick=()=>{const d=b.dataset.delbw,old=store.bw.find(x=>x.d===d);
    store.bw=store.bw.filter(x=>x.d!==d);persist();render(true);toast("Relevé supprimé","Rétablir",()=>{store.bw.push(old);store.bw.sort((a,c)=>a.d<c.d?-1:1);persist();render(true);});});
  $("bwsave").onclick=()=>{const v=num($("bwin").value);if(!v||v<30||v>250)return toast("Entre un poids valide (ex. 70,4)");
    store.bw=store.bw.filter(b=>b.d!==t);store.bw.push({d:t,kg:v});store.bw.sort((a,b)=>a.d<b.d?-1:1);persist();render(true);toast("Poids enregistré");};
  $("msave").onclick=()=>{const m={d:t};let any=false;["bras","epaules","poitrine","taille"].forEach(k=>{const v=num($("m-"+k).value);if(v&&v>10&&v<250){m[k]=v;any=true;}});
    if(!any)return toast("Entre au moins une mesure");store.meas=store.meas.filter(x=>x.d!==t);store.meas.push(m);persist();render(true);toast("Mensurations enregistrées");};
  $("exp").onclick=async()=>{const data=JSON.stringify(store,null,1),filename=`muscu-sauvegarde-${t}.json`;
    let dl=null;try{if(typeof claude!=="undefined"&&claude.use)dl=await claude.use("downloads");}catch(e){}
    if(dl){try{await dl.save({filename,data});}catch(e){}return;}
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=filename;document.body.appendChild(a);a.click();a.remove();};
  $("imp").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const s=JSON.parse(await f.text());if(!s.log)throw 0;
    openSheet(`<div class="shd"><h3>Importer cette sauvegarde ?</h3></div><p>Tes données actuelles sur cet appareil seront remplacées.</p>
      <div style="display:grid;gap:8px;margin-top:16px"><button class="btn wide" id="iy">Importer</button><button class="btn line wide" id="in">Annuler</button></div>`,
      ()=>{$("in").onclick=closeSheet;$("iy").onclick=()=>{store=migrate(s);persist();closeSheet();render();toast("Sauvegarde importée");};});}catch(e){toast("Fichier invalide");}};
}
function histSheet(u){
  const e=EXO[u]||{nom:u,unit:"pile"},h=H(u).filter(x=>W(x).length);
  openSheet(`<div class="shd"><h3>${esc(e.nom)}</h3><button class="close" id="sx" aria-label="Fermer">✕</button></div>
    ${sparkline(h.map(x=>({v:best(x)})))}
    <p class="small muted" style="margin:8px 0">Record : <b style="color:var(--ink)">${fmt(Math.max(...h.map(best)))} kg</b>${store.notes[u]?` · Réglages : ${esc(store.notes[u])}`:""}</p>
    <div class="list">${h.slice().reverse().map(x=>`<div class="li" style="min-height:48px;padding:8px 0"><span class="day">${fr(x.d)}</span><span class="w"><b class="num" style="white-space:normal">${W(x).map(s=>`${fmt(s.kg)}×${s.reps}`).join(" · ")}</b>${x.feel?`<small>${{facile:"Facile",dur:"Dur",echec:"À l'échec"}[x.feel]}</small>`:""}</span></div>`).join("")}</div>`,
    ()=>{$("sx").onclick=closeSheet;});
}

/* ===================== GUIDE ===================== */
function vGuide(){
  $("ttl").textContent="Guide";
  view.innerHTML=`
  <div class="big-title">Guide</div>
  <p class="lead">Tout ce qu'il faut savoir, expliqué simplement.</p>
  <h3>Le vocabulaire</h3>
  <div class="panel"><ul class="clean">
    <li><b>Répétition (rep) :</b> un mouvement complet, aller et retour.</li>
    <li><b>Série :</b> un bloc de répétitions enchaînées, suivi d'un repos.</li>
    <li><b>3 × 8-12 :</b> 3 séries, de 8 à 12 répétitions chacune.</li>
    <li><b>« 1 à 2 reps en réserve » :</b> tu t'arrêtes quand tu pourrais encore en faire 1 ou 2, pas à l'épuisement total.</li>
    <li><b>Série d'échauffement (É) :</b> une série légère pour préparer le mouvement. Elle ne compte pas dans tes progrès.</li>
    <li><b>Machine à disques :</b> tu charges toi-même des disques. Note le <b>total des disques</b> (gauche + droite), sans le poids de la machine.</li>
    <li><b>Poulie :</b> câble avec une poignée, réglable en hauteur.</li>
    <li><b>Barre guidée (Smith) :</b> barre qui coulisse sur deux rails, plus sûre seul.</li>
  </ul></div>
  <h3>Déroulé d'une séance</h3>
  <div class="panel"><ol class="clean">
    <li><b>Échauffement :</b> 5 min de vélo, puis les 2 séries É proposées par l'app sur les premiers exercices (la moitié de ta charge × 10, puis les trois quarts × 5).</li>
    <li><b>Respecte l'ordre :</b> du plus lourd au plus léger, tu es le plus frais au début.</li>
    <li><b>Valide chaque série :</b> le chrono de repos se lance tout seul. À la fin, il devient vert et compte le temps en plus.</li>
    <li><b>Dis comment c'était</b> après la dernière série (Facile, Dur, À l'échec) : l'app s'en sert pour savoir quand monter.</li>
  </ol></div>
  <h3>Comment l'app te fait progresser</h3>
  <div class="panel"><ol class="clean">
    <li>Chaque exercice a une fourchette, par exemple 8-12.</li>
    <li>Tant que tu n'es pas en haut de la fourchette partout, l'app te propose <b>la même charge avec une répétition de plus par série</b>.</li>
    <li>Quand tu fais le haut de la fourchette sur toutes les séries : <b>elle monte la charge</b> d'une marche (2,5 kg en général, 5 kg à la presse et au leg curl) et tu repars du bas de la fourchette.</li>
    <li>Si tu tombes sous la fourchette deux séances de suite : <b>elle redescend d'une marche</b>.</li>
    <li>Toutes les 6 semaines : <b>une semaine légère</b> (moitié des séries) pour récupérer, puis un nouveau cycle.</li>
  </ol>
  <p class="note">Sur une machine où la plus petite marche est trop grosse, fais d'abord 1 ou 2 répétitions de plus que la fourchette avant de monter.</p></div>
  <h3>Pourquoi ce programme</h3>
  <div class="panel"><ul class="clean">
    <li><b>Dos et épaules reçoivent le plus de séries</b> (environ 14 séries de dos par semaine) : ce sont tes points faibles. Les pecs, ton point fort, sont entretenus avec moins de séries.</li>
    <li><b>Presque deux fois plus de tirage que de poussée</b> pour ouvrir les épaules enroulées vers l'avant.</li>
    <li><b>Au moins 48 h</b> entre deux séances qui travaillent les mêmes muscles : c'est pendant le repos que le muscle se construit. C'est pour ça que le Bonus se fait le dimanche.</li>
    <li><b>Jambes et abdos ensemble :</b> c'est bien. Les abdos sont à la fin, quand la presse est finie, et ils récupèrent vite.</li>
    <li><b>Ce qui a changé :</b> le rowing remplace la barre guidée en A (plus de dos), l'extension triceps au-dessus de la tête passe en A (elle fait plus grossir le triceps), le Bonus passe au dimanche, les repos des gros exercices sont plus longs.</li>
  </ul></div>
  <h3>Nutrition et récupération</h3>
  <div class="panel">
    <div class="macro">
      <div><small>Protéines</small><b>125-140 g</b><span>par jour, en 3-4 repas</span></div>
      <div><small>Calories</small><b>2 500-2 600</b><span>kcal, point de départ</span></div>
      <div><small>Sommeil</small><b>7 à 9 h</b><span>par nuit</span></div>
      <div><small>Créatine</small><b>3 à 5 g</b><span>monohydrate, chaque jour</span></div>
    </div>
    <p class="note"><b>Les calories :</b> 2 500-2 600 kcal est une estimation. Regarde ta moyenne de poids sur 2 semaines : si elle monte encore, enlève 150 kcal ; si elle baisse, ajoute 150 kcal.</p>
    <p class="note"><b>Les protéines en pratique :</b> 150 g de blanc de poulet (pesé cru) ≈ 35 g · 3 œufs ≈ 20 g · un pot de skyr de 150 g ≈ 15 g · 100 g de thon ≈ 25 g · 500 ml de lait ≈ 17 g.</p>
    <p class="note"><b>Créatine :</b> 3 à 5 g par jour, n'importe quand, même les jours de repos. Pas besoin de « phase de charge ». Elle peut faire prendre 0,5 à 1 kg d'eau au début : c'est normal.</p>
  </div>
  <h3>Photos de suivi</h3>
  <div class="panel"><ul class="clean">
    <li>Une fois par mois, le matin, à jeun.</li>
    <li>Même lumière, même endroit, même distance.</li>
    <li>Mêmes poses : face, profil, dos, bras relâchés.</li>
    <li>Compare tous les 2-3 mois : le miroir trompe, les photos non.</li>
  </ul></div>
  <h3>Les erreurs classiques</h3>
  <div class="panel"><ul class="clean">
    <li>Mettre trop lourd et faire des demi-mouvements avec de l'élan.</li>
    <li>Aller à l'échec sur chaque série : beaucoup de fatigue pour peu de gain.</li>
    <li>Changer de programme toutes les semaines.</li>
    <li>Dormir 5 h et se demander pourquoi rien ne bouge.</li>
  </ul></div>
  <h3>L'app sur ton iPhone</h3>
  <div class="panel"><ol class="clean">
    <li>Ouvre le lien de l'app dans <b>Safari</b>.</li>
    <li>Touche le bouton <b>Partager</b> (le carré avec une flèche vers le haut).</li>
    <li>Choisis <b>« Sur l'écran d'accueil »</b>, puis « Ajouter ».</li>
  </ol><p class="note">L'icône apparaît comme une vraie app, s'ouvre en plein écran et marche sans réseau à la salle. Pour récupérer tes données d'ici, utilise Exporter puis Importer (onglet Progrès).</p></div>
  <h3>Les images</h3>
  <div class="panel"><p>Les photos viennent de ta salle. Pour les exercices sans photo, le dessin montre la position et le sens du mouvement (flèche rouge). Touche l'image d'un exercice, puis « Prendre la machine en photo » : ta photo remplace le dessin, pour toutes les séances qui utilisent cette machine.</p></div>`;
}

/* ===================== CHRONO ===================== */
let ti=null,tEnd=0,tTot=0,tEx=null,wake=null,actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [0,.22,.44].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=t>.4?1320:880;
    g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.35,actx.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.18);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2);});}catch(e){}}
async function lockWake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});}}catch(e){}}
function startRest(s,label,e){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(err){}
  clearInterval(ti);tTot=s;tEnd=Date.now()+s*1000;tEx=e||null;$("tlabel").textContent=label||"Repos";
  const tm=$("timer");tm.classList.remove("hidden","end");tm.dataset.rang="";tick();ti=setInterval(tick,250);}
function stopRest(){clearInterval(ti);$("timer").classList.add("hidden");$("timer").classList.remove("end");}
function tick(){const ms=tEnd-Date.now(),l=Math.ceil(ms/1000),tm=$("timer");
  if(l>0){$("tdisp").textContent=clock(l);$("tring").style.strokeDashoffset=138.2*(1-l/tTot);return;}
  if(!tm.classList.contains("end")){tm.classList.add("end");if(tm.dataset.rang!=="1"){tm.dataset.rang="1";beep();try{navigator.vibrate&&navigator.vibrate([300,120,300]);}catch(e){}}}
  $("tdisp").textContent="+"+clock(Math.floor(-ms/1000));}
$("tminus").onclick=()=>{if(Date.now()>tEnd)return;tEnd-=15000;tTot=Math.max(tTot-15,1);tick();};
$("tplus").onclick=()=>{if(Date.now()>tEnd){startRest(15,$("tlabel").textContent,tEx);return;}tEnd+=15000;tTot+=15;tick();};
$("tstop").onclick=stopRest;
$("tbox").onclick=()=>{const e=tEx,cur=e?restFor(e):tTot;
  openSheet(`<div class="shd"><h3>Durée du repos</h3><button class="close" id="sx" aria-label="Fermer">✕</button></div>
    ${e?`<p class="small" style="margin-bottom:12px">Pour <b>${esc(e.nom)}</b>. Conseillé : ${mmss(e.rest)}. Ton choix sera retenu pour cet exercice.</p>`:""}
    <div class="presets">${[60,75,90,120,150,180].map(s=>`<button data-r="${s}" class="${s===cur?"on":""}">${clock(s)}</button>`).join("")}</div>
    ${e&&store.rest[e.uid]?`<button class="btn line wide" id="rreset" style="margin-top:12px">Revenir au conseil (${mmss(e.rest)})</button>`:""}`,
  ()=>{$("sx").onclick=closeSheet;
    $("sheet").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const s=+b.dataset.r;if(e){if(s===e.rest)delete store.rest[e.uid];else store.rest[e.uid]=s;persist();}
      const done=tTot-Math.max(0,Math.ceil((tEnd-Date.now())/1000));tTot=s;tEnd=Date.now()+Math.max(1,s-done)*1000;$("timer").classList.remove("end");$("timer").dataset.rang="";clearInterval(ti);ti=setInterval(tick,250);tick();closeSheet();if(tab==="today")render(true);});
    const rr=$("rreset");if(rr)rr.onclick=()=>{delete store.rest[e.uid];persist();closeSheet();if(tab==="today")render(true);};});};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(!$("timer").classList.contains("hidden")){lockWake();tick();}}});

/* ===================== THÈME ===================== */
const TH=["auto","light","dark"],THI={auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'};
let theme="auto";
function applyTheme(){const r=document.documentElement;if(theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",theme);
  $("themeBtn").innerHTML=THI[theme];$("themeBtn").setAttribute("aria-label",{auto:"Thème automatique",light:"Thème clair",dark:"Thème sombre"}[theme]);
  const dark=theme==="dark"||(theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{m.setAttribute("content",dark?"#111113":"#f7f6f3");});}
$("themeBtn").onclick=()=>{theme=TH[(TH.indexOf(theme)+1)%3];try{localStorage.setItem(KEY+"-theme",theme);}catch(e){}applyTheme();toast({auto:"Thème automatique",light:"Thème clair",dark:"Thème sombre"}[theme]);};

document.querySelectorAll("#tabbar button").forEach(b=>b.onclick=()=>{if(b.dataset.tab===tab){window.scrollTo({top:0,behavior:"smooth"});return;}if(b.dataset.tab==="today")sess=defaultSession();go(b.dataset.tab);});
$("bwchip").onclick=()=>{go("prog");setTimeout(()=>{const i=$("bwin");if(i)i.focus();},50);};
window.addEventListener("scroll",()=>$("top").classList.toggle("scrolled",window.scrollY>4),{passive:true});
try{theme=localStorage.getItem(KEY+"-theme")||"auto";}catch(e){}
applyTheme();loadLocal();sess=defaultSession();render();
openIDB().then(idbAll).then(()=>{if(Object.keys(PH).length)render(true);});
initCloud();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!inFrame){navigator.serviceWorker.register("sw.js").catch(()=>{});}
