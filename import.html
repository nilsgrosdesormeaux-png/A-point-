      var TEXTES = {
        ventes: {
          titre: "Importer mon historique de ventes",
          explication: "Dépose un fichier CSV ou Excel (.csv, .xlsx, .xls) contenant tes ventes : une colonne pour la date, une pour le produit, une pour la quantité vendue. Peu importe l'ordre ou le nom exact des colonnes : on essaie de les reconnaître automatiquement, et tu pourras vérifier avant d'importer.",

        fiches: {

          explication: "Dépose un fichier CSV ou Excel listant les ingrédients de tes recettes : une ligne par ingrédient, avec le nom du produit (le plat), le nom de l'ingrédient, la quantité utilisée pour une unité vendue, et si besoin l'unité (g, kg, ml...). Un produit qui n'existe pas encore dans Mes produits est créé automatiquement.",
          labelProduit: "Colonne pour le produit (le plat)",
          labelQuantite: "Colonne pour la quantité (par unité vendue)",
          boutonImporter: "Importer ces fiches techniques"
        }
      };

      // Noms de colonnes fréquemment utilisés par les caisses/tableurs, pour reconnaissance automatique
      var aliasesDate = ['date', 'jour', 'datedevente', 'date_vente', 'datevente', 'dateventre'];
      var aliasesProduit = ['produit', 'plat', 'article', 'nomduproduit', 'nom_produit', 'produitvendu', 'item', 'designation', 'nomarticle', 'libelle'];
      var aliasesQuantite = ['quantite', 'qte', 'nombre', 'nombrevendu', 'quantitevendue', 'qty', 'nbvendu', 'ventes', 'quantitevendu', 'vendu', 'vendus', 'vendue'];
      var aliasesIngredient = ['ingredient', 'ingredients', 'composant', 'matierepremiere', 'ingredientutilise'];
      var aliasesUnite = ['unite', 'unites', 'uom', 'mesure'];

      function normaliserTexte(texte) {
        return (texte === null || texte === undefined ? '' : texte.toString())
          .toLowerCase()
          .normalize('NFD').replace(/[̀-ͯ]/g, '')
          .replace(/[^a-z0-9]/g, '');
      }

      function detecterColonne(entetes, aliases) {
        for (var i = 0; i < entetes.length; i++) {
          if (aliases.indexOf(normaliserTexte(entetes[i])) !== -1) return entetes[i];
        }
        for (var j = 0; j < entetes.length; j++) {
          var norm = normaliserTexte(entetes[j]);
          for (var k = 0; k < aliases.length; k++) {
            if (norm.indexOf(aliases[k]) !== -1) return entetes[j];
          }
        }
        return '';
      }

      // --- Détection intelligente par contenu ---------------------------
      // Le nom d'une colonne peut mentir (un intitulé "Article" qui contient
      // en réalité une catégorie, un "Jour" qui contient le jour de semaine
      // et pas une date...). En plus de l'alias sur le nom, on regarde donc
      // aussi ce qu'il y a VRAIMENT dans la colonne, pour détecter — et
      // signaler clairement — un mauvais choix avant même que le
      // commerçant clique sur Continuer.

      var produitsExistantsNormalises = {}; // clé normalisée -> nom canonique déjà en base
      var produitsExistantsPromise = null;

      function cleNormaliseeProduit(nom) {
        return (nom === null || nom === undefined ? '' : nom.toString())
          .trim().toLowerCase()
          .normalize('NFD').replace(/[̀-ͯ]/g, '');
      }

      function chargerProduitsExistants() {
        if (!produitsExistantsPromise) {
          produitsExistantsPromise = sbClient.from('produits').select('nom').eq('commercant_id', commercantId)
            .then(function (res) {
              (res.data || []).forEach(function (p) { produitsExistantsNormalises[cleNormaliseeProduit(p.nom)] = p.nom; });
              return produitsExistantsNormalises;
            })
            .catch(function () { return produitsExistantsNormalises; });
        }
        return produitsExistantsPromise;
      }

      function echantillonnerColonne(lignes, colonne, max) {
        var valeurs = [];
        for (var i = 0; i < lignes.length && valeurs.length < max; i++) {
          var v = lignes[i][colonne];
          if (v !== undefined && v !== null && v.toString().trim() !== '') valeurs.push(v);
        }
        return valeurs;
      }

      function scoreColonneDate(valeurs) {
        if (valeurs.length === 0) return 0;
        var ok = 0;
        valeurs.forEach(function (v) { if (parserDate(v)) ok++; });
        return ok / valeurs.length;
      }

      // Vérifie qu'une valeur RESSEMBLE vraiment à un nombre (pour noter une
      // colonne), sans la tolérance de parserQuantite (qui, lui, nettoie les
      // caractères parasites pour extraire un nombre au moment de l'import
      // réel). Cette tolérance est très utile pour importer des valeurs un
      // peu sales, mais rend n'importe quelle colonne texte "compatible
      // quantité" par accident (ex : une date "2026-07-01" ou "9 septembre
      // 2026" finit, une fois les caractères non numériques retirés, par
      // ressembler à un nombre). Pour noter une colonne, on veut donc que la
      // valeur SOIT un nombre de bout en bout, pas qu'elle en contienne un.
      function ressembleANombre(valeur) {
        if (typeof valeur === 'number') return isFinite(valeur);
        var texte = (valeur === null || valeur === undefined ? '' : valeur.toString()).trim();
        if (!texte) return false;
        return /^-?\d+([.,]\d+)?$/.test(texte);
      }

      function scoreColonneQuantite(valeurs, entete) {
        if (valeurs.length === 0) return 0;
        var ok = 0;
        valeurs.forEach(function (v) { if (ressembleANombre(v)) ok++; });
        var score = ok / valeurs.length;

        var normEntete = normaliserTexte(entete);
        // Faux-ami classique : un intitulé qui évoque un stock restant
        // plutôt qu'une quantité vendue.
        if (normEntete.indexOf('stock') !== -1 || normEntete.indexOf('restant') !== -1 || normEntete.indexOf('disponible') !== -1) {
          score *= 0.3;
        }

        // Une colonne aux valeurs presque toutes différentes ET croissantes
        // ressemble à un identifiant (n° de ticket, de ligne...), pas à une
        // quantité vendue qui se répète naturellement d'un jour à l'autre.
        var nombres = valeurs.map(parserQuantite).filter(function (n) { return !isNaN(n); });
        if (nombres.length >= 5) {
          var distincts = {};
          nombres.forEach(function (n) { distincts[n] = true; });
          var tauxDistinct = Object.keys(distincts).length / nombres.length;
          var croissants = 0;
          for (var i = 1; i < nombres.length; i++) { if (nombres[i] > nombres[i - 1]) croissants++; }
          var tauxCroissant = croissants / (nombres.length - 1);
          if (tauxDistinct > 0.9 && tauxCroissant > 0.85) score *= 0.2;
        }
        return score;
      }

      function scoreColonneProduit(valeurs, entete) {
        var texteVals = valeurs.map(texteCellule).filter(function (t) { return t; });
        if (texteVals.length === 0) return 0;
        var normEntete = normaliserTexte(entete);
        var ressembleCategorie = normEntete.indexOf('categorie') !== -1 || normEntete.indexOf('famille') !== -1 || normEntete.indexOf('rayon') !== -1;

        if (Object.keys(produitsExistantsNormalises).length > 0) {
          var correspond = 0;
          texteVals.forEach(function (t) { if (produitsExistantsNormalises[cleNormaliseeProduit(t)]) correspond++; });
          var score = correspond / texteVals.length;
          if (ressembleCategorie) score *= 0.5;
          return score;
        }

        // Pas encore de produits connus pour comparer : heuristique de repli,
        // volontairement plafonnée SOUS le seuil de confiance de base (donc
        // toujours affichée avec une ⚠️, jamais un ✓ plein) — une colonne de
        // texte non numérique peut tout aussi bien être une vraie colonne
        // produit qu'une catégorie de même forme ("Article" peut contenir
        // l'un ou l'autre selon le fichier), et rien dans son contenu seul
        // ne permet de trancher sans avoir de vrais produits à comparer.
        var toutesNumeriques = texteVals.every(function (t) { return !isNaN(parserQuantite(t)); });
        if (toutesNumeriques) return 0.1;
        var distincts = {};
        texteVals.forEach(function (t) { distincts[cleNormaliseeProduit(t)] = true; });
        if (Object.keys(distincts).length <= 1) return 0.3;
        return ressembleCategorie ? 0.3 : 0.45;
      }

      // Combine l'alias sur le nom de colonne et le score sur son contenu :
      // le nom ne l'emporte que si le contenu le confirme un minimum ;
      // sinon on fait confiance à la colonne dont le contenu correspond
      // vraiment, même si son intitulé n'est pas dans la liste connue.
      var SEUIL_CONFIANCE = 0.5;

      // Seuil, plus exigeant que SEUIL_CONFIANCE, à partir duquel on considère
      // l'auto-détection assez sûre pour ne RIEN demander au commerçant : pas
      // de colonnes à choisir, pas de case à vérifier. En dessous, mieux vaut
      // lui montrer ce qu'on a trouvé et lui laisser confirmer plutôt que de
      // se tromper en silence.
      var SEUIL_AUTOMATIQUE = 0.75;

      function detecterColonneParContenu(lignes, entetes, aliases, fonctionScore) {
        var candidatAlias = detecterColonne(entetes, aliases);
        var scoreParColonne = {};
        var meilleureColonne = '';
        var meilleurScore = -1;

        entetes.forEach(function (e) {
          var valeurs = echantillonnerColonne(lignes, e, 40);
          var s = fonctionScore(valeurs, e);
          scoreParColonne[e] = s;
          if (s > meilleurScore) { meilleurScore = s; meilleureColonne = e; }
        });

        var scoreAlias = candidatAlias ? (scoreParColonne[candidatAlias] || 0) : -1;
        var choix;
        if (candidatAlias && scoreAlias >= SEUIL_CONFIANCE) {
          choix = candidatAlias;
        } else if (meilleurScore >= SEUIL_CONFIANCE) {
          choix = meilleureColonne;
        } else if (candidatAlias) {
          choix = candidatAlias;
        } else {
          choix = (meilleureColonne && meilleurScore > 0) ? meilleureColonne : '';
        }
        return { colonne: choix, scores: scoreParColonne };
      }

      // Confiance "effective" d'un bilan de détection, utilisée uniquement
      // pour décider si on peut sauter complètement l'étape de vérification
      // manuelle (voir detectionVentesConfiante ci-dessous) — c'est
      // volontairement le score de CONTENU brut, sans jamais le renforcer
      // parce que le nom de la colonne correspond à un intitulé connu :
      // un en-tête "Article" peut légitimement contenir des noms de
      // produits dans un fichier, une catégorie dans un autre — seul ce
      // qu'il y a vraiment dedans permet de trancher sans risque.
      function confianceEffective(bilan) {
        if (!bilan.colonne) return 0;
        return bilan.scores[bilan.colonne] || 0;
      }

      function detectionVentesConfiante(bilanDate, bilanProduit, bilanQuantite) {
        return !!(bilanDate.colonne && bilanProduit.colonne && bilanQuantite.colonne) &&
          confianceEffective(bilanDate) >= SEUIL_AUTOMATIQUE &&
          confianceEffective(bilanProduit) >= SEUIL_AUTOMATIQUE &&
          confianceEffective(bilanQuantite) >= SEUIL_AUTOMATIQUE;
      }

      // Deux champs différents (ex: date et quantité) peuvent pointer vers la
      // même colonne par coïncidence — une date "2026-07-01" est par exemple
      // aussi lisible comme un nombre par un parseur numérique permissif. On
      // règle les conflits en donnant la colonne à la détection la plus sûre,
      // et en réaffectant les autres à leur meilleure alternative encore libre.
      function resoudreConflitsColonnes(entetes, bilans) {
        var prisPar = {};
        var ordonnes = bilans.slice().sort(function (a, b) {
          var sa = a.colonne ? (a.scores[a.colonne] || 0) : -1;
          var sb = b.colonne ? (b.scores[b.colonne] || 0) : -1;
          return sb - sa;
        });
        ordonnes.forEach(function (bilan) {
          if (!bilan.colonne) return;
          if (!prisPar[bilan.colonne]) { prisPar[bilan.colonne] = true; return; }
          var meilleureLibre = '';
          var meilleurScoreLibre = -1;
          entetes.forEach(function (e) {
            if (prisPar[e]) return;
            var s = bilan.scores[e] || 0;
            if (s > meilleurScoreLibre) { meilleurScoreLibre = s; meilleureLibre = e; }
          });
          bilan.colonne = meilleureLibre;
          if (meilleureLibre) prisPar[meilleureLibre] = true;
        });
      }

      function remplirSelect(select, entetes, valeurDetectee, avecOptionVide) {
        select.innerHTML = avecOptionVide
          ? '<option value="">-- Aucune --</option>'
          : '<option value="">-- Choisir une colonne --</option>';
        entetes.forEach(function (entete) {

          option.value = entete;
          option.textContent = entete;
          if (entete === valeurDetectee) option.selected = true;

      function afficherApercuBrut(lignes, entetes) {
        if (lignes.length === 0) { apercuBrutDiv.innerHTML = ''; return; }
        var tableau = '<table><tr>';
        entetes.forEach(function (e) { tableau += '<th>' + e + '</th>'; });
        tableau += '</tr>';
        lignes.slice(0, 3).forEach(function (ligne) {
          tableau += '<tr>';
          entetes.forEach(function (e) { tableau += '<td>' + (ligne[e] !== undefined ? ligne[e] : '') + '</td>'; });
          tableau += '</tr>';
        });
        tableau += '</table>';
        apercuBrutDiv.innerHTML = '<p style="font-size:12px; color:#777; margin-top:12px;">Aperçu de ton fichier :</p><div class="zone-scroll">' + tableau + '</div>';
      }

      // Note affichée AVANT l'import (pas seulement dans le message de succès
      // après coup) pour que la création automatique de nouveaux produits ne
      // soit jamais une surprise silencieuse.
      function noteNouveauxProduits(lignes, obtenirNom) {
        var vus = {};
        var noms = [];
        lignes.forEach(function (l) {
          var nom = obtenirNom(l);
          if (!nom) return;
          var cle = cleNormaliseeProduit(nom);
          if (!produitsExistantsNormalises[cle] && !vus[cle]) {
            vus[cle] = true;
            noms.push(nom);
          }
        });
        if (noms.length === 0) return '';
        return '<p class="note-produits-auto">ℹ️ ' + noms.length + ' nouveau(x) produit(s) seront ajoutés automatiquement dans Mes produits : ' + noms.join(', ') + '.</p>';
      }

      // Convertit une valeur de date (texte dans divers formats, ou objet Date venant d'un Excel) en AAAA-MM-JJ
      function parserDate(valeur) {
        if (valeur instanceof Date && !isNaN(valeur)) return formatDateISO(valeur);

        var texte = (valeur === null || valeur === undefined ? '' : valeur.toString()).trim();
        if (!texte) return null;

        var m = texte.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
        if (m) return formatDateISO(new Date(+m[1], +m[2] - 1, +m[3]));

        m = texte.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
        if (m) return formatDateISO(new Date(+m[3], +m[2] - 1, +m[1]));

        m = texte.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})$/);
        if (m) return formatDateISO(new Date(2000 + parseInt(m[3], 10), +m[2] - 1, +m[1]));

        // Une chaîne uniquement numérique, sans aucun séparateur, n'est une
        // date que sous la forme compacte AAAAMMJJ (8 chiffres) : on vérifie
        // que l'année/mois/jour obtenus sont bien cohérents. Sans ce garde-
        // fou, new Date("10235") ci-dessous "réussirait" à interpréter un
        // simple n° de ticket ou d'identifiant comme une date (année 10235),
        // ce qui ferait à tort gagner ce genre de colonne dans la détection.
        if (/^\d+$/.test(texte)) {
          if (texte.length === 8) {
            var annee = +texte.slice(0, 4), mois = +texte.slice(4, 6), jour = +texte.slice(6, 8);
            var dateCompacte = new Date(annee, mois - 1, jour);
            if (!isNaN(dateCompacte) && dateCompacte.getFullYear() === annee && dateCompacte.getMonth() === mois - 1 && dateCompacte.getDate() === jour) {
              return formatDateISO(dateCompacte);
            }
          }
          return null;
        }

        // Le constructeur Date natif reste bien trop permissif au-delà de
        // ce cas : new Date("1.2") ou new Date("4.5") "réussissent" par
        // exemple à produire une date bidon (il lit "1.2" comme "mois.jour"
        // dans une année par défaut) — un prix ou une remise se ferait
        // alors à tort passer pour une date valide. Les formats numériques
        // qu'on veut vraiment reconnaître sont déjà couverts ci-dessus ; on
        // ne tente ce parsing de secours, plus permissif, que si la chaîne
        // contient au moins une lettre (un nom de mois écrit en toutes
        // lettres : "septembre 2026", "September 9, 2026"...).
        if (!/[a-zA-Z]/.test(texte)) return null;

        var parsed = new Date(texte);
        if (!isNaN(parsed)) return formatDateISO(parsed);

        return null;
      }

      function formatDateISO(date) {
        var y = date.getFullYear();
        var mo = ('0' + (date.getMonth() + 1)).slice(-2);
        var d = ('0' + date.getDate()).slice(-2);
        return y + '-' + mo + '-' + d;
      }

      // Convertit une valeur de quantité (nombre, ou texte avec virgule/espaces) en nombre entier (ventes)
      function parserQuantite(valeur) {
        if (typeof valeur === 'number') return Math.round(valeur);
        var texte = (valeur === null || valeur === undefined ? '' : valeur.toString()).trim();
        if (!texte) return NaN;
        texte = texte.replace(/\s/g, '').replace(',', '.').replace(/[^0-9.\-]/g, '');
        var nombre = parseFloat(texte);
        return isNaN(nombre) ? NaN : Math.round(nombre);
      }

      // Convertit une valeur de quantité en nombre décimal, sans arrondi (fiches techniques :
      // 0.5 kg de beurre ne doit pas être arrondi à 1)
      function parserQuantiteDecimale(valeur) {
        if (typeof valeur === 'number') return valeur;
        var texte = (valeur === null || valeur === undefined ? '' : valeur.toString()).trim();
        if (!texte) return NaN;
        texte = texte.replace(/\s/g, '').replace(',', '.').replace(/[^0-9.\-]/g, '');
        var nombre = parseFloat(texte);
        return isNaN(nombre) ? NaN : nombre;
      }

      function texteCellule(valeur) {
        return (valeur === null || valeur === undefined ? '' : valeur.toString()).trim();
      }

      function reinitialiserApresChangementFichierOuMode() {
        lignesBrutes = [];
        entetesDisponibles = [];
        lignesAImporter = [];
        lignesFichesAImporter = [];
        zoneMapping.style.display = 'none';
        resumeAutoDiv.style.display = 'none';
        texteResumeAutoEl.textContent = '';
        apercuBrutDiv.innerHTML = '';
        apercuDiv.innerHTML = '';
        btnImporter.style.display = 'none';
        btnImporter.disabled = false;
        messageDiv.style.display = 'none';
        fichierInput.value = '';
      }

      function definirMode(nouveauMode) {
        modeImport = nouveauMode;
        var t = TEXTES[modeImport];

        titreImportEl.textContent = t.titre;
        texteExplicationEl.textContent = t.explication;
        labelProduit.textContent = t.labelProduit;
        labelQuantite.textContent = t.labelQuantite;
        btnImporter.textContent = t.boutonImporter;

        ongletVentes.classList.toggle('actif', modeImport === 'ventes');
        ongletFiches.classList.toggle('actif', modeImport === 'fiches');

        champDate.style.display = modeImport === 'ventes' ? 'block' : 'none';
        champIngredient.style.display = modeImport === 'fiches' ? 'block' : 'none';
        champUnite.style.display = modeImport === 'fiches' ? 'block' : 'none';
        detailProduit.style.display = modeImport === 'ventes' ? 'block' : 'none';
        detailQuantite.style.display = modeImport === 'ventes' ? 'block' : 'none';
        banniereVerification.innerHTML = '';

        reinitialiserApresChangementFichierOuMode();
      }

      // Dernier bilan de détection calculé (colonne -> score 0..1), gardé de
      // côté pour pouvoir donner un message d'erreur précis si l'import
      // final échoue, et pour rafraîchir le retour visuel quand l'utilisateur
      // change une sélection à la main.
      var dernieresValeursParColonne = {};
      var dernierBilan = { date: null, produit: null, quantite: null };

      function recevoirDonnees(lignes, entetes) {
        lignesBrutes = lignes;
        entetesDisponibles = entetes;
        // On attend d'avoir la liste des produits déjà connus (utile pour
        // reconnaître la bonne colonne "produit" par son contenu) avant de
        // lancer la détection — l'appel est quasi immédiat en pratique.
        chargerProduitsExistants().then(function () {
          afficherMappingEtApercu(lignes, entetes);
        });
      }

      function afficherMappingEtApercu(lignes, entetes) {
        dernieresValeursParColonne = {};
        entetes.forEach(function (e) { dernieresValeursParColonne[e] = echantillonnerColonne(lignes, e, 40); });

        apercuDiv.innerHTML = '';
        btnImporter.style.display = 'none';
        apercuBrutDiv.innerHTML = '';
        resumeAutoDiv.style.display = 'none';
        zoneMapping.style.display = 'none';

        var confiant;
        if (modeImport === 'ventes') {
          var bilanDate = detecterColonneParContenu(lignes, entetes, aliasesDate, scoreColonneDate);
          var bilanProduit = detecterColonneParContenu(lignes, entetes, aliasesProduit, scoreColonneProduit);
          var bilanQuantite = detecterColonneParContenu(lignes, entetes, aliasesQuantite, scoreColonneQuantite);
          resoudreConflitsColonnes(entetes, [bilanDate, bilanProduit, bilanQuantite]);
          dernierBilan = { date: bilanDate, produit: bilanProduit, quantite: bilanQuantite };

          remplirSelect(selectDate, entetes, bilanDate.colonne, false);
          remplirSelect(selectProduit, entetes, bilanProduit.colonne, false);
          remplirSelect(selectQuantite, entetes, bilanQuantite.colonne, false);
          rafraichirRetourVisuel();

          confiant = detectionVentesConfiante(bilanDate, bilanProduit, bilanQuantite);
        } else {
          var colProduitFiches = detecterColonne(entetes, aliasesProduit);
          var colIngredientFiches = detecterColonne(entetes, aliasesIngredient);
          var colQuantiteFiches = detecterColonne(entetes, aliasesQuantite);
          var colUniteFiches = detecterColonne(entetes, aliasesUnite);
          remplirSelect(selectProduit, entetes, colProduitFiches, false);
          remplirSelect(selectIngredient, entetes, colIngredientFiches, false);
          remplirSelect(selectQuantite, entetes, colQuantiteFiches, false);
          remplirSelect(selectUnite, entetes, colUniteFiches, true);

          confiant = !!(colProduitFiches && colIngredientFiches && colQuantiteFiches);
        }

        // Détection assez sûre : on ne montre RIEN de la mécanique interne
        // (pas de colonnes à choisir, pas de fichier brut affiché) — juste
        // le résultat déjà interprété, prêt à importer, avec une porte de
        // sortie discrète en cas d'erreur. Sinon, on montre honnêtement ce
        // qu'on a trouvé et on demande une vérification rapide.
        if (confiant) {
          resumeAutoDiv.style.display = 'block';
          texteResumeAutoEl.textContent = '✓ Fichier reconnu automatiquement.';
          if (modeImport === 'ventes') validerMappingVentes(); else validerMappingFiches();
        } else {
          texteVerificationEl.textContent = "On n'a pas pu identifier toutes les colonnes automatiquement avec certitude. Vérifie qu'elles sont correctes avant de continuer :";
          afficherApercuBrut(lignes, entetes);
          zoneMapping.style.display = 'block';
        }
      }

      // Porte de sortie : même quand la détection automatique est confiante,
      // on garde un moyen simple de repasser en revue/correction manuelle —
      // au cas (rare) où elle se tromperait malgré tout.
      btnCorrigerManuellement.addEventListener('click', function () {
        texteVerificationEl.textContent = 'Colonnes détectées automatiquement, modifie-les si besoin, puis continue :';
        resumeAutoDiv.style.display = 'none';
        afficherApercuBrut(lignesBrutes, entetesDisponibles);
        zoneMapping.style.display = 'block';
      });

      // --- Retour visuel immédiat sous chaque colonne (mode ventes) -----
      function exempleValeur(colonne) {
        var vals = dernieresValeursParColonne[colonne] || [];
        return vals.length ? texteCellule(vals[0]) : '';
      }

      function afficherDetailColonne(el, colonne, score, libelleType) {
        if (!colonne) { el.textContent = ''; el.className = 'detail-colonne'; return; }
        var pct = Math.round(score * 100);
        if (score >= SEUIL_CONFIANCE) {
          el.className = 'detail-colonne ok';
          el.textContent = '✓ ' + pct + '% des valeurs ressemblent à ' + libelleType + ' (ex. « ' + exempleValeur(colonne) + ' »).';
        } else {
          el.className = 'detail-colonne attention';
          el.textContent = '⚠️ Cette colonne ne ressemble pas vraiment à ' + libelleType + ' (ex. « ' + exempleValeur(colonne) + ' »). Vérifie que c\'est la bonne.';
        }
      }

      function rafraichirRetourVisuel() {
        if (modeImport !== 'ventes') return;
        var colDate = selectDate.value;
        var colProduit = selectProduit.value;
        var colQuantite = selectQuantite.value;

        var scoreDate = colDate ? scoreColonneDate(dernieresValeursParColonne[colDate] || []) : 0;
        var scoreProduit = colProduit ? scoreColonneProduit(dernieresValeursParColonne[colProduit] || [], colProduit) : 0;
        var scoreQuantite = colQuantite ? scoreColonneQuantite(dernieresValeursParColonne[colQuantite] || [], colQuantite) : 0;

        afficherDetailColonne(detailDate, colDate, scoreDate, 'des dates');
        afficherDetailColonne(detailProduit, colProduit, scoreProduit, 'des noms de produits' + (Object.keys(produitsExistantsNormalises).length ? ' que tu as déjà' : ''));
        afficherDetailColonne(detailQuantite, colQuantite, scoreQuantite, 'des quantités vendues');

        var toutBon = colDate && colProduit && colQuantite && scoreDate >= SEUIL_CONFIANCE && scoreProduit >= SEUIL_CONFIANCE && scoreQuantite >= SEUIL_CONFIANCE;
        var auMoinsUnProbleme = (colDate && scoreDate < SEUIL_CONFIANCE) || (colProduit && scoreProduit < SEUIL_CONFIANCE) || (colQuantite && scoreQuantite < SEUIL_CONFIANCE);

        if (toutBon) {
          banniereVerification.innerHTML = '<div class="banniere-verification ok">✓ Tout semble correct, tu peux continuer.</div>';
        } else if (auMoinsUnProbleme) {
          banniereVerification.innerHTML = '<div class="banniere-verification attention">⚠️ Au moins une colonne ci-dessous ne correspond probablement pas. Regarde les détails avant de continuer.</div>';
        } else {
          banniereVerification.innerHTML = '';
        }
      }

      selectDate.addEventListener('change', rafraichirRetourVisuel);
      selectProduit.addEventListener('change', rafraichirRetourVisuel);
      selectQuantite.addEventListener('change', rafraichirRetourVisuel);

      sbClient.auth.getSession().then(function (result) {
        var session = result.data.session;
        if (session) {
          commercantId = session.user.id;
          statutDiv.textContent = "Connecté en tant que : " + session.user.email;
          zoneFormulaire.style.display = 'block';
          definirMode('ventes');
        } else {
          statutDiv.textContent = "Tu n'es pas connecté. Va d'abord sur la page de connexion.";
        }
      }).catch(function (erreur) {
        statutDiv.textContent = "Erreur de connexion : " + erreur.message;
      });

      ongletVentes.addEventListener('click', function () { definirMode('ventes'); });
      ongletFiches.addEventListener('click', function () { definirMode('fiches'); });

      fichierInput.addEventListener('change', function (e) {
        var fichier = e.target.files[0];
        if (!fichier) return;

        messageDiv.style.display = 'none';
        var nomFichier = fichier.name.toLowerCase();

        if (nomFichier.endsWith('.csv')) {
          Papa.parse(fichier, {
            header: true,
            skipEmptyLines: true,
            delimiter: '',
            complete: function (resultat) {
              recevoirDonnees(resultat.data, resultat.meta.fields || []);
            }
          });
        } else if (nomFichier.endsWith('.xlsx') || nomFichier.endsWith('.xls')) {
          var lecteur = new FileReader();
          lecteur.onload = function (evenement) {
            var donnees = new Uint8Array(evenement.target.result);
            var classeur = XLSX.read(donnees, { type: 'array', cellDates: true });
            var premiereFeuille = classeur.Sheets[classeur.SheetNames[0]];
            var lignes = XLSX.utils.sheet_to_json(premiereFeuille, { defval: '' });
            var entetes = lignes.length > 0 ? Object.keys(lignes[0]) : [];
            recevoirDonnees(lignes, entetes);
          };
          lecteur.readAsArrayBuffer(fichier);
        } else {
          messageDiv.style.display = 'block';
          messageDiv.className = 'erreur';
          messageDiv.textContent = "Format non reconnu. Utilise un fichier .csv, .xlsx ou .xls.";
        }
      });

      // Pointe la colonne la plus probablement fautive, avec un exemple
      // concret, plutôt qu'un simple "vérifie ta sélection" qui oblige à
      // deviner laquelle des trois colonnes ne va pas.
      function messageAucuneLigneValide(colDate, colProduit, colQuantite) {
        var candidats = [
          { colonne: colDate, score: scoreColonneDate(dernieresValeursParColonne[colDate] || []), libelle: 'la date', typeAttendu: 'des dates (ex. 15/03/2026)' },
          { colonne: colProduit, score: scoreColonneProduit(dernieresValeursParColonne[colProduit] || [], colProduit), libelle: 'le produit', typeAttendu: 'des noms de produits' },
          { colonne: colQuantite, score: scoreColonneQuantite(dernieresValeursParColonne[colQuantite] || [], colQuantite), libelle: 'la quantité vendue', typeAttendu: 'des nombres' }
        ];
        candidats.sort(function (a, b) { return a.score - b.score; });
        var pire = candidats[0];

        if (pire.score < SEUIL_CONFIANCE) {
          var exemple = exempleValeur(pire.colonne);
          return "Aucune ligne valide trouvée. La colonne choisie pour " + pire.libelle + " (« " + pire.colonne + " ») ne contient pas " + pire.typeAttendu + (exemple ? " (exemple trouvé : « " + exemple + " »)" : "") + ". Choisis une autre colonne dans le menu au-dessus.";
        }
        return "Aucune ligne valide trouvée avec ces colonnes. Vérifie ta sélection ci-dessus.";
      }

      function validerMappingVentes() {
        var colDate = selectDate.value;
        var colProduit = selectProduit.value;
        var colQuantite = selectQuantite.value;

        if (!colDate || !colProduit || !colQuantite) {
          messageDiv.style.display = 'block';
          messageDiv.className = 'erreur';
          messageDiv.textContent = "Choisis une colonne pour la date, le produit et la quantité.";
          return;
        }

        lignesAImporter = [];
        var lignesInvalides = 0;

        lignesBrutes.forEach(function (ligne) {
          var date = parserDate(ligne[colDate]);
          var produit = texteCellule(ligne[colProduit]);
          var quantite = parserQuantite(ligne[colQuantite]);

          if (date && produit && !isNaN(quantite)) {
            lignesAImporter.push({
              commercant_id: commercantId,
              nom_produit: produit,
              quantite: quantite,
              date_vente: date
            });
          } else {
            lignesInvalides++;
          }
        });

        messageDiv.style.display = 'none';
        apercuDiv.innerHTML = '';

        if (lignesAImporter.length === 0) {
          apercuDiv.innerHTML = '<div class="erreur" style="padding:10px; border-radius:5px;">' + messageAucuneLigneValide(colDate, colProduit, colQuantite) + '</div>';
          btnImporter.style.display = 'none';
          return;
        }

        var tableau = '<table><tr><th>Date</th><th>Produit</th><th>Quantité</th></tr>';
        lignesAImporter.slice(0, 5).forEach(function (l) {
          tableau += '<tr><td>' + l.date_vente + '</td><td>' + l.nom_produit + '</td><td>' + l.quantite + '</td></tr>';
        });
        tableau += '</table>';

        var texteInfo = lignesAImporter.length + ' ligne(s) prête(s) à importer';
        if (lignesInvalides > 0) {
          texteInfo += ' (' + lignesInvalides + ' ligne(s) ignorée(s) car incomplète(s) ou illisible(s))';
        }

        apercuDiv.innerHTML = '<div class="info" style="padding:10px; border-radius:5px;">' + texteInfo + '</div>'
          + noteNouveauxProduits(lignesAImporter, function (l) { return l.nom_produit; })
          + tableau;
        btnImporter.style.display = 'block';
      }

      function validerMappingFiches() {
        var colProduit = selectProduit.value;
        var colIngredient = selectIngredient.value;
        var colQuantite = selectQuantite.value;
        var colUnite = selectUnite.value;

        if (!colProduit || !colIngredient || !colQuantite) {
          messageDiv.style.display = 'block';
          messageDiv.className = 'erreur';
          messageDiv.textContent = "Choisis une colonne pour le produit, l'ingrédient et la quantité.";
          return;
        }

        lignesFichesAImporter = [];
        var lignesInvalides = 0;

        lignesBrutes.forEach(function (ligne) {
          var produit = texteCellule(ligne[colProduit]);
          var ingredient = texteCellule(ligne[colIngredient]);
          var quantite = parserQuantiteDecimale(ligne[colQuantite]);
          var unite = colUnite ? texteCellule(ligne[colUnite]) : '';

          if (produit && ingredient && !isNaN(quantite) && quantite > 0) {
            lignesFichesAImporter.push({
              produit: produit,
              ingredient: ingredient,
              quantite: quantite,
              unite: unite || null
            });
          } else {
            lignesInvalides++;
          }
        });

        messageDiv.style.display = 'none';
        apercuDiv.innerHTML = '';

        if (lignesFichesAImporter.length === 0) {
          apercuDiv.innerHTML = '<div class="erreur" style="padding:10px; border-radius:5px;">Aucune ligne valide trouvée avec ces colonnes. Vérifie ta sélection ci-dessus.</div>';
          btnImporter.style.display = 'none';
          return;
        }

        var tableau = '<table><tr><th>Produit</th><th>Ingrédient</th><th>Quantité</th><th>Unité</th></tr>';
        lignesFichesAImporter.slice(0, 5).forEach(function (l) {
          tableau += '<tr><td>' + l.produit + '</td><td>' + l.ingredient + '</td><td>' + l.quantite + '</td><td>' + (l.unite || '-') + '</td></tr>';
        });
        tableau += '</table>';

        var texteInfo = lignesFichesAImporter.length + ' ligne(s) prête(s) à importer';
        if (lignesInvalides > 0) {
          texteInfo += ' (' + lignesInvalides + ' ligne(s) ignorée(s) car incomplète(s) ou illisible(s))';
        }

        apercuDiv.innerHTML = '<div class="info" style="padding:10px; border-radius:5px;">' + texteInfo + '</div>'
          + noteNouveauxProduits(lignesFichesAImporter, function (l) { return l.produit; })
          + tableau;
        btnImporter.style.display = 'block';
      }

      btnValiderMapping.addEventListener('click', function () {
        if (modeImport === 'ventes') validerMappingVentes();
        else validerMappingFiches();
      });

      function importerVentes() {
        // Avant d'importer les ventes, on s'assure que chaque produit rencontré
        // existe déjà dans "Mes produits" — sinon la fiche technique (ingrédients)
        // ne pourrait jamais s'y rattacher, et il faudrait tout recréer à la main
        // après coup. On crée automatiquement ceux qui manquent.
        //
        // La comparaison se fait sur une clé normalisée (espaces superflus et
        // casse ignorés) : un fichier qui écrit tantôt "Croissant", tantôt
        // "croissant" ou "CROISSANT", ne doit pas créer trois fiches produit
        // différentes pour la même chose. La toute première orthographe
        // rencontrée (déjà existante en base si possible, sinon celle du
        // fichier) sert de référence, et toutes les lignes importées sont
        // réécrites vers cette orthographe canonique.
        sbClient.from('produits').select('nom').eq('commercant_id', commercantId).then(function (resultatProduits) {
          var nomCanoniqueParCle = {};
          (resultatProduits.data || []).forEach(function (p) { nomCanoniqueParCle[cleNormaliseeProduit(p.nom)] = p.nom; });

          lignesAImporter.forEach(function (l) {
            var cle = cleNormaliseeProduit(l.nom_produit);
            if (!nomCanoniqueParCle[cle]) nomCanoniqueParCle[cle] = l.nom_produit;
            l.nom_produit = nomCanoniqueParCle[cle];
          });

          var nomsRencontres = {};
          lignesAImporter.forEach(function (l) { nomsRencontres[l.nom_produit] = true; });

          var nomsExistants = {};
          (resultatProduits.data || []).forEach(function (p) { nomsExistants[p.nom] = true; });

          var nouveauxProduits = Object.keys(nomsRencontres)
            .filter(function (nom) { return !nomsExistants[nom]; })
            .map(function (nom) { return { commercant_id: commercantId, nom: nom }; });

          var creerProduitsManquants = nouveauxProduits.length > 0
            ? sbClient.from('produits').insert(nouveauxProduits)
            : Promise.resolve({ error: null });

          creerProduitsManquants.then(function () {
            sbClient.from('ventes').insert(lignesAImporter).then(function (result) {
              messageDiv.style.display = 'block';
              btnImporter.disabled = false;
              btnImporter.textContent = TEXTES.ventes.boutonImporter;

              if (result.error) {
                messageDiv.className = 'erreur';
                messageDiv.textContent = "Erreur : " + result.error.message;
              } else {
                messageDiv.className = 'succes';
                var texte = lignesAImporter.length + " ventes importées avec succès !";
                if (nouveauxProduits.length > 0) {
                  texte += " " + nouveauxProduits.length + " nouveau(x) produit(s) ajouté(s) automatiquement dans Mes produits.";
                }
                messageDiv.textContent = texte;
                btnImporter.style.display = 'none';
                zoneMapping.style.display = 'none';
                apercuDiv.innerHTML = '';
              }
            });
          });
        });
      }

      function importerFiches() {
        // Même logique de création automatique que pour les ventes : un plat mentionné
        // dans le document de recette qui n'existe pas encore dans "Mes produits" est créé
        // à la volée, sinon sa fiche technique n'aurait aucun produit à rattacher.
        // Comparaison normalisée (casse/espaces) pour la même raison que dans
        // importerVentes : éviter de créer un doublon pour une orthographe
        // légèrement différente d'un produit déjà connu.
        sbClient.from('produits').select('id,nom').eq('commercant_id', commercantId).then(function (resultatProduits) {
          var nomVersId = {};
          (resultatProduits.data || []).forEach(function (p) { nomVersId[p.nom] = p.id; });

          var nomCanoniqueParCle = {};
          (resultatProduits.data || []).forEach(function (p) { nomCanoniqueParCle[cleNormaliseeProduit(p.nom)] = p.nom; });
          lignesFichesAImporter.forEach(function (l) {
            var cle = cleNormaliseeProduit(l.produit);
            if (!nomCanoniqueParCle[cle]) nomCanoniqueParCle[cle] = l.produit;
            l.produit = nomCanoniqueParCle[cle];
          });

          var nomsRencontres = {};
          lignesFichesAImporter.forEach(function (l) { nomsRencontres[l.produit] = true; });

          var nomsManquants = Object.keys(nomsRencontres).filter(function (nom) { return !(nom in nomVersId); });
          var nouveauxProduits = nomsManquants.map(function (nom) { return { commercant_id: commercantId, nom: nom }; });

          var creerProduitsManquants = nouveauxProduits.length > 0
            ? sbClient.from('produits').insert(nouveauxProduits).select('id,nom')
            : Promise.resolve({ data: [], error: null });

          creerProduitsManquants.then(function (resultatCreation) {
            if (resultatCreation.error) {
              messageDiv.style.display = 'block';
              messageDiv.className = 'erreur';
              messageDiv.textContent = "Erreur lors de la création des produits manquants : " + resultatCreation.error.message;
              btnImporter.disabled = false;
              btnImporter.textContent = TEXTES.fiches.boutonImporter;
              return;
            }

            (resultatCreation.data || []).forEach(function (p) { nomVersId[p.nom] = p.id; });

            var lignesIngredients = lignesFichesAImporter
              .filter(function (l) { return nomVersId[l.produit] !== undefined; })
              .map(function (l) {
                return {
                  commercant_id: commercantId,
                  produit_id: nomVersId[l.produit],
                  nom_ingredient: l.ingredient,
                  quantite: l.quantite,
                  unite: l.unite
                };
              });

            sbClient.from('ingredients_produit').insert(lignesIngredients).then(function (result) {
              messageDiv.style.display = 'block';
              btnImporter.disabled = false;
              btnImporter.textContent = TEXTES.fiches.boutonImporter;

              if (result.error) {
                messageDiv.className = 'erreur';
                messageDiv.textContent = "Erreur : " + result.error.message;
              } else {
                messageDiv.className = 'succes';
                var texte = lignesIngredients.length + " ligne(s) de fiche technique importée(s) avec succès !";
                if (nouveauxProduits.length > 0) {
                  texte += " " + nouveauxProduits.length + " nouveau(x) produit(s) ajouté(s) automatiquement dans Mes produits.";
                }
                messageDiv.textContent = texte;
                btnImporter.style.display = 'none';
                zoneMapping.style.display = 'none';
                apercuDiv.innerHTML = '';
              }
            });
          });
        });
      }

      btnImporter.addEventListener('click', function () {
        btnImporter.disabled = true;
        btnImporter.textContent = 'Import en cours...';

        if (modeImport === 'ventes') importerVentes();
        else importerFiches();
      });
    })();
  </script>
</body>
</html>
