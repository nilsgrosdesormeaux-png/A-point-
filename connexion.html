
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>À Point</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { display: flex; align-items: center; min-height: 100vh; }
    .conteneur { margin: auto; width: 100%; padding-top: 0; padding-bottom: 40px; }
    h1 { text-align: center; }
    .sous-titre { text-align: center; margin-bottom: 26px; }
  </style>
</head>
<body>
  <div class="conteneur" style="max-width: 380px;">
    <div class="logo-centre">
      <svg class="logo-marque" viewBox="0 0 100 100" width="56" height="56" aria-hidden="true">
        <path d="M50 12 L16 86" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none"/>
        <path d="M50 12 L84 86" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none"/>
        <circle cx="50" cy="56" r="8" fill="currentColor"/>
      </svg>
    </div>
    <h1>À Point</h1>
    <p class="sous-titre texte-aide">La bonne quantité, chaque jour</p>

    <div class="onglets">
      <div class="onglet actif" id="ongletConnexion">Se connecter</div>
      <div class="onglet" id="ongletInscription">Créer un compte</div>
    </div>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="ton@email.com">

    <label for="motdepasse">Mot de passe</label>
    <input type="password" id="motdepasse" placeholder="Au moins 6 caractères">

    <p class="texte-aide" style="text-align: right; margin: 6px 0 0;" id="ligneMotDePasseOublie">
      <a href="#" id="lienMotDePasseOublie">Mot de passe oublié ?</a>
    </p>

    <label class="case-consentement" id="ligneCgu" style="display:none;">
      <input type="checkbox" id="caseCgu">
      <span>J'ai lu et j'accepte les <a href="cgu.html" target="_blank" rel="noopener">conditions générales d'utilisation</a>.</span>
    </label>

    <button id="btnAction">Se connecter</button>

    <div id="message"></div>

    <p class="texte-aide" style="text-align: center; margin-top: 18px;">
      Nouveau ici ? <a href="bienvenue.html">Découvre comment ça marche avant de commencer →</a>
    </p>

    <p class="pied-page"><a href="cgu.html">Conditions générales d'utilisation</a></p>
  </div>

  <script>
    (function () {
      var SUPABASE_URL = "https://eqvbksxfwlgbcxgqljqn.supabase.co";
      var SUPABASE_KEY = "sb_publishable_Dlh12BadZ13vHrUR0o7O7Q_i3aN2VMc";
      var sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      var modeInscription = false;
      var ongletConnexion = document.getElementById('ongletConnexion');
      var ongletInscription = document.getElementById('ongletInscription');
      var btnAction = document.getElementById('btnAction');
      var messageDiv = document.getElementById('message');
      var ligneCgu = document.getElementById('ligneCgu');
      var caseCgu = document.getElementById('caseCgu');
      var ligneMotDePasseOublie = document.getElementById('ligneMotDePasseOublie');
      var lienMotDePasseOublie = document.getElementById('lienMotDePasseOublie');

      sbClient.auth.getSession().then(function (result) {
        if (result.data.session) {
          window.location.href = 'tableau-de-bord.html';
        }
      });

      ongletConnexion.addEventListener('click', function () {
        modeInscription = false;
        ongletConnexion.className = 'onglet actif';
        ongletInscription.className = 'onglet';
        btnAction.textContent = 'Se connecter';
        messageDiv.style.display = 'none';
        ligneCgu.style.display = 'none';
        ligneMotDePasseOublie.style.display = 'block';
      });

      ongletInscription.addEventListener('click', function () {
        modeInscription = true;
        ongletInscription.className = 'onglet actif';
        ongletConnexion.className = 'onglet';
        btnAction.textContent = 'Créer mon compte';
        messageDiv.style.display = 'none';
        ligneCgu.style.display = 'flex';
        ligneMotDePasseOublie.style.display = 'none';
      });

      lienMotDePasseOublie.addEventListener('click', function (e) {
        e.preventDefault();
        var email = document.getElementById('email').value;
        if (!email) {
          messageDiv.style.display = 'block';
          messageDiv.className = 'erreur';
          messageDiv.textContent = "Renseigne d'abord ton adresse email ci-dessus, puis clique à nouveau sur ce lien.";
          return;
        }
        lienMotDePasseOublie.style.pointerEvents = 'none';
        sbClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + window.location.pathname.replace(/connexion\.html$/, '') + 'reinitialiser-mot-de-passe.html'
        }).then(function (result) {
          lienMotDePasseOublie.style.pointerEvents = '';
          messageDiv.style.display = 'block';
          if (result.error) {
            messageDiv.className = 'erreur';
            messageDiv.textContent = "Erreur : " + result.error.message;
          } else {
            messageDiv.className = 'succes';
            messageDiv.textContent = "Si un compte existe pour " + email + ", un email vient de lui être envoyé avec un lien pour choisir un nouveau mot de passe.";
          }
        });
      });

      btnAction.addEventListener('click', function () {
        var email = document.getElementById('email').value;
        var motdepasse = document.getElementById('motdepasse').value;

        if (!email || !motdepasse) {
          messageDiv.style.display = 'block';
          messageDiv.className = 'erreur';
          messageDiv.textContent = "Remplis l'email et le mot de passe.";
          return;
        }

        if (modeInscription && !caseCgu.checked) {
          messageDiv.style.display = 'block';
          messageDiv.className = 'erreur';
          messageDiv.textContent = "Coche la case pour accepter les conditions générales d'utilisation avant de créer ton compte.";
          return;
        }

        btnAction.disabled = true;

        if (modeInscription) {
          sbClient.auth.signUp({
            email: email,
            password: motdepasse,
            options: {
              emailRedirectTo: window.location.origin + window.location.pathname
            }
          }).then(function (result) {
            btnAction.disabled = false;
            messageDiv.style.display = 'block';
            if (result.error) {
              messageDiv.className = 'erreur';
              messageDiv.textContent = "Erreur : " + result.error.message;
            } else if (result.data.session) {
              window.location.href = 'tableau-de-bord.html';
            } else {
              messageDiv.className = 'succes';
              messageDiv.textContent = "Compte créé ! Vérifie ta boîte email pour confirmer, puis reviens te connecter ici.";
            }
          });
        } else {
          sbClient.auth.signInWithPassword({
            email: email,
            password: motdepasse
          }).then(function (result) {
            btnAction.disabled = false;
            messageDiv.style.display = 'block';
            if (result.error) {
              messageDiv.className = 'erreur';
              messageDiv.textContent = "Erreur : " + result.error.message;
            } else {
              window.location.href = 'tableau-de-bord.html';
            }
          });
        }
      });
    })();
  </script>
</body>
</html>
