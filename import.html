
<!DOCTYPE html>

<body>
  <div class="conteneur conteneur--moyen">

    <div class="carte-page">
      <div class="entete-page">
        <div>
          <p class="eyebrow">Import</p>
          <h1 id="titreImport">Importer mon historique de ventes</h1>
        </div>
      </div>
      <p id="statutConnexion" class="texte-aide">Vérification de la connexion...</p>

      <div id="zoneFormulaire" style="display:none;">
        <div class="onglets">
          <div class="onglet actif" id="ongletVentes">Mes ventes</div>
          <div class="onglet" id="ongletFiches">Mes fiches techniques</div>
        </div>

        <p class="texte-aide" id="texteExplication"></p>

        <div class="zone-upload">
          <p class="section-titre" style="margin-top:0;">Sélectionne ton fichier</p>

        <div id="zoneMapping" class="zone-mapping">
          <p style="margin:0; font-weight:600;">Vérifie que les bonnes colonnes sont sélectionnées :</p>

            <label for="selectDate">Colonne pour la date</label>
            <select id="selectDate"></select>

          <label for="selectProduit" id="labelProduit">Colonne pour le produit</label>

          <div id="champIngredient">

          <label for="selectQuantite" id="labelQuantite">Colonne pour la quantité vendue</label>

          </div>

          <button id="btnValiderMapping">Continuer</button>

        <button id="btnImporter" style="display:none;">Importer ces ventes</button>

        <div id="message"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var SUPABASE_URL = "https://eqvbksxfwlgbcxgqljqn.supabase.co";
      var SUPABASE_KEY = "sb_publishable_Dlh12BadZ13vHrUR0o7O7Q_i3aN2VMc";
      var sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      var statutDiv = document.getElementById('statutConnexion');
      var zoneFormulaire = document.getElementById('zoneFormulaire');
      var zoneMapping = document.getElementById('zoneMapping');
      var apercuBrutDiv = document.getElementById('apercuBrut');
      var apercuDiv = document.getElementById('apercu');
      var selectDate = document.getElementById('selectDate');
      var selectProduit = document.getElementById('selectProduit');
      var selectIngredient = document.getElementById('selectIngredient');
      var selectQuantite = document.getElementById('selectQuantite');
      var selectUnite = document.getElementById('selectUnite');
      var champDate = document.getElementById('champDate');
      var champIngredient = document.getElementById('champIngredient');
      var champUnite = document.getElementById('champUnite');
      var labelProduit = document.getElementById('labelProduit');
      var labelQuantite = document.getElementById('labelQuantite');
      var btnValiderMapping = document.getElementById('btnValiderMapping');
      var btnImporter = document.getElementById('btnImporter');
      var messageDiv = document.getElementById('message');
      var fichierInput = document.getElementById('fichierImport');
      var titreImportEl = document.getElementById('titreImport');
      var texteExplicationEl = document.getElementById('texteExplication');
      var ongletVentes = document.getElementById('ongletVentes');
      var ongletFiches = document.getElementById('ongletFiches');
      var commercantId = null;

      var modeImport = 'ventes'; // 'ventes' ou 'fiches'
      var lignesBrutes = [];
      var entetesDisponibles = [];
      var lignesAImporter = [];        // mode ventes
      var lignesFichesAImporter = [];  // mode fiches

      var TEXTES = {
        ventes: {
          titre: "Importer mon historique de ventes",
          explication: "Dépose un fichier CSV ou Excel (.csv, .xlsx, .xls) contenant tes ventes : une colonne pour la date, une pour le produit, une pour la quantité vendue. Peu importe l'ordre ou le nom exact des colonnes — on essaie de les reconnaître automatiquement, et tu pourras vérifier avant d'importer.",
          labelProduit: "Colonne pour le produit",
          labelQuantite: "Colonne pour la quantité vendue",
          boutonImporter: "Importer ces ventes"
        },
        fiches: {
          titre: "Importer mes fiches techniques",
          explication: "Dépose un fichier CSV ou Excel listant les ingrédients de tes recettes : une ligne par ingrédient, avec le nom du produit (le plat), le nom de l'ingrédient, la quantité utilisée pour une unité vendue, et si besoin l'unité (g, kg, ml...). Un produit qui n'existe pas encore dans Mes produits est créé automatiquement.",
          labelProduit: "Colonne pour le produit (le plat)",
          labelQuantite: "Colonne pour la quantité (par unité vendue)",
          boutonImporter: "Importer ces fiches techniques"
        }
      };

      // Noms de colonnes fréquemment utilisés par les caisses/tableurs, pour reconnaissance automatique
      var aliasesDate = ['date', 'jour', 'datedevente', 'date_vente', 'datevente', 'dateventre'];
      var aliasesProduit = ['produit', 'plat', 'article', 'nomduproduit', 'nom_produit', 'produitvendu', 'item', 'designation', 'nomarticle', 'libelle'];
      var aliasesQuantite = ['quantite', 'qte', 'nombre', 'nombrevendu', 'quantitevendue', 'qty', 'nbvendu', 'ventes', 'quantitevendu'];
      var aliasesIngredient = ['ingredient', 'ingredients', 'composant', 'matierepremiere', 'ingredientutilise'];
      var aliasesUnite = ['unite', 'unites', 'uom', 'mesure'];

      function normaliserTexte(texte) {
        return (texte === null || texte === undefined ? '' : texte.toString())
          .toLowerCase()
          .normalize('NFD').replace(/[̀-ͯ]/g, '')
          .replace(/[^a-z0-9]/g, '');
      }

      function detecterColonne(entetes, aliases) {
        for (var i = 0; i < entetes.length; i++) {
          if (aliases.indexOf(normaliserTexte(entetes[i])) !== -1) return entetes[i];
        }
        for (var j = 0; j < entetes.length; j++) {
          var norm = normaliserTexte(entetes[j]);
          for (var k = 0; k < aliases.length; k++) {
            if (norm.indexOf(aliases[k]) !== -1) return entetes[j];
          }
        }
        return '';
      }

      function remplirSelect(select, entetes, valeurDetectee, avecOptionVide) {
        select.innerHTML = avecOptionVide
          ? '<option value="">-- Aucune --</option>'
          : '<option value="">-- Choisir une colonne --</option>';
        entetes.forEach(function (entete) {
          var option = document.createElement('option');
          option.value = entete;
          option.textContent = entete;
          if (entete === valeurDetectee) option.selected = true;
          select.appendChild(option);
        });
      }

      function afficherApercuBrut(lignes, entetes) {
        if (lignes.length === 0) { apercuBrutDiv.innerHTML = ''; return; }
        var tableau = '<table><tr>';
        entetes.forEach(function (e) { tableau += '<th>' + e + '</th>'; });
        tableau += '</tr>';
        lignes.slice(0, 3).forEach(function (ligne) {
          tableau += '<tr>';
          entetes.forEach(function (e) { tableau += '<td>' + (ligne[e] !== undefined ? ligne[e] : '') + '</td>'; });
          tableau += '</tr>';
        });
        tableau += '</table>';
        apercuBrutDiv.innerHTML = '<p style="font-size:12px; color:#777; margin-top:12px;">Aperçu de ton fichier :</p>' + tableau;
      }

      // Convertit une valeur de date (texte dans divers formats, ou objet Date venant d'un Excel) en AAAA-MM-JJ
      function parserDate(valeur) {
        if (valeur instanceof Date && !isNaN(valeur)) return formatDateISO(valeur);

        var texte = (valeur === null || valeur === undefined ? '' : valeur.toString()).trim();
        if (!texte) return null;

        var m = texte.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
        if (m) return formatDateISO(new Date(+m[1], +m[2] - 1, +m[3]));

        m = texte.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
        if (m) return formatDateISO(new Date(+m[3], +m[2] - 1, +m[1]));

        m = texte.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})$/);
        if (m) return formatDateISO(new Date(2000 + parseInt(m[3], 10), +m[2] - 1, +m[1]));

        var parsed = new Date(texte);
        if (!isNaN(parsed)) return formatDateISO(parsed);

        return null;
      }

      function formatDateISO(date) {
        var y = date.getFullYear();
        var mo = ('0' + (date.getMonth() + 1)).slice(-2);
        var d = ('0' + date.getDate()).slice(-2);
        return y + '-' + mo + '-' + d;
      }

      // Convertit une valeur de quantité (nombre, ou texte avec virgule/espaces) en nombre entier (ventes)
      function parserQuantite(valeur) {
        if (typeof valeur === 'number') return Math.round(valeur);
        var texte = (valeur === null || valeur === undefined ? '' : valeur.toString()).trim();
        if (!texte) return NaN;
        texte = texte.replace(/\s/g, '').replace(',', '.').replace(/[^0-9.\-]/g, '');
        var nombre = parseFloat(texte);
        return isNaN(nombre) ? NaN : Math.round(nombre);
      }

      // Convertit une valeur de quantité en nombre décimal, sans arrondi (fiches techniques :
      // 0.5 kg de beurre ne doit pas être arrondi à 1)
      function parserQuantiteDecimale(valeur) {
        if (typeof valeur === 'number') return valeur;
        var texte = (valeur === null || valeur === undefined ? '' : valeur.toString()).trim();
        if (!texte) return NaN;
        texte = texte.replace(/\s/g, '').replace(',', '.').replace(/[^0-9.\-]/g, '');
        var nombre = parseFloat(texte);
        return isNaN(nombre) ? NaN : nombre;
      }

      function texteCellule(valeur) {
        return (valeur === null || valeur === undefined ? '' : valeur.toString()).trim();
      }

      function reinitialiserApresChangementFichierOuMode() {
        lignesBrutes = [];
        entetesDisponibles = [];
        lignesAImporter = [];
        lignesFichesAImporter = [];
        zoneMapping.style.display = 'none';
        apercuBrutDiv.innerHTML = '';
        apercuDiv.innerHTML = '';
        btnImporter.style.display = 'none';
        btnImporter.disabled = false;
        messageDiv.style.display = 'none';
        fichierInput.value = '';
      }

      function definirMode(nouveauMode) {
        modeImport = nouveauMode;
        var t = TEXTES[modeImport];

        titreImportEl.textContent = t.titre;
        texteExplicationEl.textContent = t.explication;
        labelProduit.textContent = t.labelProduit;
        labelQuantite.textContent = t.labelQuantite;
        btnImporter.textContent = t.boutonImporter;

        ongletVentes.classList.toggle('actif', modeImport === 'ventes');
        ongletFiches.classList.toggle('actif', modeImport === 'fiches');

        champDate.style.display = modeImport === 'ventes' ? 'block' : 'none';
        champIngredient.style.display = modeImport === 'fiches' ? 'block' : 'none';
        champUnite.style.display = modeImport === 'fiches' ? 'block' : 'none';

        reinitialiserApresChangementFichierOuMode();
      }

      function recevoirDonnees(lignes, entetes) {
        lignesBrutes = lignes;
        entetesDisponibles = entetes;

        if (modeImport === 'ventes') {
          remplirSelect(selectDate, entetes, detecterColonne(entetes, aliasesDate), false);
          remplirSelect(selectProduit, entetes, detecterColonne(entetes, aliasesProduit), false);
          remplirSelect(selectQuantite, entetes, detecterColonne(entetes, aliasesQuantite), false);
        } else {
          remplirSelect(selectProduit, entetes, detecterColonne(entetes, aliasesProduit), false);
          remplirSelect(selectIngredient, entetes, detecterColonne(entetes, aliasesIngredient), false);
          remplirSelect(selectQuantite, entetes, detecterColonne(entetes, aliasesQuantite), false);
          remplirSelect(selectUnite, entetes, detecterColonne(entetes, aliasesUnite), true);
        }
        afficherApercuBrut(lignes, entetes);

        apercuDiv.innerHTML = '';
        btnImporter.style.display = 'none';
        zoneMapping.style.display = 'block';
      }

      sbClient.auth.getSession().then(function (result) {
        var session = result.data.session;
        if (session) {
          commercantId = session.user.id;
          statutDiv.textContent = "Connecté en tant que : " + session.user.email;
          zoneFormulaire.style.display = 'block';
          definirMode('ventes');
        } else {
          statutDiv.textContent = "Tu n'es pas connecté. Va d'abord sur la page de connexion.";
        }
      }).catch(function (erreur) {
        statutDiv.textContent = "Erreur de connexion : " + erreur.message;
      });

      ongletVentes.addEventListener('click', function () { definirMode('ventes'); });
      ongletFiches.addEventListener('click', function () { definirMode('fiches'); });

      fichierInput.addEventListener('change', function (e) {
        var fichier = e.target.files[0];
        if (!fichier) return;

        messageDiv.style.display = 'none';
        var nomFichier = fichier.name.toLowerCase();

        if (nomFichier.endsWith('.csv')) {
          Papa.parse(fichier, {
            header: true,
            skipEmptyLines: true,
            delimiter: '',
            complete: function (resultat) {
              recevoirDonnees(resultat.data, resultat.meta.fields || []);
            }
          });
        } else if (nomFichier.endsWith('.xlsx') || nomFichier.endsWith('.xls')) {
          var lecteur = new FileReader();
          lecteur.onload = function (evenement) {
            var donnees = new Uint8Array(evenement.target.result);
            var classeur = XLSX.read(donnees, { type: 'array', cellDates: true });
            var premiereFeuille = classeur.Sheets[classeur.SheetNames[0]];
            var lignes = XLSX.utils.sheet_to_json(premiereFeuille, { defval: '' });
            var entetes = lignes.length > 0 ? Object.keys(lignes[0]) : [];
            recevoirDonnees(lignes, entetes);
          };
          lecteur.readAsArrayBuffer(fichier);
        } else {
          messageDiv.style.display = 'block';
          messageDiv.className = 'erreur';
          messageDiv.textContent = "Format non reconnu. Utilise un fichier .csv, .xlsx ou .xls.";
        }
      });

      function validerMappingVentes() {
        var colDate = selectDate.value;
        var colProduit = selectProduit.value;
        var colQuantite = selectQuantite.value;

        if (!colDate || !colProduit || !colQuantite) {
          messageDiv.style.display = 'block';
          messageDiv.className = 'erreur';
          messageDiv.textContent = "Choisis une colonne pour la date, le produit et la quantité.";
          return;
        }

        lignesAImporter = [];
        var lignesInvalides = 0;

        lignesBrutes.forEach(function (ligne) {
          var date = parserDate(ligne[colDate]);
          var produit = texteCellule(ligne[colProduit]);
          var quantite = parserQuantite(ligne[colQuantite]);

          if (date && produit && !isNaN(quantite)) {
            lignesAImporter.push({
              commercant_id: commercantId,
              nom_produit: produit,
              quantite: quantite,
              date_vente: date
            });
          } else {
            lignesInvalides++;
          }
        });

        messageDiv.style.display = 'none';
        apercuDiv.innerHTML = '';

        if (lignesAImporter.length === 0) {
          apercuDiv.innerHTML = '<div class="erreur" style="padding:10px; border-radius:5px;">Aucune ligne valide trouvée avec ces colonnes. Vérifie ta sélection ci-dessus.</div>';
          btnImporter.style.display = 'none';
          return;
        }

        var tableau = '<table><tr><th>Date</th><th>Produit</th><th>Quantité</th></tr>';
        lignesAImporter.slice(0, 5).forEach(function (l) {
          tableau += '<tr><td>' + l.date_vente + '</td><td>' + l.nom_produit + '</td><td>' + l.quantite + '</td></tr>';
        });
        tableau += '</table>';

        var texteInfo = lignesAImporter.length + ' ligne(s) prête(s) à importer';
        if (lignesInvalides > 0) {
          texteInfo += ' (' + lignesInvalides + ' ligne(s) ignorée(s) car incomplète(s) ou illisible(s))';
        }

        apercuDiv.innerHTML = '<div class="info" style="padding:10px; border-radius:5px;">' + texteInfo + '</div>' + tableau;
        btnImporter.style.display = 'block';
      }

      function validerMappingFiches() {
        var colProduit = selectProduit.value;
        var colIngredient = selectIngredient.value;
        var colQuantite = selectQuantite.value;
        var colUnite = selectUnite.value;

        if (!colProduit || !colIngredient || !colQuantite) {
          messageDiv.style.display = 'block';
          messageDiv.className = 'erreur';
          messageDiv.textContent = "Choisis une colonne pour le produit, l'ingrédient et la quantité.";
          return;
        }

        lignesFichesAImporter = [];
        var lignesInvalides = 0;

        lignesBrutes.forEach(function (ligne) {
          var produit = texteCellule(ligne[colProduit]);
          var ingredient = texteCellule(ligne[colIngredient]);
          var quantite = parserQuantiteDecimale(ligne[colQuantite]);
          var unite = colUnite ? texteCellule(ligne[colUnite]) : '';

          if (produit && ingredient && !isNaN(quantite) && quantite > 0) {
            lignesFichesAImporter.push({
              produit: produit,
              ingredient: ingredient,
              quantite: quantite,
              unite: unite || null
            });
          } else {
            lignesInvalides++;
          }
        });

        messageDiv.style.display = 'none';
        apercuDiv.innerHTML = '';

        if (lignesFichesAImporter.length === 0) {
          apercuDiv.innerHTML = '<div class="erreur" style="padding:10px; border-radius:5px;">Aucune ligne valide trouvée avec ces colonnes. Vérifie ta sélection ci-dessus.</div>';
          btnImporter.style.display = 'none';
          return;
        }

        var tableau = '<table><tr><th>Produit</th><th>Ingrédient</th><th>Quantité</th><th>Unité</th></tr>';
        lignesFichesAImporter.slice(0, 5).forEach(function (l) {
          tableau += '<tr><td>' + l.produit + '</td><td>' + l.ingredient + '</td><td>' + l.quantite + '</td><td>' + (l.unite || '—') + '</td></tr>';
        });
        tableau += '</table>';

        var texteInfo = lignesFichesAImporter.length + ' ligne(s) prête(s) à importer';
        if (lignesInvalides > 0) {
          texteInfo += ' (' + lignesInvalides + ' ligne(s) ignorée(s) car incomplète(s) ou illisible(s))';
        }

        apercuDiv.innerHTML = '<div class="info" style="padding:10px; border-radius:5px;">' + texteInfo + '</div>' + tableau;
        btnImporter.style.display = 'block';
      }

      btnValiderMapping.addEventListener('click', function () {
        if (modeImport === 'ventes') validerMappingVentes();
        else validerMappingFiches();
      });

      function importerVentes() {
        // Avant d'importer les ventes, on s'assure que chaque produit rencontré
        // existe déjà dans "Mes produits" — sinon la fiche technique (ingrédients)
        // ne pourrait jamais s'y rattacher, et il faudrait tout recréer à la main
        // après coup. On crée automatiquement ceux qui manquent.
        var nomsRencontres = {};
        lignesAImporter.forEach(function (l) { nomsRencontres[l.nom_produit] = true; });

        sbClient.from('produits').select('nom').eq('commercant_id', commercantId).then(function (resultatProduits) {
          var nomsExistants = {};
          (resultatProduits.data || []).forEach(function (p) { nomsExistants[p.nom] = true; });

          var nouveauxProduits = Object.keys(nomsRencontres)
            .filter(function (nom) { return !nomsExistants[nom]; })
            .map(function (nom) { return { commercant_id: commercantId, nom: nom }; });

          var creerProduitsManquants = nouveauxProduits.length > 0
            ? sbClient.from('produits').insert(nouveauxProduits)
            : Promise.resolve({ error: null });

          creerProduitsManquants.then(function () {
            sbClient.from('ventes').insert(lignesAImporter).then(function (result) {
              messageDiv.style.display = 'block';
              btnImporter.disabled = false;
              btnImporter.textContent = TEXTES.ventes.boutonImporter;

              if (result.error) {
                messageDiv.className = 'erreur';
                messageDiv.textContent = "Erreur : " + result.error.message;
              } else {
                messageDiv.className = 'succes';
                var texte = lignesAImporter.length + " ventes importées avec succès !";
                if (nouveauxProduits.length > 0) {
                  texte += " " + nouveauxProduits.length + " nouveau(x) produit(s) ajouté(s) automatiquement dans Mes produits.";
                }
                messageDiv.textContent = texte;
                btnImporter.style.display = 'none';
                zoneMapping.style.display = 'none';
                apercuDiv.innerHTML = '';
              }
            });
          });
        });
      }

      function importerFiches() {
        // Même logique de création automatique que pour les ventes : un plat mentionné
        // dans le document de recette qui n'existe pas encore dans "Mes produits" est créé
        // à la volée, sinon sa fiche technique n'aurait aucun produit à rattacher.
        var nomsRencontres = {};
        lignesFichesAImporter.forEach(function (l) { nomsRencontres[l.produit] = true; });

        sbClient.from('produits').select('id,nom').eq('commercant_id', commercantId).then(function (resultatProduits) {
          var nomVersId = {};
          (resultatProduits.data || []).forEach(function (p) { nomVersId[p.nom] = p.id; });

          var nomsManquants = Object.keys(nomsRencontres).filter(function (nom) { return !(nom in nomVersId); });
          var nouveauxProduits = nomsManquants.map(function (nom) { return { commercant_id: commercantId, nom: nom }; });

          var creerProduitsManquants = nouveauxProduits.length > 0
            ? sbClient.from('produits').insert(nouveauxProduits).select('id,nom')
            : Promise.resolve({ data: [], error: null });

          creerProduitsManquants.then(function (resultatCreation) {
            if (resultatCreation.error) {
              messageDiv.style.display = 'block';
              messageDiv.className = 'erreur';
              messageDiv.textContent = "Erreur lors de la création des produits manquants : " + resultatCreation.error.message;
              btnImporter.disabled = false;
              btnImporter.textContent = TEXTES.fiches.boutonImporter;
              return;
            }

            (resultatCreation.data || []).forEach(function (p) { nomVersId[p.nom] = p.id; });

            var lignesIngredients = lignesFichesAImporter
              .filter(function (l) { return nomVersId[l.produit] !== undefined; })
              .map(function (l) {
                return {
                  commercant_id: commercantId,
                  produit_id: nomVersId[l.produit],
                  nom_ingredient: l.ingredient,
                  quantite: l.quantite,
                  unite: l.unite
                };
              });

            sbClient.from('ingredients_produit').insert(lignesIngredients).then(function (result) {
              messageDiv.style.display = 'block';
              btnImporter.disabled = false;
              btnImporter.textContent = TEXTES.fiches.boutonImporter;

              if (result.error) {
                messageDiv.className = 'erreur';
                messageDiv.textContent = "Erreur : " + result.error.message;
              } else {
                messageDiv.className = 'succes';
                var texte = lignesIngredients.length + " ligne(s) de fiche technique importée(s) avec succès !";
                if (nouveauxProduits.length > 0) {
                  texte += " " + nouveauxProduits.length + " nouveau(x) produit(s) ajouté(s) automatiquement dans Mes produits.";
                }
                messageDiv.textContent = texte;
                btnImporter.style.display = 'none';
                zoneMapping.style.display = 'none';
                apercuDiv.innerHTML = '';
              }
            });
          });
        });
      }

      btnImporter.addEventListener('click', function () {
        btnImporter.disabled = true;
        btnImporter.textContent = 'Import en cours...';

        if (modeImport === 'ventes') importerVentes();
        else importerFiches();
      });
    })();
  </script>
</body>
</html>
