
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>À Point - Espace employé</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="moteur-prevision.js"></script>
  <style>
    body { align-items: flex-start; min-height: 100vh; }
    .conteneur { margin: 0 auto; width: 100%; max-width: 480px; padding: 20px 16px 40px; }
    h1#titre {
      font-family: var(--police);
      font-weight: 600;
      letter-spacing: -0.01em;
      text-align: center;
      font-size: 19px;
      margin-bottom: 2px;
      color: var(--texte);
    }
    .sous-titre { text-align: center; margin-bottom: 18px; font-size: 13px; }

    /* Carte unique regroupant navigation, date, météo et emploi du temps :
       un seul bloc visuel cohérent plutôt que des éléments flottants sur
       le fond de page (retour utilisateur : la page manquait d'esthétique
       et de hiérarchie visuelle). */
    .carte-jour {
      background: var(--surface);
      border: 1px solid var(--bordure);
      border-radius: var(--rayon-lg);
      box-shadow: var(--ombre);
      padding: 18px 16px 6px;
    }

    .entete-jour {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 4px;
    }
    .date-complete {
      text-align: center;
      font-size: 12px;
      color: var(--texte-tres-attenue);
      margin: 0 0 8px;
    }
    .badge-meteo-jour {
      display: block;
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--texte);
      background: var(--accent-clair);
      border-radius: 999px;
      padding: 5px 13px;
      margin: 0 auto 14px;
      width: fit-content;
    }
    .bouton-nav-jour {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--bordure);
      background: var(--surface);
      color: var(--texte);
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(33, 29, 23, 0.06);
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }
    .bouton-nav-jour:hover { background: var(--accent-clair); border-color: var(--texte-tres-attenue); }
    .bouton-nav-jour:active { transform: scale(0.93); }
    .libelle-jour {
      font-family: var(--police-titre);
      font-size: 16.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-align: center;
      min-width: 140px;
    }

    /* Jour de repos : une ligne discrète, jamais un grand bloc vide. */
    .zone-repos { padding: 16px 0 22px; text-align: center; }
    .jour-repos-texte { margin: 0; color: var(--texte-tres-attenue); font-size: 14px; font-style: italic; }

    /* Jour travaillé : timeline verticale façon agenda, un bloc coloré
       positionné et dimensionné selon l'horaire réel du créneau — reprend
       le principe du Gantt du planning patron (positionnement par heure
       décimale), transposé à la verticale pour un seul employé. Compactée
       (retour utilisateur : trop grande, ne tenait pas à l'écran) : heures
       resserrées pour voir la quasi-totalité de la journée sans défiler. */
    .zone-timeline { padding: 6px 6px 16px 0; overflow: hidden; }
    .grille-jour { position: relative; }

    .ligne-heure {
      position: relative;
      border-top: 1px solid var(--bordure);
      box-sizing: border-box;
    }
    .ligne-heure:first-child { border-top: none; }
    .ligne-heure-libelle {
      position: absolute;
      top: -6px;
      left: 4px;
      font-size: 9px;
      font-weight: 600;
      color: var(--texte-tres-attenue);
      background: var(--surface);
      padding: 0 3px;
    }

    .bloc-jour {
      position: absolute;
      left: 38px;
      right: 4px;
      border-radius: 7px;
      color: #fff;
      border: 1px solid rgba(0,0,0,0.12);
      overflow: hidden;
      cursor: default;
    }
    .bloc-jour-corps { position: relative; z-index: 1; padding: 4px 7px; }
    .bloc-jour-horaire { display: block; font-weight: 700; font-size: 11.5px; line-height: 1.2; }
    .bloc-jour-poste { display: block; font-size: 10.5px; opacity: 0.92; margin-top: 1px; line-height: 1.15; }
    .bloc-jour-pause-texte { display: block; font-size: 9.5px; opacity: 0.85; margin-top: 1px; font-style: italic; line-height: 1.15; }

    .bloc-jour-pause {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 0;
      opacity: 0.5;
      background: repeating-linear-gradient(
        135deg,
        var(--surface),
        var(--surface) 4px,
        var(--bordure) 4px,
        var(--bordure) 8px
      );
      pointer-events: none;
    }

    .bouton-deconnexion {
      display: block;
      width: 100%;
      margin-top: 20px;
      background: transparent;
      color: var(--texte-tres-attenue);
      border: none;
      box-shadow: none;
      font-weight: 600;
      font-size: 13px;
      padding: 6px;
    }
    .bouton-deconnexion:hover { background: transparent; color: var(--texte); }

    .boutons-actions-employe {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 22px;
    }

    /* Bouton PDF : action la plus utile de la page (garder son planning sur
       soi), mise en avant visuellement — rempli, plus haut, avec ombre —
       plutôt qu'un simple lien secondaire parmi d'autres. */
    .bouton-pdf-principal {
      margin-top: 0;
      width: 100%;
      padding: 16px 18px;
      font-family: var(--police);
      font-size: 14.5px;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      cursor: pointer;
      box-shadow: var(--ombre);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .bouton-pdf-principal:hover { background: var(--accent-fonce); }
    .bouton-pdf-principal:active { transform: scale(0.98); }

    .bouton-pill-secondaire {
      margin-top: 0;
      width: 100%;
      padding: 11px 16px;
      font-family: var(--police);
      font-size: 13.5px;
      font-weight: 600;
      background: var(--surface);
      color: var(--texte);
      border: 1px solid var(--bordure);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }
    .bouton-pill-secondaire:hover { background: var(--accent-clair); }
    .bouton-pill-secondaire:active { transform: scale(0.98); }

    /* Export PDF : une vue imprimable de la semaine (7 jours d'un coup),
       masquée à l'écran et révélée uniquement par window.print(). Distincte
       de l'agenda jour par jour visible dans l'app. */
    .zone-impression { display: none; }
    @media print {
      .conteneur { display: none !important; }
      .zone-impression {
        display: block !important;
        padding: 24px;
        font-family: var(--police);
        color: #000;
      }
      .zone-impression h1 { font-family: var(--police); font-size: 20px; margin: 0 0 4px; }
      .impression-sous-titre { color: #555; font-size: 13px; margin: 0 0 20px; }
      .impression-jour { margin-bottom: 14px; break-inside: avoid; }
      .impression-jour-nom { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
      .impression-creneau { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13px; }
      .impression-creneau-couleur { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
      .impression-repos { color: #888; font-size: 13px; font-style: italic; }
    }
  </style>
</head>
<body>
  <div class="conteneur">
    <div class="logo-centre">
      <svg class="logo-marque" viewBox="0 0 100 100" width="56" height="56" aria-hidden="true">
        <path d="M50 12 L16 86" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none"/>
        <path d="M50 12 L84 86" stroke="currentColor" stroke-width="13" stroke-linecap="round" fill="none"/>
        <circle cx="50" cy="56" r="8" fill="currentColor"/>
      </svg>
    </div>
    <h1 id="titre">Bienvenue</h1>
    <p class="sous-titre texte-aide" id="sousTitre">Vérification de la connexion...</p>

    <div id="zoneContenu" style="display:none;">
      <div class="carte-jour">
        <div class="entete-jour">
          <button id="btnJourPrec" class="bouton-nav-jour" aria-label="Jour précédent">←</button>
          <div class="libelle-jour" id="libelleJour">Aujourd'hui</div>
          <button id="btnJourSuiv" class="bouton-nav-jour" aria-label="Jour suivant">→</button>
        </div>
        <p class="date-complete" id="dateComplete"></p>
        <p class="badge-meteo-jour" id="badgeMeteoJour" style="display:none;"></p>

        <div id="zoneRepos" class="zone-repos" style="display:none;">
          <p class="jour-repos-texte">Repos</p>
        </div>

        <div id="zoneTimeline" class="zone-timeline" style="display:none;">
          <div class="grille-jour" id="grilleJour"></div>
        </div>
      </div>

      <div class="boutons-actions-employe">
        <button id="btnTelechargerPdf" type="button" class="bouton-pdf-principal">📥 Télécharger le planning (PDF)</button>
        <button id="btnSyncCalendrier" type="button" class="bouton-pill-secondaire">📅 Synchroniser avec mon calendrier</button>
      </div>

      <button id="btnDeconnexion" class="bouton-deconnexion">Se déconnecter</button>
    </div>

    <div id="zoneNonAutorise" style="display:none;">
      <p class="texte-aide" style="text-align:center;">Cette page est réservée aux comptes employé. Connecte toi avec le compte concerné.</p>
      <a href="connexion.html" class="lien-retour" style="margin-top:6px;">← Retour à la connexion</a>
    </div>
  </div>

  <div id="zoneImpression" class="zone-impression"></div>

  <script>
    (function () {
      var SUPABASE_URL = "https://eqvbksxfwlgbcxgqljqn.supabase.co";
      var SUPABASE_KEY = "sb_publishable_Dlh12BadZ13vHrUR0o7O7Q_i3aN2VMc";
      var sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      var MP = window.MoteurPrevision;

      var titreEl = document.getElementById('titre');
      var sousTitreEl = document.getElementById('sousTitre');
      var zoneContenuEl = document.getElementById('zoneContenu');
      var zoneNonAutoriseEl = document.getElementById('zoneNonAutorise');
      var libelleJourEl = document.getElementById('libelleJour');
      var zoneReposEl = document.getElementById('zoneRepos');
      var zoneTimelineEl = document.getElementById('zoneTimeline');
      var grilleJourEl = document.getElementById('grilleJour');
      var dateCompleteEl = document.getElementById('dateComplete');
      var zoneImpressionEl = document.getElementById('zoneImpression');
      var btnJourPrec = document.getElementById('btnJourPrec');
      var btnJourSuiv = document.getElementById('btnJourSuiv');

      var moiPersonnel = null;
      var SECTEURS_PAR_ID = {};
      var POSTES_PAR_ID = {};
      var decalageJour = 0;
      var PX_PAR_HEURE = 34;
      var HAUTEUR_MIN_BLOC = 34;
      var meteoParIso = {};

      function dateDuJour(decalage) {
        return MP.ajouterJours(new Date(), decalage);
      }

      // Météo prévue du jour affiché (même principe que le planning patron :
      // géocodage une fois via le code postal du commerçant, prévision
      // Open-Meteo). Prévisionnelle uniquement (10 jours), comme ailleurs
      // dans l'app : pas de valeur pour un jour passé.
      function meteoDuJour(decalage) {
        var iso = MP.versISO(dateDuJour(decalage));
        var meteo = meteoParIso[iso];
        if (!meteo) return null;
        return meteo.icone + ' ' + meteo.libelle + (meteo.temperature !== null ? ', ' + meteo.temperature + '°C' : '');
      }

      function libelleJourAffiche(decalage) {
        if (decalage === 0) return "Aujourd'hui";
        if (decalage === 1) return 'Demain';
        if (decalage === -1) return 'Hier';
        var d = dateDuJour(decalage);
        return MP.capitaliser(MP.nomsJoursCourts[d.getDay()]) + ' ' + d.getDate() + ' ' + MP.nomsMoisCourts[d.getMonth()];
      }

      // Même logique que le décalage décimal du planning patron : une
      // heure de fin inférieure ou égale à l'heure de début signifie que le
      // créneau traverse minuit (ex. 19h - 02h ⇒ fin = 26).
      function heureVersDecimale(heureStr) {
        var p = (heureStr || '').toString().split(':');
        return parseInt(p[0], 10) + (parseInt(p[1], 10) || 0) / 60;
      }

      // Heure entière décimale -> "06h00" (gère aussi les heures > 24 pour
      // un créneau qui traverse minuit).
      function formatHeureEntiere(h) {
        var reel = ((h % 24) + 24) % 24;
        return (reel < 10 ? '0' : '') + reel + 'h00';
      }

      function rendreJour() {
        var jour = dateDuJour(decalageJour);
        var iso = MP.versISO(jour);
        libelleJourEl.textContent = libelleJourAffiche(decalageJour);
        dateCompleteEl.textContent = MP.formatDateLongue(jour);

        var badgeMeteoEl = document.getElementById('badgeMeteoJour');
        var texteMeteo = meteoDuJour(decalageJour);
        if (texteMeteo) {
          badgeMeteoEl.textContent = texteMeteo;
          badgeMeteoEl.style.display = 'inline-block';
        } else {
          badgeMeteoEl.style.display = 'none';
        }

        sbClient.from('creneaux_personnel').select('*')
          .eq('personnel_id', moiPersonnel.id)
          .eq('date_creneau', iso)
          .then(function (resultCreneaux) {
            var creneaux = (resultCreneaux.data || []).map(function (c) {
              var debut = heureVersDecimale(c.heure_debut);
              var fin = heureVersDecimale(c.heure_fin);
              if (fin <= debut) fin += 24;
              var travail = { debut: debut, fin: fin, secteurId: c.secteur_id, posteId: c.poste_id };
              if (c.pause_debut != null && c.pause_fin != null) {
                travail.pauseDebut = heureVersDecimale(c.pause_debut);
                travail.pauseFin = heureVersDecimale(c.pause_fin);
                if (travail.pauseFin <= travail.pauseDebut) { travail.pauseDebut += 24; travail.pauseFin += 24; }
              }
              return travail;
            }).sort(function (a, b) { return a.debut - b.debut; });

            if (creneaux.length === 0) {
              zoneReposEl.style.display = 'block';
              zoneTimelineEl.style.display = 'none';
              return;
            }

            zoneReposEl.style.display = 'none';
            zoneTimelineEl.style.display = 'block';

            // Cadre l'axe des heures sur les créneaux du jour (± 1h de
            // marge), plutôt qu'un axe fixe sur 24h : un employé qui
            // travaille 4h n'a pas besoin de faire défiler une journée
            // entière vide.
            var debutMin = Math.min.apply(null, creneaux.map(function (c) { return c.debut; }));
            var finMax = Math.max.apply(null, creneaux.map(function (c) { return c.fin; }));
            var axeDebut = Math.max(0, Math.floor(debutMin) - 1);
            var axeFin = Math.ceil(finMax) + 1;

            grilleJourEl.innerHTML = '';
            grilleJourEl.style.height = ((axeFin - axeDebut) * PX_PAR_HEURE) + 'px';

            for (var h = axeDebut; h < axeFin; h++) {
              var ligneHeure = document.createElement('div');
              ligneHeure.className = 'ligne-heure';
              ligneHeure.style.height = PX_PAR_HEURE + 'px';
              var libelleHeure = document.createElement('span');
              libelleHeure.className = 'ligne-heure-libelle';
              libelleHeure.textContent = formatHeureEntiere(h);
              ligneHeure.appendChild(libelleHeure);
              grilleJourEl.appendChild(ligneHeure);
            }

            creneaux.forEach(function (c) {
              var secteur = SECTEURS_PAR_ID[c.secteurId];
              var poste = POSTES_PAR_ID[c.secteurId + '|' + c.posteId];

              var bloc = document.createElement('div');
              bloc.className = 'bloc-jour';
              bloc.style.top = ((c.debut - axeDebut) * PX_PAR_HEURE) + 'px';
              bloc.style.height = Math.max((c.fin - c.debut) * PX_PAR_HEURE, HAUTEUR_MIN_BLOC) + 'px';
              bloc.style.background = secteur ? secteur.couleur : '#8a7cc7';

              if (c.pauseDebut != null) {
                var pause = document.createElement('div');
                pause.className = 'bloc-jour-pause';
                pause.style.top = ((c.pauseDebut - c.debut) * PX_PAR_HEURE) + 'px';
                pause.style.height = ((c.pauseFin - c.pauseDebut) * PX_PAR_HEURE) + 'px';
                bloc.appendChild(pause);
              }

              var corps = document.createElement('div');
              corps.className = 'bloc-jour-corps';

              var horaire = document.createElement('span');
              horaire.className = 'bloc-jour-horaire';
              horaire.textContent = formatHeureDecimale(c.debut) + ' – ' + formatHeureDecimale(c.fin);
              corps.appendChild(horaire);

              var libellePoste = document.createElement('span');
              libellePoste.className = 'bloc-jour-poste';
              var texte = secteur ? secteur.nom : '';
              if (poste && poste.nom && poste.nom !== 'Générique') texte += ' · ' + poste.nom;
              libellePoste.textContent = texte;
              corps.appendChild(libellePoste);

              if (c.pauseDebut != null) {
                var pauseTexte = document.createElement('span');
                pauseTexte.className = 'bloc-jour-pause-texte';
                pauseTexte.textContent = 'Pause ' + formatHeureDecimale(c.pauseDebut) + '–' + formatHeureDecimale(c.pauseFin);
                corps.appendChild(pauseTexte);
              }

              bloc.appendChild(corps);
              grilleJourEl.appendChild(bloc);
            });
          });
      }

      // Heure décimale (ex. 17.5) -> "17h30", pour l'affichage à l'intérieur
      // d'un bloc (converti depuis la valeur décimale, pas directement
      // depuis la chaîne SQL, car un créneau traversant minuit dépasse 24).
      function formatHeureDecimale(h) {
        var reel = ((h % 24) + 24) % 24;
        var heureEntiere = Math.floor(reel);
        var minutes = Math.round((reel - heureEntiere) * 60);
        if (minutes === 60) { heureEntiere = (heureEntiere + 1) % 24; minutes = 0; }
        return (heureEntiere < 10 ? '0' : '') + heureEntiere + 'h' + ('0' + minutes).slice(-2);
      }

      // Lundi de la semaine contenant "date" (dimanche = 0 en JS, on le
      // renvoie donc en fin de semaine, pas en tête).
      function lundiDeSemaine(date) {
        var jour = date.getDay();
        var decalage = (jour === 0) ? -6 : 1 - jour;
        return MP.ajouterJours(date, decalage);
      }

      function telechargerFichier(nomFichier, contenu, type) {
        var blob = new Blob([contenu], { type: type });
        var url = URL.createObjectURL(blob);
        var lien = document.createElement('a');
        lien.href = url;
        lien.download = nomFichier;
        document.body.appendChild(lien);
        lien.click();
        document.body.removeChild(lien);
        URL.revokeObjectURL(url);
      }

      // Construit la vue imprimable (7 jours d'un coup, cf. cahier des
      // charges), révélée uniquement via @media print au moment du
      // window.print() ; jamais affichée à l'écran.
      function construireImpressionSemaine(lundi, creneauxParJourIso) {
        var html = '<h1>Planning de ' + MP.formatNomAffichage(moiPersonnel.nom) + '</h1>';
        html += '<p class="impression-sous-titre">Semaine du ' + MP.formatDateLongue(lundi) + '</p>';
        for (var i = 0; i < 7; i++) {
          var jour = MP.ajouterJours(lundi, i);
          var creneauxJour = creneauxParJourIso[MP.versISO(jour)] || [];
          html += '<div class="impression-jour"><div class="impression-jour-nom">' + MP.formatDateLongue(jour) + '</div>';
          if (creneauxJour.length === 0) {
            html += '<div class="impression-repos">Repos</div>';
          } else {
            creneauxJour.forEach(function (c) {
              var secteur = SECTEURS_PAR_ID[c.secteur_id];
              var poste = POSTES_PAR_ID[c.secteur_id + '|' + c.poste_id];
              var texte = formatHeureDecimale(heureVersDecimale(c.heure_debut)) + ' – ' + formatHeureDecimale(heureVersDecimale(c.heure_fin));
              texte += ' · ' + (secteur ? secteur.nom : '');
              if (poste && poste.nom && poste.nom !== 'Générique') texte += ' (' + poste.nom + ')';
              html += '<div class="impression-creneau"><span class="impression-creneau-couleur" style="background:' + (secteur ? secteur.couleur : '#8a7cc7') + ';"></span><span>' + texte + '</span></div>';
            });
          }
          html += '</div>';
        }
        zoneImpressionEl.innerHTML = html;
      }

      function pad2(n) { return (n < 10 ? '0' : '') + n; }

      function dateHeureIcs(dateIso, heureStr) {
        var p = dateIso.split('-');
        var h = (heureStr || '00:00:00').split(':');
        return p[0] + p[1] + p[2] + 'T' + pad2(parseInt(h[0], 10) % 24) + pad2(parseInt(h[1], 10) || 0) + '00';
      }

      // Fichier .ics standard (import direct dans Google Agenda / Calendrier
      // Apple) : plus léger et plus fiable qu'une intégration OAuth par
      // fournisseur, et cohérent avec le principe "zéro friction".
      function genererIcs(creneaux) {
        var lignes = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//A Point//Planning employe//FR'];
        creneaux.forEach(function (c) {
          var secteur = SECTEURS_PAR_ID[c.secteur_id];
          var poste = POSTES_PAR_ID[c.secteur_id + '|' + c.poste_id];
          var titre = secteur ? secteur.nom : 'Shift';
          if (poste && poste.nom && poste.nom !== 'Générique') titre += ' - ' + poste.nom;

          var debut = heureVersDecimale(c.heure_debut);
          var fin = heureVersDecimale(c.heure_fin);
          var dateFinIso = c.date_creneau;
          if (fin <= debut) dateFinIso = MP.versISO(MP.ajouterJours(new Date(c.date_creneau), 1));

          lignes.push('BEGIN:VEVENT');
          lignes.push('UID:' + c.id + '@apointapp.fr');
          lignes.push('DTSTART:' + dateHeureIcs(c.date_creneau, c.heure_debut));
          lignes.push('DTEND:' + dateHeureIcs(dateFinIso, c.heure_fin));
          lignes.push('SUMMARY:' + titre);
          lignes.push('END:VEVENT');
        });
        lignes.push('END:VCALENDAR');
        return lignes.join('\r\n');
      }

      sbClient.auth.getSession().then(function (result) {
        var session = result.data.session;
        if (!session) {
          window.location.href = 'connexion.html';
          return;
        }
        var metadonnees = session.user.user_metadata || {};
        if (metadonnees.role !== 'employe') {
          sousTitreEl.textContent = '';
          zoneNonAutoriseEl.style.display = 'block';
          return;
        }

        sbClient.from('personnel').select('*').eq('user_id', session.user.id).then(function (resultPersonnel) {
          moiPersonnel = (resultPersonnel.data || [])[0];
          if (!moiPersonnel) {
            sousTitreEl.textContent = "Impossible de retrouver ta fiche employé. Contacte ton responsable.";
            return;
          }

          titreEl.textContent = 'Bonjour ' + MP.formatNomAffichage(moiPersonnel.nom) + ' !';
          sousTitreEl.textContent = 'Voici ton planning.';
          zoneContenuEl.style.display = 'block';

          Promise.all([
            sbClient.from('secteurs_personnel').select('*').eq('commercant_id', moiPersonnel.commercant_id).order('ordre', { ascending: true }),
            sbClient.from('postes_personnel').select('*').eq('commercant_id', moiPersonnel.commercant_id).order('ordre', { ascending: true }),
            sbClient.from('parametres_commercant').select('*').eq('commercant_id', moiPersonnel.commercant_id)
          ]).then(function (resultats) {
            (resultats[0].data || []).forEach(function (s) { SECTEURS_PAR_ID[s.id] = s; });
            (resultats[1].data || []).forEach(function (p) { POSTES_PAR_ID[p.secteur_id + '|' + p.id] = p; });
            var parametres = (resultats[2].data && resultats[2].data[0]) || null;

            var chaineMeteo = Promise.resolve();
            if (parametres && parametres.code_postal) {
              chaineMeteo = MP.obtenirCoordonnees(sbClient, parametres, moiPersonnel.commercant_id).then(function (coords) {
                if (!coords) return;
                return MP.recupererMeteoPrevue(coords.latitude, coords.longitude).then(function (meteo) {
                  meteoParIso = meteo || {};
                });
              }).catch(function () { /* météo indisponible : le planning reste utilisable sans */ });
            }
            chaineMeteo.then(function () { rendreJour(); });
          });
        });
      });

      btnJourPrec.addEventListener('click', function () { decalageJour--; rendreJour(); });
      btnJourSuiv.addEventListener('click', function () { decalageJour++; rendreJour(); });

      document.getElementById('btnTelechargerPdf').addEventListener('click', function () {
        var lundi = lundiDeSemaine(dateDuJour(decalageJour));
        var isoDebut = MP.versISO(lundi);
        var isoFin = MP.versISO(MP.ajouterJours(lundi, 6));
        sbClient.from('creneaux_personnel').select('*')
          .eq('personnel_id', moiPersonnel.id)
          .gte('date_creneau', isoDebut)
          .lte('date_creneau', isoFin)
          .then(function (resultat) {
            var parJour = {};
            (resultat.data || []).forEach(function (c) {
              if (!parJour[c.date_creneau]) parJour[c.date_creneau] = [];
              parJour[c.date_creneau].push(c);
            });
            Object.keys(parJour).forEach(function (iso) {
              parJour[iso].sort(function (a, b) { return a.heure_debut.localeCompare(b.heure_debut); });
            });
            construireImpressionSemaine(lundi, parJour);
            window.print();
          });
      });

      document.getElementById('btnSyncCalendrier').addEventListener('click', function () {
        var aujourdHui = MP.versISO(new Date());
        sbClient.from('creneaux_personnel').select('*')
          .eq('personnel_id', moiPersonnel.id)
          .gte('date_creneau', aujourdHui)
          .then(function (resultat) {
            var ics = genererIcs(resultat.data || []);
            var nomFichier = 'planning-' + MP.formatNomAffichage(moiPersonnel.nom).replace(/\s+/g, '-').toLowerCase() + '.ics';
            telechargerFichier(nomFichier, ics, 'text/calendar');
          });
      });

      document.getElementById('btnDeconnexion').addEventListener('click', function () {
        sbClient.auth.signOut().then(function () {
          window.location.href = 'connexion.html';
        });
      });
    })();
  </script>
</body>
</html>
