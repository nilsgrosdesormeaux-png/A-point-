<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>À Point - Recommandation</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 450px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .carte-produit {
      background-color: #f0f0f0;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }
    .carte-produit .nom {
      font-weight: bold;
      font-size: 16px;
    }
    .carte-produit .quantite {
      font-size: 28px;
      font-weight: bold;
      color: #2e7d32;
      margin: 5px 0;
    }
    .carte-produit .detail {
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Recommandation pour demain</h1>
  <p id="statutConnexion">Vérification de la connexion...</p>

  <div id="zoneResultats"></div>

  <script>
    (function () {
      var SUPABASE_URL = "https://eqvbksxfwlgbcxgqljqn.supabase.co";
      var SUPABASE_KEY = "sb_publishable_Dlh12BadZ13vHrUR0o7O7Q_i3aN2VMc";
      var sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      var statutDiv = document.getElementById('statutConnexion');
      var zoneResultats = document.getElementById('zoneResultats');
      var commercantId = null;

      function calculerRecommandation(ventesDuProduit) {
        var jourCible = new Date();
        jourCible.setDate(jourCible.getDate() + 1);
        var numeroJourCible = jourCible.getDay();

        var ventesMemeJour = ventesDuProduit.filter(function (vente) {
          var d = new Date(vente.date_vente);
          return d.getDay() === numeroJourCible;
        });

        var baseVentes = ventesMemeJour.length > 0 ? ventesMemeJour : ventesDuProduit;

        var somme = 0;
        baseVentes.forEach(function (vente) { somme += vente.quantite; });
        var moyenne = somme / baseVentes.length;

        var recommandation = Math.round(moyenne * 1.1);

        return {
          quantite: recommandation,
          nbJoursUtilises: baseVentes.length,
          memeJourSemaine: ventesMemeJour.length > 0
        };
      }

      sbClient.auth.getSession().then(function (result) {
        var session = result.data.session;
        if (!session) {
          statutDiv.textContent = "Tu n'es pas connecté. Va d'abord sur la page de connexion.";
          return;
        }

        commercantId = session.user.id;
        statutDiv.textContent = "Connecté en tant que : " + session.user.email;

        sbClient.from('ventes').select('*').eq('commercant_id', commercantId).then(function (result) {
          var ventes = result.data || [];

          if (ventes.length === 0) {
            zoneResultats.innerHTML = '<p>Aucune vente enregistrée pour l\'instant. Va sur la page "Mes ventes" pour en ajouter.</p>';
            return;
          }

          var parProduit = {};
          ventes.forEach(function (vente) {
            if (!parProduit[vente.nom_produit]) {
              parProduit[vente.nom_produit] = [];
            }
            parProduit[vente.nom_produit].push(vente);
          });

          zoneResultats.innerHTML = '';
          Object.keys(parProduit).forEach(function (nomProduit) {
            var resultat = calculerRecommandation(parProduit[nomProduit]);
            var div = document.createElement('div');
            div.className = 'carte-produit';
            var detailTexte = resultat.nbJoursUtilises + " jour(s) d'historique utilisé(s)";
            if (resultat.memeJourSemaine) {
              detailTexte += " (même jour de la semaine)";
            }
            div.innerHTML =
              '<div class="nom">' + nomProduit + '</div>' +
              '<div class="quantite">' + resultat.quantite + '</div>' +
              '<div class="detail">' + detailTexte + '</div>';
            zoneResultats.appendChild(div);
          });
        });
      });
    })();
  </script>
</body>
</html>
